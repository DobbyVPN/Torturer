name: Torturer self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Contract and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Torturer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run standard-library test suite
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python3 -m compileall -q torturer_contract tests
