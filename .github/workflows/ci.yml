name: Torturer self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Contract and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Torturer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Run standard-library test suite
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Python sources
        run: python3 -m compileall -q torturer_checks torturer_contract tests
