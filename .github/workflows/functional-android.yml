              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": "android",
              "source_sha": os.environ["SOURCE_SHA"],
              "state": "issued",
          }
          expected_keys = set(expected) | {"services"}
          if set(value) != expected_keys:
              raise SystemExit("Android safe lease record has an unsafe shape")
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          services = value.get("services")
          if not isinstance(services, list) or len(services) != 2:
              raise SystemExit("Android lease service bundle is invalid")
          expected_digests = {
              "outline": os.environ["SERVER_IMAGE_DIGEST"],
              "upload-sink": os.environ["SERVER_SINK_IMAGE_DIGEST"],
          }
          by_role = {}
          for service in services:
              if not isinstance(service, dict) or set(service) != {"role", "service_id", "image_digest", "provider_generation"}:
                  raise SystemExit("Android lease service shape is invalid")
              role = service["role"]
              if role not in expected_digests or role in by_role:
                  raise SystemExit("Android lease service roles are incomplete or duplicated")
              by_role[role] = service
              if not isinstance(service["service_id"], str) or not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["service_id"]):
                  raise SystemExit("lease service id is invalid")
              if not isinstance(service["image_digest"], str) or service["image_digest"] != expected_digests[role]:
                  raise SystemExit("Android lease service image identity is invalid")
              if not isinstance(service["provider_generation"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["provider_generation"]):
                  raise SystemExit("lease provider generation is invalid")
          if set(by_role) != set(expected_digests):
              raise SystemExit("Android lease service roles are incomplete or duplicated")
          service_ids = [service["service_id"] for service in services]
          if len(service_ids) != len(set(service_ids)):
              raise SystemExit("Android lease service IDs must be distinct")
          if any(token in json.dumps(value).lower() for token in ("url", "path", "password", "secret")):
              raise SystemExit("Android safe lease record contains private handoff data")
          print("lease_record=validated")
          PY
          "$DEADLINE_COMMAND" 60 openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"
          "$DEADLINE_COMMAND" 60 openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/upload.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/upload-url.txt"
          chmod 600 "$HANDOFF_DIR/upload-url.txt"
          test -s "$HANDOFF_DIR/upload-url.txt"
          python3 - "$HANDOFF_DIR/upload-url.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]{1,253}/upload/[0-9a-f]{32}", value):
              raise SystemExit("encrypted upload URL is invalid")
          print("upload_handoff=validated")
          PY

      - name: Run canonical Android functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          # Android's six applicable canonical scenarios plus resets have a 633-second declared maximum.
          if [ "$remaining" -lt 650 ]; then printf 'insufficient Android canonical budget before cleanup reserve: seconds=%s\n' "$remaining" >&2; exit 1; fi
          if [ "$remaining" -gt 1260 ]; then remaining=1260; fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          upload_url="$(cat "$HANDOFF_DIR/upload-url.txt")"
          test -n "$upload_url"
          python3 -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            python3 -m torturer_checks.hosted.run --platform android \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --platform-version "35" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --identity-url "https://api.ipify.org" \
            --latency-url "https://proof.ovh.net/files/1Mb.dat" \
            --download-url "https://proof.ovh.net/files/1Mb.dat" --upload-url "$upload_url" \
            --adb "$ADB_PATH"

      - name: Report safe Android command diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          diagnostic="$HANDOFF_DIR/android-command-diagnostic.txt"
          transport_summary="$HANDOFF_DIR/android-transport-summary.txt"
          : > "$diagnostic"
          # Keep derived parsing bounded while retaining every raw command
          # stream in the owner-only handoff directory.  Reserve the complete
          # downstream emulator cleanup tail before starting this child.
          "$DEADLINE_COMMAND" --reserve 70 10 python3 - "$HANDOFF_DIR/hosted-command-raw" "$diagnostic" "$transport_summary" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          raw_dir = Path(sys.argv[1])
          output = Path(sys.argv[2])
          summary = Path(sys.argv[3])
          files = sorted(raw_dir.glob("command-*.raw.log")) if raw_dir.is_dir() else []

          def section(payload: bytes, name: str) -> bytes:
              match = re.search(
                  rb"(?ms)^" + name.encode("ascii") + rb"-begin\n(.*?)\n" +
                  name.encode("ascii") + rb"-end\n",
                  payload,
              )
              return match.group(1) if match else b""

          def command_line(payload: bytes) -> str:
              match = re.search(rb"^argv=(.*)$", payload, re.MULTILINE)
              return match.group(1).decode("utf-8", errors="replace") if match else ""

          def operation(argv: str) -> str:
              lower = argv.lower()
              if "run-as" in lower and "cat > files/" in lower:
                  if ".profile" in lower:
                      return "profile-stage"
                  if ".command.json" in lower:
                      return "command-stage"
              if "run-as" in lower and "chmod" in lower:
                  if ".profile" in lower:
                      return "profile-chmod"
                  if ".command.json" in lower:
                      return "command-chmod"
              if " am instrument " in f" {lower} ":
                  return "instrumentation"
              if " exec-out " in f" {lower} ":
                  return "observation"
              if " logcat " in f" {lower} ":
                  return "logcat"
              if " dumpsys " in f" {lower} ":
                  return "dumpsys"
              if " shell ps " in f" {lower} ":
                  return "process-list"
              if " shell pidof " in f" {lower} ":
                  return "process-probe"
              if " shell run-as " in f" {lower} " and " rm " in f" {lower} ":
                  return "private-cleanup"
              if " shell rm " in f" {lower} ":
                  return "temporary-cleanup"
              if " force-stop " in f" {lower} ":
                  return "force-stop"
              return "other"

          def stderr_code(stderr: bytes) -> str:
              lower = stderr.decode("utf-8", errors="replace").lower()
              markers = (
                  ("not debuggable", "NOT_DEBUGGABLE"),
                  ("permission denied", "PERMISSION_DENIED"),
                  ("access denied", "ACCESS_DENIED"),
                  ("unknown package", "PACKAGE_UNKNOWN"),
                  ("package not found", "PACKAGE_MISSING"),
                  ("does not exist", "PATH_MISSING"),
                  ("no such file", "PATH_MISSING"),
                  ("cannot create", "CREATE_FAILED"),
                  ("can't create", "CREATE_FAILED"),
                  ("read-only file system", "READ_ONLY_FILESYSTEM"),
                  ("closed", "CHANNEL_CLOSED"),
                  ("broken pipe", "BROKEN_PIPE"),
                  ("protocol fault", "PROTOCOL_FAULT"),
              )
              for marker, code in markers:
                  if marker in lower:
                      return code
              return "NONEMPTY" if lower.strip() else "EMPTY"

          def safe_stderr_display(stderr: bytes) -> str:
              """Expose a bounded, secret-safe reason without replacing raw evidence."""
              value = stderr.decode("utf-8", errors="replace").replace("\x00", " ")
              value = re.sub(r"(?i)(?:[A-Za-z]:[\\/]|/)[^\r\n]*", "<path>", value)
              value = re.sub(
                  r"(?i)\b(?:token|key|secret|password|authorization)\b\s*[:=]\s*\S+",
                  "<redacted>",
                  value,
              )
              value = re.sub(r"(?i)\b[0-9a-f]{32,}\b", "<hex>", value)
              value = " ".join(value.split())
              return value[:240] if value else "<empty>"

          def classify(argv: str, output: str, returncode: str, op: str) -> str:
              lower = output.lower()
              command_lower = argv.lower()
              if "run-as" in command_lower and "not debuggable" in lower:
                  return "RUN_AS_NOT_DEBUGGABLE"
              if "run-as" in command_lower and any(
                  marker in lower for marker in ("permission denied", "access denied", "denied")
              ):
                  return "RUN_AS_PERMISSION_DENIED"
              if "run-as" in command_lower and any(
                  marker in lower
                  for marker in ("package not found", "unknown package", "does not exist")
              ):
                  return "RUN_AS_PACKAGE_MISSING"
              if "run-as" in command_lower and "not found" in lower:
                  return "RUN_AS_COMMAND_UNAVAILABLE"
              if op in {"profile-stage", "command-stage"} and any(
                  marker in lower for marker in ("broken pipe", "stdin", "standard input")
              ):
                  return "ADB_STDIN_FAILED"
              if any(
                  marker in lower
                  for marker in ("device offline", "no devices", "device not found", "device unauthorized")
              ):
                  return "ADB_DEVICE_UNAVAILABLE"
              if returncode == "0":
                  return "OK"
              if returncode != "unknown":
                  return "COMMAND_FAILED"
              return "RAW_FORMAT_INVALID"

          output.write_text("schema=1\n", encoding="ascii")
          records = []
          with output.open("a", encoding="ascii") as stream:
              for sequence, path in enumerate(files, start=1):
                  payload = path.read_bytes()
                  match = re.search(rb"^returncode=([^\n]*)$", payload, re.MULTILINE)
                  returncode = match.group(1).decode("ascii", errors="replace") if match else "unknown"
                  argv = command_line(payload)
                  stdout = section(payload, "stdout")
                  stderr = section(payload, "stderr")
                  output = stdout + b"\n" + stderr
                  op = operation(argv)
                  code = classify(argv, output.decode("utf-8", errors="replace"), returncode, op)
                  stderr_digest = hashlib.sha256(stderr).hexdigest()
                  records.append((sequence, op, code, returncode, len(stdout)))
                  stream.write(
                      f"android_command_diagnostic sequence={sequence} operation={op} "
                      f"code={code} returncode={returncode} stdout_bytes={len(stdout)} "
                      f"stderr_bytes={len(stderr)} stderr_code={stderr_code(stderr)} "
                      f"stderr_sha256={stderr_digest} "
                      f"stderr_display={json.dumps(safe_stderr_display(stderr), ensure_ascii=True)} "
                      f"raw_bytes={len(payload)}\n"
                  )
          logcat_records = [record for record in records if record[1] == "logcat"]
          offline_records = [record for record in records if record[2] == "ADB_DEVICE_UNAVAILABLE"]
          failed_logcat_records = [record for record in logcat_records if record[3] != "0"]
          if offline_records:
              transport_state = "ADB_DEVICE_OFFLINE"
          elif failed_logcat_records:
              transport_state = "ADB_LOGCAT_COMMAND_FAILED"
          else:
              transport_state = "ADB_TRANSPORT_NOT_FAILED"
          summary.write_text(
              "schema=1\n"
              f"transport_state={transport_state}\n"
              f"command_count={len(records)}\n"
              f"logcat_command_count={len(logcat_records)}\n"
              f"logcat_nonzero_count={len(failed_logcat_records)}\n"
              f"logcat_stdout_bytes={sum(record[4] for record in logcat_records)}\n"
              f"adb_device_unavailable_count={len(offline_records)}\n"
              f"first_logcat_failure_sequence={failed_logcat_records[0][0] if failed_logcat_records else 'none'}\n"
              f"first_device_unavailable_sequence={offline_records[0][0] if offline_records else 'none'}\n",
              encoding="ascii",
          )
          PY
          chmod 600 "$diagnostic"
          chmod 600 "$transport_summary"
          cat "$diagnostic"
          cat "$transport_summary"

      - name: Upload safe Android command diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: android-command-diagnostic-${{ env.LEASE_RUN_ID }}
          path: |
            ${{ env.HANDOFF_DIR }}/android-command-diagnostic.txt
            ${{ env.HANDOFF_DIR }}/android-transport-summary.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop Android emulator and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          adb="${ADB_PATH:-${ANDROID_SDK_ROOT:-}/platform-tools/adb}"
          # Keep the complete cleanup phase inside the client’s 120-second
          # finalization reserve.  Seven adb operations are each capped at
          # 4s plus a 1s kill grace; host process-group proof is capped at
          # 15s TERM observation + 5s TERM grace + 5s KILL grace, and the
          # emulator log drain is capped at 5s.  The policy test proves this
          # 65-second worst-case arithmetic, leaving time for artifact/key
          # finalization without relying on the outer job kill.
          adb_timeout_seconds=4
          adb_kill_grace_seconds=1
          adb_transport_state=NOT_PROBED
          adb_transport_probe_status=NOT_RUN
          emulator_shutdown_request=NOT_ATTEMPTED
          emulator_process_state=NOT_RECORDED
          emulator_exit_status_state=MISSING
          emulator_exit_status_value=NOT_CAPTURED
          emulator_cleanup_failure=false
          adb_bounded() {
            timeout --foreground --signal=TERM --kill-after="${adb_kill_grace_seconds}s" "${adb_timeout_seconds}s" "$adb" "$@"
          }
          adb_cleanup_evidence() {
            label="$1"
            shift
            cleanup_log="$SERVICE_DIR/cleanup-${label}.raw.log"
            cleanup_status=0
            adb_bounded "$@" > "$cleanup_log" 2>&1 || cleanup_status=$?
            emit_private_evidence "android-cleanup-${label}" "$cleanup_log"
            return "$cleanup_status"
          }
          if [ -x "$adb" ]; then
            if ! adb_cleanup_evidence force-stop-app shell am force-stop com.dobby.vpn; then
              printf 'android_cleanup_force_stop_app=failed\n' >&2
              emulator_cleanup_failure=true
            fi
            if ! adb_cleanup_evidence force-stop-test shell am force-stop com.dobby.vpn.test; then
              printf 'android_cleanup_force_stop_test=failed\n' >&2
              emulator_cleanup_failure=true
            fi
            uninstall_test_status=0
            adb_cleanup_evidence uninstall-test uninstall com.dobby.vpn.test || uninstall_test_status=$?
            if [ "$uninstall_test_status" -eq 0 ]; then
              printf 'android_test_package_removed=true\n'
            else
              uninstall_test_output="$(<"$SERVICE_DIR/cleanup-uninstall-test.raw.log")"
              case "$uninstall_test_output" in
                *'Unknown package'*|*'unknown package'*|*'not installed'*)
                  printf 'android_test_package_removal=not-installed\n'
                  ;;
                *)
                  printf 'android_test_package_removal=failed status=%s\n' "$uninstall_test_status" >&2
                  emulator_cleanup_failure=true
                  ;;
              esac
            fi
            uninstall_app_status=0
            adb_cleanup_evidence uninstall-app uninstall com.dobby.vpn || uninstall_app_status=$?
            if [ "$uninstall_app_status" -eq 0 ]; then
              printf 'android_package_removed=true\n'
            else
              uninstall_app_output="$(<"$SERVICE_DIR/cleanup-uninstall-app.raw.log")"
              case "$uninstall_app_output" in
                *'Unknown package'*|*'unknown package'*|*'not installed'*)
                  printf 'android_package_removal=not-installed\n'
                  ;;
                *)
                  printf 'android_package_removal=failed status=%s\n' "$uninstall_app_status" >&2
                  emulator_cleanup_failure=true
                  ;;
              esac
            fi
            transport_probe_log="$SERVICE_DIR/cleanup-transport-state.raw.log"
            transport_probe_status=0
            adb_bounded get-state > "$transport_probe_log" 2>&1 || transport_probe_status=$?
            emit_private_evidence android-cleanup-transport-state "$transport_probe_log"
            adb_transport_probe_status="$transport_probe_status"
            if [ "$transport_probe_status" -eq 0 ]; then
              transport_probe_value="$(tr -d '[:space:]' < "$transport_probe_log")"
              case "$transport_probe_value" in
                device) adb_transport_state=DEVICE_READY;;
                offline) adb_transport_state=DEVICE_OFFLINE;;
                unknown) adb_transport_state=DEVICE_UNKNOWN;;
                *) adb_transport_state=STATE_UNEXPECTED;;
              esac
            else
              adb_transport_state=COMMAND_FAILED
              emulator_cleanup_failure=true
            fi
            if adb_cleanup_evidence emulator-kill emu kill; then
              emulator_shutdown_request=REQUESTED
              printf 'android_emulator_shutdown_requested=true\n'
            else
              emulator_shutdown_request=FAILED_OR_ALREADY_STOPPED
              printf 'android_emulator_shutdown_request=failed-or-already-stopped\n'
              emulator_cleanup_failure=true
            fi
            if ! adb_cleanup_evidence devices devices -l; then
              printf 'android_cleanup_devices_probe=failed\n' >&2
              emulator_cleanup_failure=true
            fi
          else
            adb_transport_state=ADB_UNAVAILABLE
            printf 'adb_missing_during_cleanup=true\n' >&2
            emulator_cleanup_failure=true
          fi
          emulator_pid="${EMULATOR_PID:-}"
          if [ -n "${HANDOFF_DIR:-}" ] && [ -f "$HANDOFF_DIR/emulator.pid" ]; then
            emulator_pid="$(sed -n '1p' "$HANDOFF_DIR/emulator.pid")"
          fi
          emulator_identity_path=""
          if [ -n "${EMULATOR_IDENTITY_FILE:-}" ]; then
            emulator_identity_path="$EMULATOR_IDENTITY_FILE"
          elif [ -n "${HANDOFF_DIR:-}" ]; then
            emulator_identity_path="$HANDOFF_DIR/emulator.identity"
          fi
          identity_valid=false
          expected_start_time=""
          expected_pgrp=""
          identity_pid=""
          if [ -n "$emulator_identity_path" ] && [ -f "$emulator_identity_path" ]; then
            emit_private_evidence android-emulator-identity "$emulator_identity_path"
            identity_pid="$(sed -n 's/^pid=\([0-9][0-9]*\) .*$/\1/p' "$emulator_identity_path")"
            expected_start_time="$(sed -n 's/.*start_time=\([0-9][0-9]*\).*/\1/p' "$emulator_identity_path")"
            expected_pgrp="$(sed -n 's/.*process_group=\([0-9][0-9]*\).*/\1/p' "$emulator_identity_path")"
            identity_state="$(sed -n 's/.*state=\([^ ]*\).*/\1/p' "$emulator_identity_path")"
            if [ "$identity_pid" = "$emulator_pid" ] && \
              [[ "$expected_start_time" =~ ^[1-9][0-9]*$ ]] && \
              [[ "$expected_pgrp" =~ ^[1-9][0-9]*$ ]] && \
              [ "$identity_state" != unavailable ]; then
              identity_valid=true
            else
              printf 'android_emulator_identity=invalid pid=%s start_time=%s process_group=%s state=%s\n' \
                "$identity_pid" "$expected_start_time" "$expected_pgrp" "$identity_state" >&2
            fi
          elif [ -n "$emulator_pid" ]; then
            printf 'android_emulator_identity=missing pid=%s\n' "$emulator_pid" >&2
          fi
          read_emulator_identity() {
            identity_pid_value="$1"
            identity_stat="/proc/$identity_pid_value/stat"
            [ -r "$identity_stat" ] || return 1
            if ! identity_line="$(<"$identity_stat")"; then
              return 1
            fi
            identity_rest="${identity_line#*) }"
            if ! read -r identity_state_value identity_ppid_value identity_pgrp_value identity_session_value identity_tty_value identity_tpgid_value \
              identity_flags_value identity_minflt_value identity_cminflt_value identity_majflt_value identity_cmajflt_value \
              identity_utime_value identity_stime_value identity_cutime_value identity_cstime_value identity_priority_value identity_nice_value \
              identity_threads_value identity_itrealvalue_value identity_starttime_value identity_extra_value <<< "$identity_rest"; then
              return 1
            fi
            case "$identity_state_value:$identity_pgrp_value:$identity_starttime_value" in
              [A-Za-z]:[1-9][0-9]*:[1-9][0-9]*)
                printf 'pid=%s state=%s start_time=%s process_group=%s\n' \
                  "$identity_pid_value" "$identity_state_value" "$identity_starttime_value" "$identity_pgrp_value"
                ;;
              *) return 1;;
            esac
          }
          scan_process_group() {
            process_group_scan_complete=true
            process_group_has_member=false
            process_group_has_running=false
            for identity_stat_path in /proc/[0-9]*/stat; do
              if [ ! -r "$identity_stat_path" ]; then
                # A process may disappear between glob expansion and this
                # probe.  That is not an unreadable record; an existing but
                # unreadable record is an incomplete proof and must fail
                # closed.
                if [ -e "$identity_stat_path" ]; then
                  process_group_scan_complete=false
                fi
                continue
              fi
              if ! identity_line="$(<"$identity_stat_path")"; then
                if [ -e "$identity_stat_path" ]; then
                  process_group_scan_complete=false
                fi
                continue
              fi
              identity_rest="${identity_line#*) }"
              if ! read -r identity_state_value identity_ppid_value identity_pgrp_value identity_rest_value <<< "$identity_rest"; then
                if [ -e "$identity_stat_path" ]; then
                  process_group_scan_complete=false
                fi
                continue
              fi
              if ! [[ "$identity_state_value" =~ ^[A-Za-z]$ ]] || \
                ! [[ "$identity_pgrp_value" =~ ^[1-9][0-9]*$ ]]; then
                process_group_scan_complete=false
                continue
              fi
              if [ "$identity_pgrp_value" = "$expected_pgrp" ]; then
                process_group_has_member=true
                case "$identity_state_value" in
                  Z|X|x) ;;
                  *) process_group_has_running=true;;
                esac
              fi
            done
          }
          process_group_state() {
            if [ "$identity_valid" != true ]; then
              printf 'identity-missing\n'
              return 0
            fi
            current_identity=""
            if current_identity="$(read_emulator_identity "$emulator_pid")"; then
              current_start_time="$(sed -n 's/.*start_time=\([0-9][0-9]*\).*/\1/p' <<< "$current_identity")"
              current_pgrp="$(sed -n 's/.*process_group=\([0-9][0-9]*\).*/\1/p' <<< "$current_identity")"
              current_state="$(sed -n 's/.*state=\([^ ]*\).*/\1/p' <<< "$current_identity")"
              if [ "$current_start_time" != "$expected_start_time" ] || [ "$current_pgrp" != "$expected_pgrp" ]; then
                printf 'identity-mismatch\n'
                return 0
              fi
              scan_process_group
              if [ "$process_group_scan_complete" != true ]; then
                printf 'android_emulator_proc_scan=incomplete\n' >&2
                printf 'scan-incomplete\n'
              elif [ "$process_group_has_running" = true ]; then
                printf 'alive\n'
              elif [ "$process_group_has_member" = true ]; then
                printf 'zombie-only\n'
              else
                printf 'gone\n'
              fi
              return 0
            fi
            scan_process_group
            if [ "$process_group_scan_complete" != true ]; then
              printf 'android_emulator_proc_scan=incomplete\n' >&2
              printf 'scan-incomplete\n'
            elif [ "$process_group_has_member" = true ]; then
              printf 'identity-mismatch\n'
            else
              printf 'gone\n'
            fi
          }
          case "$emulator_pid" in
            "") printf 'android_emulator_pid=not-recorded\n';;
            0|*[!0-9]*) printf 'invalid emulator pid=%s\n' "$emulator_pid" >&2; emulator_process_state=INVALID; emulator_cleanup_failure=true;;
            *)
              stopped=false
              identity_abort=false
              signal_failure=false
              for attempt in $(seq 1 15); do
                group_state="$(process_group_state)"
                case "$group_state" in
                  gone) stopped=true; emulator_process_state=STOPPED; break;;
                  zombie-only) stopped=true; emulator_process_state=STOPPED_ZOMBIE; printf 'android_emulator_zombie_only=true\n'; break;;
                  identity-missing|identity-mismatch|scan-incomplete)
                    emulator_process_state=IDENTITY_MISMATCH
                    emulator_cleanup_failure=true
                    identity_abort=true
                    printf 'android_emulator_cleanup=identity-mismatch state=%s\n' "$group_state" >&2
                    break
                    ;;
                  alive)
                    printf 'android_emulator_cleanup_attempt=%s pid=%s process_group=%s\n' "$attempt" "$emulator_pid" "$expected_pgrp"
                    ;;
                esac
                sleep 1
              done
              if [ "$identity_abort" != true ] && [ "$stopped" != true ]; then
                printf 'android_emulator_term_group=%s\n' "$expected_pgrp"
                if ! kill -TERM -- "-$expected_pgrp"; then
                  signal_failure=true
                  printf 'android_emulator_term_group=signal-failed\n' >&2
                fi
                for attempt in $(seq 1 5); do
                  group_state="$(process_group_state)"
                  case "$group_state" in
                    gone) stopped=true; emulator_process_state=STOPPED; signal_failure=false; break;;
                    zombie-only) stopped=true; emulator_process_state=STOPPED_ZOMBIE; printf 'android_emulator_zombie_only=true\n'; break;;
                    identity-missing|identity-mismatch|scan-incomplete)
                      emulator_process_state=IDENTITY_MISMATCH
                      emulator_cleanup_failure=true
                      identity_abort=true
                      printf 'android_emulator_cleanup=identity-mismatch state=%s\n' "$group_state" >&2
                      break
                      ;;
                  esac
                  sleep 1
                done
              fi
              if [ "$identity_abort" != true ] && [ "$stopped" != true ]; then
                printf 'android_emulator_kill_group=%s\n' "$expected_pgrp"
                if ! kill -KILL -- "-$expected_pgrp"; then
                  signal_failure=true
                  printf 'android_emulator_kill_group=signal-failed\n' >&2
                fi
                for attempt in $(seq 1 5); do
                  group_state="$(process_group_state)"
                  case "$group_state" in
                    gone) stopped=true; emulator_process_state=STOPPED; signal_failure=false; printf 'android_emulator_post_kill_verified=true\n'; break;;
                    zombie-only) stopped=true; emulator_process_state=STOPPED_ZOMBIE; printf 'android_emulator_post_kill_verified=true state=zombie-only\n'; break;;
                    identity-missing|identity-mismatch|scan-incomplete)
                      emulator_process_state=IDENTITY_MISMATCH
                      emulator_cleanup_failure=true
                      identity_abort=true
                      printf 'android_emulator_cleanup=identity-mismatch state=%s\n' "$group_state" >&2
                      break
                      ;;
                  esac
                  printf 'android_emulator_post_kill_check=%s\n' "$attempt"
                  sleep 1
                done
              fi
              if [ "$stopped" != true ] && [ "$identity_abort" != true ]; then
                emulator_process_state=SURVIVED
                emulator_cleanup_failure=true
              fi
              if [ "$signal_failure" = true ]; then
                printf 'android_emulator_cleanup=signal-failure-unproven\n' >&2
                emulator_cleanup_failure=true
              fi
              ;;
          esac
          if [ -n "${EMULATOR_LOG:-}" ] && [ -f "$EMULATOR_LOG" ]; then
            emit_private_evidence android-emulator-log "$EMULATOR_LOG"
            emulator_log_bytes="$(wc -c < "$EMULATOR_LOG" | tr -d '[:space:]')"
            emulator_log_sha256="$(sha256sum "$EMULATOR_LOG" | awk '{print $1}')"
          else
            emulator_log_bytes=0
            emulator_log_sha256=missing
          fi
          emulator_status_path=""
          if [ -n "${EMULATOR_EXIT_STATUS_FILE:-}" ]; then
            emulator_status_path="$EMULATOR_EXIT_STATUS_FILE"
          elif [ -n "${HANDOFF_DIR:-}" ]; then
            emulator_status_path="$HANDOFF_DIR/emulator-exit-status.raw.log"
          fi
          if [ -n "$emulator_status_path" ] && [ -f "$emulator_status_path" ]; then
            emit_private_evidence android-emulator-exit-status "$emulator_status_path"
            recorded_status="$(sed -n 's/^emulator_exit_status=\([0-9][0-9]*\)$/\1/p' "$emulator_status_path")"
            if [ -n "$recorded_status" ]; then
              emulator_exit_status_state=RECORDED
              emulator_exit_status_value="$recorded_status"
            else
              emulator_exit_status_state=INVALID
              emulator_exit_status_value=NOT_CAPTURED
              emulator_cleanup_failure=true
            fi
          elif [ "$emulator_process_state" = STOPPED ]; then
            emulator_exit_status_state=MISSING
            emulator_exit_status_value=NOT_CAPTURED
            emulator_cleanup_failure=true
          else
            emulator_exit_status_state=NOT_YET_RECORDED
            emulator_exit_status_value=NOT_CAPTURED
          fi
          emulator_summary="$HANDOFF_DIR/android-emulator-exit-summary.txt"
          {
            printf 'schema=1\n'
            printf 'transport_state=%s\n' "$adb_transport_state"
            printf 'transport_probe_status=%s\n' "$adb_transport_probe_status"
            printf 'emulator_shutdown_request=%s\n' "$emulator_shutdown_request"
            printf 'emulator_process_state=%s\n' "$emulator_process_state"
            printf 'emulator_exit_status_state=%s\n' "$emulator_exit_status_state"
            printf 'emulator_exit_status=%s\n' "$emulator_exit_status_value"
            printf 'emulator_log_bytes=%s\n' "${emulator_log_bytes:-0}"
            printf 'emulator_log_sha256=%s\n' "${emulator_log_sha256:-missing}"
          } > "$emulator_summary"
          chmod 600 "$emulator_summary"
          emit_private_evidence android-emulator-exit-summary "$emulator_summary"
          cat "$emulator_summary"
          if [ "$emulator_cleanup_failure" = true ]; then exit 1; fi

      - name: Remove plaintext handoff material
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/upload-url.txt" "$HANDOFF_DIR/recipient.key"

      - name: Upload safe Android emulator and transport summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: android-emulator-summary-${{ env.LEASE_RUN_ID }}
          path: |
            ${{ env.HANDOFF_DIR }}/android-emulator-exit-summary.txt
            ${{ env.HANDOFF_DIR }}/android-transport-summary.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload safe Android functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-android
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque Android completion marker
        if: always()
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=android\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque Android completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-android
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

  controller:
    name: Dispatch isolated Android Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: android
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
          set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and Android lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for Android client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python3 - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 180); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python3 - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Android Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" -f "inputs[mode]=acquire" -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
            -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
            -f "inputs[origin_workflow_path]=.github/workflows/functional-android.yml" -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
            -f "inputs[platform]=${PLATFORM}" -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
