name: Trusted functional Android

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Android candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install exact Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          toolchain_dir="$RUNNER_TEMP/android-build-toolchain"
          mkdir -p "$toolchain_dir"
          emit_private_evidence() {
            label="$1"
            file="$2"
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
            printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
              "$label" "$evidence_id" "$bytes" "$digest"
          }
          sdk_install_log="$toolchain_dir/sdkmanager-install.raw.log"
          sdk_install_status=0
          timeout --foreground --signal=TERM --kill-after=10s 300s sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > "$sdk_install_log" 2>&1 || sdk_install_status=$?
          emit_private_evidence android-build-sdkmanager-install "$sdk_install_log"
          if [ "$sdk_install_status" -ne 0 ]; then
            printf 'android_build_toolchain=failed code=SDKMANAGER_INSTALL status=%s\n' "$sdk_install_status" >&2
            exit "$sdk_install_status"
          fi
          sdk_list_log="$toolchain_dir/sdkmanager-list.raw.log"
          sdk_list_status=0
          timeout --foreground --signal=TERM --kill-after=10s 30s sdkmanager --list_installed > "$sdk_list_log" 2>&1 || sdk_list_status=$?
          emit_private_evidence android-build-sdkmanager-list "$sdk_list_log"
          if [ "$sdk_list_status" -ne 0 ]; then
            printf 'android_build_toolchain=failed code=SDKMANAGER_LIST status=%s\n' "$sdk_list_status" >&2
            exit "$sdk_list_status"
          fi
          printf 'ANDROID_NDK_HOME=%s/ndk/27.2.12479018\n' "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download candidate Go modules
        shell: bash
        working-directory: candidate/go_module
        run: |
          set -euo pipefail
          go mod download
          go mod tidy

      - name: Install pinned gomobile toolchain
        shell: bash
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          mobile_version='v0.0.0-20260520154334-0e4426e1883d'
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
          gopath="$(go env GOPATH)"
          tool_dir="$gopath/bin"
          mkdir -p "$gopath/pkg/gomobile"
          export PATH="$tool_dir:$PATH"
          echo "$tool_dir" >> "$GITHUB_PATH"
          for tool in gomobile gobind; do
            test -x "$tool_dir/$tool"
            go version -m "$tool_dir/$tool" | \
              grep -F 'golang.org/x/mobile' | \
              grep -F "$mobile_version"
          done
          cd "$GITHUB_WORKSPACE/candidate/go_module"
          go get "golang.org/x/mobile/bind@$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          if ! git -C "$CANDIDATE_DIR" diff --no-ext-diff --exit-code --; then
            echo "candidate source mutated during pinned mobile preparation" >&2
            git -C "$CANDIDATE_DIR" diff --no-ext-diff -- >&2
            exit 1
          fi
          test -z "$(git -C "$CANDIDATE_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Verify checkout and build Android candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          timeout --foreground --signal=TERM --kill-after=10s 480s ./kmp_module/gradlew -p kmp_module --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PprojectRepositoryCommit="$SOURCE_SHA" \
            -PprojectRepositoryCommitLink="https://github.com/$SOURCE_REPOSITORY/tree/$SOURCE_SHA"
          sha256sum kmp_module/app/build/outputs/apk/debug/app-debug.apk \
            kmp_module/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Stage exact allow-listed Android candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python3 torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-android" \
            --platform android --architecture x86_64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated Android candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-android-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-android
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: android
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/dobbyvpn-render-handoff"
          service="$RUNNER_TEMP/dobbyvpn-service"
          mkdir -p "$handoff" "$service"
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nRESULT_PATH=%s\nLEASE_RUN_ID=unassigned\n' \
            "$handoff" "$service" "$handoff/functional-result.json" >> "$GITHUB_ENV"

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST"

      - name: Set up JDK 17 for Android client
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for hosted client
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android emulator and prove KVM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          test -e /dev/kvm
          kvm_chmod_log="$SERVICE_DIR/kvm-chmod.raw.log"
          kvm_chmod_status=0
          timeout --foreground --signal=TERM --kill-after=10s 30s sudo chmod a+rw /dev/kvm > "$kvm_chmod_log" 2>&1 || kvm_chmod_status=$?
          emit_private_evidence android-kvm-chmod "$kvm_chmod_log"
          if [ "$kvm_chmod_status" -ne 0 ]; then
            printf 'android_kvm_setup=failed code=KVM_CHMOD status=%s\n' "$kvm_chmod_status" >&2
            exit "$kvm_chmod_status"
          fi
          kvm_device_log="$SERVICE_DIR/kvm-device.raw.log"
          kvm_device_status=0
          ls -l /dev/kvm > "$kvm_device_log" 2>&1 || kvm_device_status=$?
          emit_private_evidence android-kvm-device "$kvm_device_log"
          if [ "$kvm_device_status" -ne 0 ]; then
            printf 'android_kvm_device_probe=failed code=KVM_DEVICE status=%s\n' "$kvm_device_status" >&2
            exit "$kvm_device_status"
          fi
          sdk_install_log="$SERVICE_DIR/sdkmanager-install.raw.log"
          sdk_install_status=0
          timeout --foreground --signal=TERM --kill-after=10s 300s sdkmanager --install "platform-tools" "emulator" "platforms;android-35" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64" > "$sdk_install_log" 2>&1 || sdk_install_status=$?
          emit_private_evidence android-sdkmanager-install "$sdk_install_log"
          if [ "$sdk_install_status" -ne 0 ]; then
            printf 'android_sdk_setup=failed code=SDKMANAGER_INSTALL status=%s\n' "$sdk_install_status" >&2
            exit "$sdk_install_status"
          fi
          sdk_list_log="$SERVICE_DIR/sdkmanager-list.raw.log"
          sdk_list_status=0
          timeout --foreground --signal=TERM --kill-after=10s 30s sdkmanager --list_installed > "$sdk_list_log" 2>&1 || sdk_list_status=$?
          emit_private_evidence android-sdkmanager-list "$sdk_list_log"
          if [ "$sdk_list_status" -ne 0 ]; then
            printf 'android_sdk_setup=failed code=SDKMANAGER_LIST status=%s\n' "$sdk_list_status" >&2
            exit "$sdk_list_status"
          fi
          accel_check_log="$SERVICE_DIR/emulator-accel-check.raw.log"
          accel_status=0
          timeout --foreground --signal=TERM --kill-after=10s 60s "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check > "$accel_check_log" 2>&1 || accel_status=$?
          if [ "$accel_status" -ne 0 ]; then
            emit_private_evidence android-kvm-accel-check "$accel_check_log"
            printf 'android_kvm_acceleration_check=failed status=%s\n' "$accel_status" >&2
            exit 1
          fi
          if ! grep -Eiq 'KVM .*usable|KVM.*installed and usable' "$accel_check_log"; then
            emit_private_evidence android-kvm-accel-check "$accel_check_log"
            printf 'android_kvm_acceleration_check=not-usable\n' >&2
            exit 1
          fi
          emit_private_evidence android-kvm-accel-check "$accel_check_log"
          printf 'android_kvm_acceleration_check=usable\n'

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --foreground --signal=TERM --kill-after=10s 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python3 -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA","SOURCE_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-android":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "android", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\nREQUEST_ARTIFACT_NAME={name}\n")
          print(f"lease_run_id={run_id}\nrequest_artifact_name={name}")
          PY

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"run_deadline_epoch={deadline}")
          PY

      - name: Download and verify exact Android candidate closure
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-android-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer checkout and candidate closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          python3 torturer/torturer_checks/hosted/candidate.py verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform android --architecture x86_64 --source-sha "$SOURCE_SHA"

      - name: Start exact Android emulator and install candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          avd_name=dobby-functional-api35
          avd_home="$SERVICE_DIR/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avd_log="$SERVICE_DIR/avdmanager-create.raw.log"
          avd_status=0
          printf 'no\n' | timeout --foreground --signal=TERM --kill-after=10s 120s avdmanager create avd --force --name "$avd_name" --package "system-images;android-35;google_apis;x86_64" --device pixel > "$avd_log" 2>&1 || avd_status=$?
          emit_private_evidence android-avdmanager-create "$avd_log"
          if [ "$avd_status" -ne 0 ]; then
            printf 'android_avd_setup=failed code=AVDMANAGER_CREATE status=%s\n' "$avd_status" >&2
            exit "$avd_status"
          fi
          avd_list_log="$SERVICE_DIR/avdmanager-list.raw.log"
          avd_list_status=0
          timeout --foreground --signal=TERM --kill-after=10s 30s avdmanager list avd > "$avd_list_log" 2>&1 || avd_list_status=$?
          emit_private_evidence android-avdmanager-list "$avd_list_log"
          if [ "$avd_list_status" -ne 0 ]; then
            printf 'android_avd_setup=failed code=AVDMANAGER_LIST status=%s\n' "$avd_list_status" >&2
            exit "$avd_list_status"
          fi
          test -f "$avd_home/$avd_name.ini"
          test -d "$avd_home/$avd_name.avd"
          printf 'android_avd_ready=true name=%s home=%s\n' "$avd_name" "$ANDROID_AVD_HOME"
          emulator_log="$SERVICE_DIR/emulator.raw.log"
          setsid timeout --foreground --signal=TERM --kill-after=10s 1500s "$ANDROID_SDK_ROOT/emulator/emulator" -avd "$avd_name" -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on -no-snapshot -wipe-data > "$emulator_log" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "$emulator_pid" > "$HANDOFF_DIR/emulator.pid"
          printf 'EMULATOR_PID=%s\nADB_PATH=%s\nEMULATOR_LOG=%s\n' "$emulator_pid" "$ANDROID_SDK_ROOT/platform-tools/adb" "$emulator_log" >> "$GITHUB_ENV"
          emulator_exit_diagnostic() {
            emulator_wait_status=0
            wait "$emulator_pid" || emulator_wait_status=$?
            exit_log="$SERVICE_DIR/emulator-exit.raw.log"
            python3 - "$emulator_log" "$emulator_wait_status" <<'PY' > "$exit_log" 2>&1
          from hashlib import sha256
          from pathlib import Path
          import re
          import sys

          log_path = Path(sys.argv[1])
          wait_status = sys.argv[2]
          payload = log_path.read_bytes() if log_path.is_file() else b""
          reasons = []
          for raw_line in payload.decode("utf-8", "replace").splitlines():
              safe_line = re.sub(r"(?:[A-Za-z]:)?[\\/][^\s,;)]*", "<path>", raw_line)
              safe_line = re.sub(
                  r"(?i)\b(?:token|key|secret|password|authorization)\b\s*[:=]\s*\S+",
                  "<redacted>",
                  safe_line,
              )
              safe_line = re.sub(r"(?i)\b[0-9a-f]{32,}\b", "<hex>", safe_line)
              safe_line = re.sub(r"\s+", " ", safe_line).strip()
              if re.search(r"(?i)\b(panic|error|fatal|failed|failure|abort)\b", safe_line):
                  reasons.append(safe_line[:240])
          print(f"emulator_wait_status={wait_status}")
          print(f"emulator_log_bytes={len(payload)}")
          print(f"emulator_log_sha256={sha256(payload).hexdigest()}")
          print("emulator_exit_reason=" + (" | ".join(reasons) if reasons else "none"))
          PY
            chmod 600 "$exit_log"
            emit_private_evidence android-emulator-exit "$exit_log"
            printf '%s\n' 'android_emulator_exit_diagnostic_begin'
            sed -n '1,4p' "$exit_log"
            printf '%s\n' 'android_emulator_exit_diagnostic_end'
          }
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          adb_bounded() {
            timeout --foreground --signal=TERM --kill-after=10s 120s "$adb" "$@"
          }
          adb_start_log="$SERVICE_DIR/adb-start-server.raw.log"
          adb_start_status=0
          adb_bounded start-server > "$adb_start_log" 2>&1 || adb_start_status=$?
          emit_private_evidence android-adb-start-server "$adb_start_log"
          if [ "$adb_start_status" -ne 0 ]; then
            printf 'android_adb_setup=failed code=START_SERVER status=%s\n' "$adb_start_status" >&2
            exit "$adb_start_status"
          fi
          device_ready=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid"; then
              emulator_exit_diagnostic
              emit_private_evidence android-emulator-exited "$emulator_log"
              printf 'android_emulator_readiness=failed code=DEVICE_TIMEOUT\n' >&2
              exit 1
            fi
            devices_log="$SERVICE_DIR/adb-devices-${attempt}.raw.log"
            devices_status=0
            adb_bounded devices -l > "$devices_log" 2>&1 || devices_status=$?
            if [ "$devices_status" -eq 0 ]; then
              if grep -Eq '^emulator-5554[[:space:]]+device' "$devices_log"; then
                emit_private_evidence android-adb-devices-${attempt} "$devices_log"
                device_ready=true
                break
              fi
            else
              emit_private_evidence android-adb-devices-${attempt} "$devices_log"
              printf 'android_adb_device_probe=failed attempt=%s status=%s\n' "$attempt" "$devices_status" >&2
            fi
            sleep 2
          done
          test "$device_ready" = true
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid"; then
              emulator_exit_diagnostic
              emit_private_evidence android-emulator-boot-exited "$emulator_log"
              printf 'android_emulator_readiness=failed code=BOOT_TIMEOUT\n' >&2
              exit 1
            fi
            boot_state_log="$SERVICE_DIR/adb-boot-state-${attempt}.raw.log"
            boot_status=0
            adb_bounded shell getprop sys.boot_completed > "$boot_state_log" 2>&1 || boot_status=$?
            if [ "$boot_status" -ne 0 ]; then
              emit_private_evidence android-adb-boot-${attempt} "$boot_state_log"
              printf 'android_adb_boot_probe=failed attempt=%s status=%s\n' "$attempt" "$boot_status" >&2
              exit 1
            fi
            emit_private_evidence android-adb-boot-${attempt} "$boot_state_log"
            boot_state="$(tr -d '\r' < "$boot_state_log")"
            printf 'android_boot_probe_attempt=%s state=%s\n' "$attempt" "$boot_state"
            if [ "$boot_state" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb_evidence() {
            label="$1"
            shift
            output_log="$SERVICE_DIR/adb-${label}.raw.log"
            output_status=0
            adb_bounded "$@" > "$output_log" 2>&1 || output_status=$?
            emit_private_evidence "android-${label}" "$output_log"
            return "$output_status"
          }
          adb_evidence devices devices -l
          adb_evidence os-version shell getprop ro.build.version.release
          adb_evidence cpu shell getprop ro.product.cpu.abi
          adb_evidence install-app install -r "$GITHUB_WORKSPACE/candidate/app-debug.apk"
          adb_evidence install-test install -r "$GITHUB_WORKSPACE/candidate/app-debug-androidTest.apk"
          adb_evidence packages shell pm list packages -e com.dobby.vpn
          adb_evidence package-dump shell dumpsys package com.dobby.vpn
          adb_evidence force-stop-app shell am force-stop com.dobby.vpn
          adb_evidence force-stop-test shell am force-stop com.dobby.vpn.test
          app_pid_log="$SERVICE_DIR/android-app-pid.raw.log"
          app_pid_status=0
          adb_bounded shell pidof com.dobby.vpn > "$app_pid_log" 2>&1 || app_pid_status=$?
          emit_private_evidence android-app-pid "$app_pid_log"
          if [ "$app_pid_status" -eq 0 ]; then
            printf 'android_app_pid_probe=complete\n'
          else
            printf 'android_app_pid_probe=failed status=%s\n' "$app_pid_status" >&2
          fi
          test_pid_log="$SERVICE_DIR/android-test-pid.raw.log"
          test_pid_status=0
          adb_bounded shell pidof com.dobby.vpn.test > "$test_pid_log" 2>&1 || test_pid_status=$?
          emit_private_evidence android-test-pid "$test_pid_log"
          if [ "$test_pid_status" -eq 0 ]; then
            printf 'android_test_pid_probe=complete\n'
          else
            printf 'android_test_pid_probe=failed status=%s\n' "$test_pid_status" >&2
          fi

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download exact encrypted Render lease response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python3 - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [item for item in value.get("artifacts", []) if item.get("name") == sys.argv[2] and item.get("expired") is not True]
          if len(matches) != 1: raise SystemExit(1 if not matches else 2)
          run_id = (matches[0].get("workflow_run") or {}).get("id")
          if not isinstance(run_id, int) or run_id <= 0: raise SystemExit(2)
          print(run_id)
          PY
            )"; then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python3 - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"id": int(sys.argv[2]), "event": "workflow_dispatch", "head_branch": os.environ["GITHUB_REF_NAME"], "head_sha": os.environ["TORTURER_SHA"], "path": ".github/workflows/server-lease.yml", "display_title": sys.argv[3]}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease workflow {key} mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]: raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" timeout --foreground --signal=TERM --kill-after=10s 120s python3 -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" --artifact-name "$response_name" --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" --metadata "$attempt_dir/artifacts.json" --archive "$attempt_dir/response.zip" \
                --expect-file lease.json --expect-file profile.cms; then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              test "$status" -eq 1
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Validate and decrypt encrypted profile
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LEASE_RESPONSE_DIR/lease.json" && test -f "$LEASE_RESPONSE_DIR/profile.cms"
          python3 - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"schema": 1, "kind": "dobbyvpn.render-lease", "run_id": os.environ["LEASE_RUN_ID"], "platform": "android", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"], "state": "issued"}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))): raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          timeout --foreground --signal=TERM --kill-after=10s 60s openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Run canonical Android functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          # Android's six applicable canonical scenarios plus resets have a 621-second declared maximum.
          if [ "$remaining" -lt 650 ]; then printf 'insufficient Android canonical budget before cleanup reserve: seconds=%s\n' "$remaining" >&2; exit 1; fi
          if [ "$remaining" -gt 1260 ]; then remaining=1260; fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          python3 -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            python3 -m torturer_checks.hosted.run --platform android \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --platform-version "35" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --identity-url "https://api.ipify.org" \
            --latency-url "https://proof.ovh.net/files/1Mb.dat" \
            --download-url "https://proof.ovh.net/files/1Mb.dat" --upload-url "https://speed.cloudflare.com/__up" \
            --adb "$ADB_PATH"

      - name: Report safe Android command diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          diagnostic="$HANDOFF_DIR/android-command-diagnostic.txt"
          : > "$diagnostic"
          python3 - "$HANDOFF_DIR/hosted-command-raw" "$diagnostic" <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import sys
          from pathlib import Path

          raw_dir = Path(sys.argv[1])
          output = Path(sys.argv[2])
          files = sorted(raw_dir.glob("*.raw.log")) if raw_dir.is_dir() else []

          def section(payload: bytes, name: str) -> bytes:
              match = re.search(
                  rb"(?ms)^" + name.encode("ascii") + rb"-begin\n(.*?)\n" +
                  name.encode("ascii") + rb"-end\n",
                  payload,
              )
              return match.group(1) if match else b""

          def command_line(payload: bytes) -> str:
              match = re.search(rb"^argv=(.*)$", payload, re.MULTILINE)
              return match.group(1).decode("utf-8", errors="replace") if match else ""

          def operation(argv: str) -> str:
              lower = argv.lower()
              if "run-as" in lower and "cat > files/" in lower:
                  if ".profile" in lower:
                      return "profile-stage"
                  if ".command.json" in lower:
                      return "command-stage"
              if "run-as" in lower and "chmod" in lower:
                  if ".profile" in lower:
                      return "profile-chmod"
                  if ".command.json" in lower:
                      return "command-chmod"
              if " am instrument " in f" {lower} ":
                  return "instrumentation"
              if " exec-out " in f" {lower} ":
                  return "observation"
              if " logcat " in f" {lower} ":
                  return "logcat"
              if " dumpsys " in f" {lower} ":
                  return "dumpsys"
              if " shell ps " in f" {lower} ":
                  return "process-list"
              if " shell pidof " in f" {lower} ":
                  return "process-probe"
              if " shell run-as " in f" {lower} " and " rm " in f" {lower} ":
                  return "private-cleanup"
              if " shell rm " in f" {lower} ":
                  return "temporary-cleanup"
              if " force-stop " in f" {lower} ":
                  return "force-stop"
              return "other"

          def stderr_code(stderr: bytes) -> str:
              lower = stderr.decode("utf-8", errors="replace").lower()
              markers = (
                  ("not debuggable", "NOT_DEBUGGABLE"),
                  ("permission denied", "PERMISSION_DENIED"),
                  ("access denied", "ACCESS_DENIED"),
                  ("unknown package", "PACKAGE_UNKNOWN"),
                  ("package not found", "PACKAGE_MISSING"),
                  ("does not exist", "PATH_MISSING"),
                  ("no such file", "PATH_MISSING"),
                  ("cannot create", "CREATE_FAILED"),
                  ("can't create", "CREATE_FAILED"),
                  ("read-only file system", "READ_ONLY_FILESYSTEM"),
                  ("closed", "CHANNEL_CLOSED"),
                  ("broken pipe", "BROKEN_PIPE"),
                  ("protocol fault", "PROTOCOL_FAULT"),
              )
              for marker, code in markers:
                  if marker in lower:
                      return code
              return "NONEMPTY" if lower.strip() else "EMPTY"

          def classify(argv: str, output: str, returncode: str, op: str) -> str:
              lower = output.lower()
              command_lower = argv.lower()
              if "run-as" in command_lower and "not debuggable" in lower:
                  return "RUN_AS_NOT_DEBUGGABLE"
              if "run-as" in command_lower and any(
                  marker in lower for marker in ("permission denied", "access denied", "denied")
              ):
                  return "RUN_AS_PERMISSION_DENIED"
              if "run-as" in command_lower and any(
                  marker in lower
                  for marker in ("package not found", "unknown package", "does not exist")
              ):
                  return "RUN_AS_PACKAGE_MISSING"
              if "run-as" in command_lower and "not found" in lower:
                  return "RUN_AS_COMMAND_UNAVAILABLE"
              if op in {"profile-stage", "command-stage"} and any(
                  marker in lower for marker in ("broken pipe", "stdin", "standard input")
              ):
                  return "ADB_STDIN_FAILED"
              if any(
                  marker in lower
                  for marker in ("device offline", "no devices", "device not found", "device unauthorized")
              ):
                  return "ADB_DEVICE_UNAVAILABLE"
              if returncode == "0":
                  return "OK"
              if returncode != "unknown":
                  return "COMMAND_FAILED"
              return "RAW_FORMAT_INVALID"

          output.write_text("schema=1\n", encoding="ascii")
          with output.open("a", encoding="ascii") as stream:
              for sequence, path in enumerate(files, start=1):
                  payload = path.read_bytes()
                  match = re.search(rb"^returncode=([^\n]*)$", payload, re.MULTILINE)
                  returncode = match.group(1).decode("ascii", errors="replace") if match else "unknown"
                  argv = command_line(payload)
                  stdout = section(payload, "stdout")
                  stderr = section(payload, "stderr")
                  output = stdout + b"\n" + stderr
                  op = operation(argv)
                  code = classify(argv, output.decode("utf-8", errors="replace"), returncode, op)
                  stderr_digest = hashlib.sha256(stderr).hexdigest()
                  stream.write(
                      f"android_command_diagnostic sequence={sequence} operation={op} "
                      f"code={code} returncode={returncode} stdout_bytes={len(stdout)} "
                      f"stderr_bytes={len(stderr)} stderr_code={stderr_code(stderr)} "
                      f"stderr_sha256={stderr_digest} raw_bytes={len(payload)}\n"
                  )
          PY
          chmod 600 "$diagnostic"
          cat "$diagnostic"

      - name: Upload safe Android command diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-command-diagnostic-${{ env.LEASE_RUN_ID }}
          path: ${{ env.HANDOFF_DIR }}/android-command-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop Android emulator and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          adb="${ADB_PATH:-${ANDROID_SDK_ROOT:-}/platform-tools/adb}"
          # Keep the complete cleanup phase inside the client’s 120-second
          # finalization reserve.  Six adb operations are each capped at
          # 4s plus a 1s kill grace; host process-group proof is capped at
          # 15s TERM observation + 5s TERM grace + 5s KILL grace, and the
          # emulator log drain is capped at 5s.  The policy test proves this
          # 60-second worst-case arithmetic, leaving time for artifact/key
          # finalization without relying on the outer job kill.
          adb_timeout_seconds=4
          adb_kill_grace_seconds=1
          adb_bounded() {
            timeout --foreground --signal=TERM --kill-after="${adb_kill_grace_seconds}s" "${adb_timeout_seconds}s" "$adb" "$@"
          }
          adb_cleanup_evidence() {
            label="$1"
            shift
            cleanup_log="$SERVICE_DIR/cleanup-${label}.raw.log"
            cleanup_status=0
            adb_bounded "$@" > "$cleanup_log" 2>&1 || cleanup_status=$?
            emit_private_evidence "android-cleanup-${label}" "$cleanup_log"
            return "$cleanup_status"
          }
          if [ -x "$adb" ]; then
            if ! adb_cleanup_evidence force-stop-app shell am force-stop com.dobby.vpn; then printf 'android_cleanup_force_stop_app=failed\n' >&2; fi
            if ! adb_cleanup_evidence force-stop-test shell am force-stop com.dobby.vpn.test; then printf 'android_cleanup_force_stop_test=failed\n' >&2; fi
            if adb_cleanup_evidence uninstall-test uninstall com.dobby.vpn.test; then printf 'android_test_package_removed=true\n'; else printf 'android_test_package_removal=not-installed-or-failed\n'; fi
            if adb_cleanup_evidence uninstall-app uninstall com.dobby.vpn; then printf 'android_package_removed=true\n'; else printf 'android_package_removal=not-installed-or-failed\n'; fi
            if adb_cleanup_evidence emulator-kill emu kill; then printf 'android_emulator_shutdown_requested=true\n'; else printf 'android_emulator_shutdown_request=failed-or-already-stopped\n'; fi
            if ! adb_cleanup_evidence devices devices -l; then printf 'android_cleanup_devices_probe=failed\n' >&2; fi
          else
            printf 'adb_missing_during_cleanup=true\n' >&2
          fi
          emulator_pid="${EMULATOR_PID:-}"
          if [ -f "${HANDOFF_DIR:-}/emulator.pid" ]; then emulator_pid="$(cat "$HANDOFF_DIR/emulator.pid")"; fi
          process_group_alive() {
            kill -0 "$emulator_pid" || kill -0 -- "-$emulator_pid"
          }
          case "$emulator_pid" in
            "") printf 'android_emulator_pid=not-recorded\n';;
            0|*[!0-9]*) printf 'invalid emulator pid=%s\n' "$emulator_pid" >&2; exit 1;;
            *)
              stopped=false
              for attempt in $(seq 1 15); do
                if ! process_group_alive; then stopped=true; break; fi
                printf 'android_emulator_cleanup_attempt=%s pid=%s\n' "$attempt" "$emulator_pid"
                sleep 1
              done
              if [ "$stopped" != true ]; then
                printf 'android_emulator_term_group=%s\n' "$emulator_pid"
                kill -TERM -- "-$emulator_pid"
                for attempt in $(seq 1 5); do
                  if ! process_group_alive; then stopped=true; break; fi
                  sleep 1
                done
              fi
              if [ "$stopped" != true ]; then
                printf 'android_emulator_kill_group=%s\n' "$emulator_pid"
                kill -KILL -- "-$emulator_pid"
                for attempt in $(seq 1 5); do
                  if ! process_group_alive; then stopped=true; printf 'android_emulator_post_kill_verified=true\n'; break; fi
                  printf 'android_emulator_post_kill_check=%s\n' "$attempt"
                  sleep 1
                done
              fi
              test "$stopped" = true
              if [ -f "${EMULATOR_LOG:-}" ]; then
                emit_private_evidence android-emulator-log "$EMULATOR_LOG"
              fi
              ;;
          esac

      - name: Upload safe Android functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-android
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque Android completion marker
        if: always()
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=android\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque Android completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-android
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"

  controller:
    name: Dispatch isolated Android Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: android
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
         set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
         [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and Android lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for Android client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python3 - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 180); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python3 - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Android Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" -f "inputs[mode]=acquire" -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
            -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
            -f "inputs[origin_workflow_path]=.github/workflows/functional-android.yml" -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
            -f "inputs[platform]=${PLATFORM}" -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
