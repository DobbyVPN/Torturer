          #!/usr/bin/env python3
          """Stream ADB commands while making logcat diagnostics incremental."""

          from __future__ import annotations

          import fcntl
          import os
          import re
          import selectors
          import subprocess
          import sys
          from pathlib import Path


          REAL_ADB = os.environ["DOBBY_REAL_ADB"]
          CURSOR = Path(os.environ["DOBBY_ADB_LOGCAT_CURSOR"])
          EPOCH_LINE = re.compile(rb"^\s*\[?\s*(\d+\.\d+)")


          def write_all(fd: int, payload: bytes) -> None:
              view = memoryview(payload)
              while view:
                  written = os.write(fd, view)
                  view = view[written:]


          def read_cursor() -> str | None:
              try:
                  value = CURSOR.read_text(encoding="ascii").strip()
              except FileNotFoundError:
                  return None
              return value or None


          def write_cursor(value: str) -> None:
              temporary = CURSOR.with_name(CURSOR.name + ".tmp")
              temporary.write_text(value + "\n", encoding="ascii")
              os.chmod(temporary, 0o600)
              os.replace(temporary, CURSOR)


          def logcat_command(arguments: list[str]) -> int:
              CURSOR.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              lock_path = CURSOR.with_name(CURSOR.name + ".lock")
              with lock_path.open("a+", encoding="ascii") as lock:
                  os.chmod(lock_path, 0o600)
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                  cursor = read_cursor()
                  normalized: list[str] = []
                  index = 0
                  while index < len(arguments):
                      if arguments[index] in {"-v", "--format"} and index + 1 < len(arguments):
                          index += 2
                          continue
                      if arguments[index] == "-T" and index + 1 < len(arguments):
                          index += 2
                          continue
                      normalized.append(arguments[index])
                      index += 1
                  normalized.extend(["-v", "epoch"])
                  if cursor is not None:
                      normalized.extend(["-T", cursor])
                  process = subprocess.Popen(
                      [REAL_ADB, *normalized],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      close_fds=True,
                  )
                  selector = selectors.DefaultSelector()
                  assert process.stdout is not None
                  assert process.stderr is not None
                  selector.register(process.stdout, selectors.EVENT_READ, (1, bytearray()))
                  selector.register(process.stderr, selectors.EVENT_READ, (2, None))
                  line_buffer = bytearray()
                  last_epoch: str | None = None
                  while selector.get_map():
                      for key, _ in selector.select():
                          stream = key.fileobj
                          chunk = stream.read1(65536)
                          if not chunk:
                              selector.unregister(stream)
                              stream.close()
                              continue
                          fd, _ = key.data
                          write_all(fd, chunk)
                          if fd == 1:
                              line_buffer.extend(chunk)
                              while b"\n" in line_buffer:
                                  line, _, remainder = line_buffer.partition(b"\n")
                                  line_buffer = bytearray(remainder)
                                  match = EPOCH_LINE.match(line)
                                  if match:
