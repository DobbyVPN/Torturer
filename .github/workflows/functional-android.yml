                  if line_buffer:
                      match = EPOCH_LINE.match(line_buffer)
                      if match:
                          last_epoch = match.group(1).decode("ascii")
                  returncode = process.wait()
                  if returncode == 0 and last_epoch is not None:
                      write_cursor(last_epoch)
                  return returncode


          def main() -> int:
              arguments = sys.argv[1:]
              if arguments and arguments[0] == "logcat" and "-d" in arguments:
                  return logcat_command(arguments)
              os.execv(REAL_ADB, [REAL_ADB, *arguments])
              return 127


          raise SystemExit(main())
          PY
