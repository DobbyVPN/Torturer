name: Trusted functional Android

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Android candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      WORKFLOW_RUN_STARTED_AT: ${{ github.run_started_at }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Establish build run-start deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WORKFLOW_RUN_STARTED_AT" <<'PY'
          import datetime
          import os
          import sys
          from pathlib import Path

          started = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\nANDROID_CLEANUP_RESERVE_SECONDS=120\n")
          print(f"run_deadline_epoch={deadline} cleanup_reserve_seconds=120")
          PY
          deadline_command="$RUNNER_TEMP/android-build-run-with-deadline.sh"
          cat > "$deadline_command" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          reserve="${ANDROID_CLEANUP_RESERVE_SECONDS:?ANDROID_CLEANUP_RESERVE_SECONDS is missing}"
          if [ "$#" -ge 2 ] && [ "$1" = '--reserve' ]; then
            reserve="$2"
            shift 2
          fi
          if ! [[ "$reserve" =~ ^[0-9][0-9]*$ ]]; then
            printf '%s\n' 'android-build-run-with-deadline reserve is invalid' >&2
            exit 2
          fi
          check_only=false
          if [ "$#" -ge 1 ] && [ "$1" = '--check' ]; then
            if [ "$#" -ne 2 ]; then
              printf '%s\n' 'android-build-run-with-deadline check requires one configured timeout' >&2
              exit 2
            fi
            configured="$2"
            check_only=true
          else
            if [ "$#" -lt 2 ]; then
              printf '%s\n' 'android-build-run-with-deadline requires a configured timeout and command' >&2
              exit 2
            fi
            configured="$1"
            shift
          fi
          if ! [[ "$configured" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' 'android-build-run-with-deadline timeout is invalid' >&2
            exit 2
          fi
          kill_grace=10
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - reserve - kill_grace))
          if [ "$remaining" -le 0 ]; then
            printf 'android_build_deadline_child=exhausted remaining=%s reserve=%s\n' "$remaining" "$reserve" >&2
            exit 124
          fi
          selected="$configured"
          if [ "$selected" -gt "$remaining" ]; then selected="$remaining"; fi
          printf 'android_build_deadline_child configured=%s selected=%s remaining=%s reserve=%s\n' \
            "$configured" "$selected" "$remaining" "$reserve"
          if [ "$check_only" = true ]; then
            if [ "$selected" -lt "$configured" ]; then
              printf 'android_build_deadline_check=insufficient configured=%s selected=%s\n' \
                "$configured" "$selected" >&2
              exit 124
            fi
            exit 0
          fi
          exec timeout --foreground --signal=TERM --kill-after="${kill_grace}s" "${selected}s" "$@"
          SH
          chmod 700 "$deadline_command"
          printf 'DEADLINE_COMMAND=%s\n' "$deadline_command" >> "$GITHUB_ENV"

      - name: Check Android candidate checkout deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 300

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check Android trusted checkout deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 300

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Check Android build JDK setup deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 180

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android build SDK setup deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 180

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        timeout-minutes: 3

      - name: Install exact Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          toolchain_dir="$RUNNER_TEMP/android-build-toolchain"
          mkdir -p "$toolchain_dir"
          emit_private_evidence() {
            label="$1"
            file="$2"
            bytes="$(wc -c < "$file" | tr -d '[:space:]')"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
            printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
              "$label" "$evidence_id" "$bytes" "$digest"
          }
          sdk_install_log="$toolchain_dir/sdkmanager-install.raw.log"
          sdk_install_status=0
          "$DEADLINE_COMMAND" 300 sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > "$sdk_install_log" 2>&1 || sdk_install_status=$?
          emit_private_evidence android-build-sdkmanager-install "$sdk_install_log"
          if [ "$sdk_install_status" -ne 0 ]; then
            printf 'android_build_toolchain=failed code=SDKMANAGER_INSTALL status=%s\n' "$sdk_install_status" >&2
            exit "$sdk_install_status"
          fi
          sdk_list_log="$toolchain_dir/sdkmanager-list.raw.log"
          sdk_list_status=0
          "$DEADLINE_COMMAND" 30 sdkmanager --list_installed > "$sdk_list_log" 2>&1 || sdk_list_status=$?
          emit_private_evidence android-build-sdkmanager-list "$sdk_list_log"
          if [ "$sdk_list_status" -ne 0 ]; then
            printf 'android_build_toolchain=failed code=SDKMANAGER_LIST status=%s\n' "$sdk_list_status" >&2
            exit "$sdk_list_status"
          fi
          printf 'ANDROID_NDK_HOME=%s/ndk/27.2.12479018\n' "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download candidate Go modules
        shell: bash
        working-directory: candidate/go_module
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" 240 bash -c 'go mod download && go mod tidy'

      - name: Install pinned gomobile toolchain
        shell: bash
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          mobile_version='v0.0.0-20260520154334-0e4426e1883d'
          "$DEADLINE_COMMAND" 240 go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          "$DEADLINE_COMMAND" 240 go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
          gopath="$(go env GOPATH)"
          tool_dir="$gopath/bin"
          mkdir -p "$gopath/pkg/gomobile"
          export PATH="$tool_dir:$PATH"
          echo "$tool_dir" >> "$GITHUB_PATH"
          for tool in gomobile gobind; do
            test -x "$tool_dir/$tool"
            go version -m "$tool_dir/$tool" | \
              grep -F 'golang.org/x/mobile' | \
              grep -F "$mobile_version"
          done
          cd "$GITHUB_WORKSPACE/candidate/go_module"
          mobile_module_version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          "$DEADLINE_COMMAND" 120 go get "golang.org/x/mobile/bind@$mobile_module_version"
          if ! git -C "$CANDIDATE_DIR" diff --no-ext-diff --exit-code --; then
            echo "candidate source mutated during pinned mobile preparation" >&2
            git -C "$CANDIDATE_DIR" diff --no-ext-diff -- >&2
            exit 1
          fi
          test -z "$(git -C "$CANDIDATE_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Verify checkout and build Android candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          "$DEADLINE_COMMAND" 480 ./kmp_module/gradlew -p kmp_module --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            -PprojectRepositoryCommit="$SOURCE_SHA" \
            -PprojectRepositoryCommitLink="https://github.com/$SOURCE_REPOSITORY/tree/$SOURCE_SHA"
          sha256sum kmp_module/app/build/outputs/apk/debug/app-debug.apk \
            kmp_module/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Stage exact allow-listed Android candidate closure
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" 60 python3 torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-android" \
            --platform android --architecture x86_64 --source-sha "$SOURCE_SHA"

      - name: Check Android candidate artifact upload deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 60

      - name: Upload isolated Android candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: candidate-android-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-android
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Android
    runs-on: ubuntu-24.04
    # The build job is capped at ten minutes.  Keep this client at twenty so
    # build plus client execution cannot exceed the workflow's thirty-minute
    # run-start deadline.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: android
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      SERVER_SINK_IMAGE_DIGEST: ${{ vars.RENDER_SINK_IMAGE_DIGEST }}

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          handoff="$RUNNER_TEMP/dobbyvpn-render-handoff"
          service="$RUNNER_TEMP/dobbyvpn-service"
          for private_dir in "$handoff" "$service"; do
            if [ -L "$private_dir" ] || { [ -e "$private_dir" ] && [ ! -d "$private_dir" ]; }; then
              printf 'android_private_directory=unsafe path=%s\n' "$private_dir" >&2
              exit 1
            fi
          done
          mkdir -p "$handoff" "$service"
          chmod 700 "$handoff" "$service"
          for private_dir in "$handoff" "$service"; do
            private_owner="$(stat -c '%u' "$private_dir")"
            private_mode="$(stat -c '%a' "$private_dir")"
            if [ "$private_owner" != "$(id -u)" ] || [ "$private_mode" != "700" ]; then
              printf 'android_private_directory=unsafe owner=%s mode=%s path=%s\n' \
                "$private_owner" "$private_mode" "$private_dir" >&2
              exit 1
            fi
          done
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nRESULT_PATH=%s\nLEASE_RUN_ID=unassigned\n' \
            "$handoff" "$service" "$handoff/functional-result.json" >> "$GITHUB_ENV"

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          [[ "$SERVER_SINK_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sink_image_digest="${SERVER_SINK_IMAGE_DIGEST#sha256:}"
          test -n "${sink_image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\nserver_sink_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST" "$SERVER_SINK_IMAGE_DIGEST"

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          if not isinstance(value.get("run_started_at"), str):
              raise SystemExit("workflow run start timestamp is missing")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\nANDROID_CLEANUP_RESERVE_SECONDS=120\n")
          print(f"run_deadline_epoch={deadline} cleanup_reserve_seconds=120")
          PY
          unset GH_TOKEN
          deadline_command="$HANDOFF_DIR/run-with-deadline.sh"
          cat > "$deadline_command" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          reserve="${ANDROID_CLEANUP_RESERVE_SECONDS:?ANDROID_CLEANUP_RESERVE_SECONDS is missing}"
          if [ "$#" -ge 2 ] && [ "$1" = '--reserve' ]; then
            reserve="$2"
            shift 2
          fi
          if ! [[ "$reserve" =~ ^[0-9][0-9]*$ ]]; then
            printf '%s\n' 'run-with-deadline reserve is invalid' >&2
            exit 2
          fi
          check_only=false
          if [ "$#" -ge 1 ] && [ "$1" = '--check' ]; then
            if [ "$#" -ne 2 ]; then
              printf '%s\n' 'run-with-deadline check requires one configured timeout' >&2
              exit 2
            fi
            configured="$2"
            check_only=true
          else
            if [ "$#" -lt 2 ]; then
              printf '%s\n' 'run-with-deadline requires a configured timeout and command' >&2
              exit 2
            fi
            configured="$1"
            shift
          fi
          if ! [[ "$configured" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' 'run-with-deadline timeout is invalid' >&2
            exit 2
          fi
          kill_grace=10
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - reserve - kill_grace))
          if [ "$remaining" -le 0 ]; then
            printf 'android_deadline_child=exhausted remaining=%s reserve=%s\n' "$remaining" "$reserve" >&2
            exit 124
          fi
          selected="$configured"
          if [ "$selected" -gt "$remaining" ]; then selected="$remaining"; fi
          printf 'android_deadline_child configured=%s selected=%s remaining=%s reserve=%s\n' \
            "$configured" "$selected" "$remaining" "$reserve"
          if [ "$check_only" = true ]; then
            if [ "$selected" -lt "$configured" ]; then
              printf 'android_deadline_check=insufficient configured=%s selected=%s\n' \
                "$configured" "$selected" >&2
              exit 124
            fi
            exit 0
          fi
          exec timeout --foreground --signal=TERM --kill-after="${kill_grace}s" "${selected}s" "$@"
          SH
          chmod 700 "$deadline_command"
          printf 'DEADLINE_COMMAND=%s\n' "$deadline_command" >> "$GITHUB_ENV"

      - name: Check Android JDK setup deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 180

      - name: Set up JDK 17 for Android client
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK setup deadline budget
        shell: bash
        run: |
          set -euo pipefail
          "$DEADLINE_COMMAND" --check 180

      - name: Set up Android SDK for hosted client
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        timeout-minutes: 3

      - name: Install Android emulator and prove KVM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          test -c /dev/kvm
          kvm_chmod_log="$SERVICE_DIR/kvm-chmod.raw.log"
          kvm_chmod_status=0
          "$DEADLINE_COMMAND" 30 sudo chmod a+rw /dev/kvm > "$kvm_chmod_log" 2>&1 || kvm_chmod_status=$?
          emit_private_evidence android-kvm-chmod "$kvm_chmod_log"
          if [ "$kvm_chmod_status" -ne 0 ]; then
            printf 'android_kvm_setup=failed code=KVM_CHMOD status=%s\n' "$kvm_chmod_status" >&2
            exit "$kvm_chmod_status"
          fi
          kvm_device_log="$SERVICE_DIR/kvm-device.raw.log"
          kvm_device_status=0
          ls -l /dev/kvm > "$kvm_device_log" 2>&1 || kvm_device_status=$?
          emit_private_evidence android-kvm-device "$kvm_device_log"
          if [ "$kvm_device_status" -ne 0 ]; then
            printf 'android_kvm_device_probe=failed code=KVM_DEVICE status=%s\n' "$kvm_device_status" >&2
            exit "$kvm_device_status"
          fi
          sdk_install_log="$SERVICE_DIR/sdkmanager-install.raw.log"
          sdk_install_status=0
          "$DEADLINE_COMMAND" 300 sdkmanager --install "platform-tools" "emulator" "platforms;android-35" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64" > "$sdk_install_log" 2>&1 || sdk_install_status=$?
          emit_private_evidence android-sdkmanager-install "$sdk_install_log"
          if [ "$sdk_install_status" -ne 0 ]; then
            printf 'android_sdk_setup=failed code=SDKMANAGER_INSTALL status=%s\n' "$sdk_install_status" >&2
            exit "$sdk_install_status"
          fi
          sdk_list_log="$SERVICE_DIR/sdkmanager-list.raw.log"
          sdk_list_status=0
          "$DEADLINE_COMMAND" 30 sdkmanager --list_installed > "$sdk_list_log" 2>&1 || sdk_list_status=$?
          emit_private_evidence android-sdkmanager-list "$sdk_list_log"
          if [ "$sdk_list_status" -ne 0 ]; then
            printf 'android_sdk_setup=failed code=SDKMANAGER_LIST status=%s\n' "$sdk_list_status" >&2
            exit "$sdk_list_status"
          fi
          accel_check_log="$SERVICE_DIR/emulator-accel-check.raw.log"
          accel_status=0
          "$DEADLINE_COMMAND" 60 "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check > "$accel_check_log" 2>&1 || accel_status=$?
          if [ "$accel_status" -ne 0 ]; then
            emit_private_evidence android-kvm-accel-check "$accel_check_log"
            printf 'android_kvm_acceleration_check=failed status=%s\n' "$accel_status" >&2
            exit 1
          fi
          if ! grep -Eiq '^KVM( \([^)]*\))? is installed and usable\.?$' "$accel_check_log"; then
            emit_private_evidence android-kvm-accel-check "$accel_check_log"
            printf 'android_kvm_acceleration_check=not-usable\n' >&2
            exit 1
          fi
          emit_private_evidence android-kvm-accel-check "$accel_check_log"
          printf 'android_kvm_acceleration_check=usable\n'

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$DEADLINE_COMMAND" 60 openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python3 -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA","SOURCE_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-android":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "android", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
