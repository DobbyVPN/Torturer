name: Trusted functional macOS

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted macOS candidate
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Prove macOS runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          id
          sudo -n id
          test "$(uname -m)" = arm64

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Verify checkout and build macOS candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          python3 .github/scripts/desktop_build.py libs --platform macos --arch arm64
          python3 .github/scripts/desktop_build.py app --platform macos --skip-libs
          sha256sum kmp_module/services/macos_grpcvpnserver kmp_module/services/dobby-cli

      - name: Stage exact allow-listed macOS candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python3 torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-macos" \
            --platform macos --architecture arm64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated macOS candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-macos-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-macos
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional macOS
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: macos
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/dobbyvpn-render-handoff"
          service="$RUNNER_TEMP/dobbyvpn-service"
          diagnostics="$RUNNER_TEMP/dobbyvpn-diagnostics"
          mkdir -p "$handoff" "$service" "$diagnostics"
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nDIAGNOSTIC_DIR=%s\nRESULT_PATH=%s\nLEASE_RUN_ID=unassigned\n' \
            "$handoff" "$service" "$diagnostics" "$handoff/functional-result.json" >> "$GITHUB_ENV"

      - name: Prove macOS client runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          id
          sudo -n id
          test "$(uname -m)" = arm64

      - name: Install portable bounded-timeout helper
        shell: bash
        run: |
          set -euo pipefail
          timeout_bin="$RUNNER_TEMP/dobbyvpn-timeout-bin"
          mkdir -p "$timeout_bin"
          python3 - "$timeout_bin/timeout" <<'PY'
          import os
          from pathlib import Path
          import stat
          import textwrap
          import sys

          path = Path(sys.argv[1])
          path.write_text(textwrap.dedent(r'''
              #!/usr/bin/env python3
              import os
              import signal
              import subprocess
              import sys
              import time

              def seconds(value: str) -> float:
                  suffixes = (("h", 3600.0), ("m", 60.0), ("s", 1.0))
                  for suffix, multiplier in suffixes:
                      if value.endswith(suffix):
                          number = value[:-1]
                          break
                  else:
                      number, multiplier = value, 1.0
                  parsed = float(number) * multiplier
                  if parsed <= 0:
                      raise ValueError("timeout duration must be positive")
                  return parsed

              arguments = sys.argv[1:]
              signal_number = signal.SIGTERM
              kill_after = 0.0
              while arguments and arguments[0].startswith("--"):
                  option = arguments.pop(0)
                  if option == "--foreground":
                      continue
                  if option.startswith("--signal="):
                      signal_number = getattr(signal, "SIG" + option.split("=", 1)[1].upper())
                      continue
                  if option.startswith("--kill-after="):
                      kill_after = seconds(option.split("=", 1)[1])
                      continue
                  raise SystemExit("unsupported timeout option")
              if len(arguments) < 2:
                  raise SystemExit("timeout requires a duration and command")
              limit = seconds(arguments.pop(0))
              process = subprocess.Popen(arguments, start_new_session=True)
              try:
                  process.wait(timeout=limit)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal_number)
                  except ProcessLookupError:
                      pass
                  try:
                      process.wait(timeout=kill_after)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                  raise SystemExit(124)
              raise SystemExit(process.returncode)
          ''').lstrip(), encoding="utf-8")
          path.chmod(stat.S_IRUSR | stat.S_IWUSR | stat.S_IXUSR)
          os.chmod(path.parent, 0o700)
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as output:
              output.write(f"{path.parent}\n")
          print(f"portable_timeout_helper={path}")
          PY

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST"

      - name: Select OpenSSL 3 for authenticated CMS handoff
        shell: bash
        run: |
          set -euo pipefail
          openssl_bin=""
          for candidate in \
            /opt/homebrew/opt/openssl@3/bin/openssl \
            /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$candidate" ]; then openssl_bin="$candidate"; break; fi
          done
          if [ -z "$openssl_bin" ]; then
            if ! command -v brew; then
              printf '%s\n' 'OpenSSL 3 is unavailable and Homebrew is not installed' >&2
              exit 1
            fi
            brew install openssl@3
            for candidate in \
              /opt/homebrew/opt/openssl@3/bin/openssl \
              /usr/local/opt/openssl@3/bin/openssl; do
              if [ -x "$candidate" ]; then openssl_bin="$candidate"; break; fi
            done
          fi
          test -n "$openssl_bin"
          openssl_dir="$(dirname "$openssl_bin")"
          export PATH="$openssl_dir:$PATH"
          printf '%s\n' "$openssl_dir" >> "$GITHUB_PATH"
          printf 'openssl_selected=%s\n' "$openssl_bin"
          openssl version

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          if not isinstance(value.get("run_started_at"), str):
              raise SystemExit("workflow run start timestamp is missing")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"workflow_started_epoch={int(started.timestamp())}\nrun_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Download and verify exact macOS candidate closure
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-macos-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer checkout and candidate closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          python3 torturer/torturer_checks/hosted/candidate.py verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform macos --architecture arm64 --source-sha "$SOURCE_SHA"

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --foreground --signal=KILL 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python3 -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA","SOURCE_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-macos":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "macos", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\nREQUEST_ARTIFACT_NAME={name}\n")
          print(f"lease_run_id={run_id}\nrequest_artifact_name={name}")
          PY

      - name: Start exact macOS preflight candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          # The preflight process is stopped and verified before any token-bearing Render step.
          mkdir -p "$SERVICE_DIR"
          mkdir -p "$DIAGNOSTIC_DIR"
          control_socket="$SERVICE_DIR/preflight.control.sock"
          service_log="$DIAGNOSTIC_DIR/preflight-service.raw.log"
          : > "$service_log"
          chmod 600 "$service_log"
          product_tmp="$DIAGNOSTIC_DIR/preflight-product-tmp"
          mkdir -p "$product_tmp"
          chmod 700 "$product_tmp"
          product_log="$product_tmp/service.jsonl"
          : > "$product_log"
          chmod 600 "$product_log"
          service_binary="$GITHUB_WORKSPACE/candidate/macos_grpcvpnserver"
          peer_uid="$(id -u)"
          service_pid="$(sudo -n sh -c 'set -eu; product_tmp=$1; product_log=$2; control_socket=$3; peer_uid=$4; binary=$5; service_log=$6; env TMPDIR="$product_tmp" DOBBY_LOG_PATH="$product_log" DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" "$binary" > "$service_log" 2>&1 & printf "%s\n" "$!"' dobbyvpn-preflight-service "$product_tmp" "$product_log" "$control_socket" "$peer_uid" "$service_binary" "$service_log")"
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid preflight service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$HANDOFF_DIR/preflight-service.pid"
          printf 'PREFLIGHT_SERVICE_PID=%s\nPREFLIGHT_SERVICE_PID_FILE=%s\nPREFLIGHT_SERVICE_CONTROL_SOCKET=%s\nPREFLIGHT_SERVICE_LOG=%s\nPREFLIGHT_SERVICE_PRODUCT_LOG=%s\n' "$service_pid" "$HANDOFF_DIR/preflight-service.pid" "$control_socket" "$service_log" "$product_log" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            printf 'preflight_service_readiness_attempt=%s\n' "$attempt"
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then printf 'preflight readiness reached cleanup reserve: remaining=%s\n' "$remaining" >&2; exit 1; fi
            if ! sudo -n kill -0 "$service_pid"; then
              emit_private_evidence preflight-service-exited "$service_log"
              printf 'preflight_service_readiness=failed code=SERVICE_EXITED\n' >&2
              exit 1
            fi
            if [ -S "$control_socket" ]; then
              printf 'preflight_service_control_socket_ready=true\n'
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence preflight-service-timeout "$service_log"
            printf 'preflight_service_readiness=failed code=CONTROL_SOCKET_TIMEOUT\n' >&2
            exit 1
          fi
          socket_mode="$(stat -f '%Lp' "$control_socket")"
          socket_owner="$(stat -f '%Su' "$control_socket")"
          printf 'preflight_control_socket_ready=1\n'
          test "$socket_mode" = 600
          status_log="$DIAGNOSTIC_DIR/preflight-control-status.raw.log"
          status_code=0
          DOBBYVPN_CONTROL_SOCKET="$control_socket" "$GITHUB_WORKSPACE/candidate/dobby-cli" status > "$status_log" 2>&1 || status_code=$?
          emit_private_evidence preflight-control-status "$status_log"
          if [ "$status_code" -ne 0 ]; then
            printf 'preflight_control_status=failed code=CLI_STATUS status=%s\n' "$status_code" >&2
            exit "$status_code"
          fi
          printf 'preflight_service_ready=true\n'

      - name: Stop macOS preflight candidate before Render handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          # No candidate process may remain while the Render handoff uses the GitHub credential.
          service_pid="${PREFLIGHT_SERVICE_PID:-}"
          if [ -f "${PREFLIGHT_SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$PREFLIGHT_SERVICE_PID_FILE")"; fi
          case "$service_pid" in
            "") printf 'preflight_service_stop_verified=true state=not-started\n'; exit 0;;
            0|*[!0-9]*) printf 'invalid preflight cleanup pid=%s\n' "$service_pid" >&2; exit 1;;
          esac
          running=false
          if sudo -n kill -0 "$service_pid"; then
            running=true
            sudo -n kill -TERM "$service_pid"
          fi
          stopped=false
          if [ "$running" = true ]; then
            for attempt in $(seq 1 30); do
              printf 'preflight_service_stop_attempt=%s\n' "$attempt"
              if ! sudo -n kill -0 "$service_pid"; then stopped=true; break; fi
              sleep 1
            done
            if [ "$stopped" != true ]; then
              sudo -n kill -KILL "$service_pid"
              for attempt in $(seq 1 10); do
                printf 'preflight_service_force_stop_attempt=%s\n' "$attempt"
                if ! sudo -n kill -0 "$service_pid"; then stopped=true; break; fi
                sleep 1
              done
            fi
          else
            stopped=true
          fi
          test "$stopped" = true
          children_snapshot="$DIAGNOSTIC_DIR/preflight-children.raw.log"
          children_status=0
          ps -axo pid=,ppid=,command= > "$children_snapshot" 2>&1 || children_status=$?
          children_count="$(awk -v parent="$service_pid" '$2 == parent {count++} END {print count + 0}' "$children_snapshot")"
          emit_private_evidence preflight-service-children "$children_snapshot"
          emit_private_evidence preflight-service-structured-log "${PREFLIGHT_SERVICE_PRODUCT_LOG:-}"
          printf 'preflight_remaining_service_children_count=%s\n' "$children_count"
          test "$children_count" -eq 0
          test "$children_status" -eq 0
          rm -f "$PREFLIGHT_SERVICE_CONTROL_SOCKET"
          printf 'preflight_service_stop_verified=true pid=%s\n' "$service_pid"

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download exact encrypted Render lease response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python3 - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [item for item in value.get("artifacts", []) if item.get("name") == sys.argv[2] and item.get("expired") is not True]
          if len(matches) != 1: raise SystemExit(1 if not matches else 2)
          run_id = (matches[0].get("workflow_run") or {}).get("id")
          if not isinstance(run_id, int) or run_id <= 0: raise SystemExit(2)
          print(run_id)
          PY
            )"; then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
                "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python3 - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"id": int(sys.argv[2]), "event": "workflow_dispatch", "head_branch": os.environ["GITHUB_REF_NAME"], "head_sha": os.environ["TORTURER_SHA"], "path": ".github/workflows/server-lease.yml", "display_title": sys.argv[3]}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease workflow {key} mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]: raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" --artifact-name "$response_name" --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" --metadata "$attempt_dir/artifacts.json" --archive "$attempt_dir/response.zip" \
                --expect-file lease.json --expect-file profile.cms; then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              test "$status" -eq 1
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Validate and decrypt encrypted profile
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LEASE_RESPONSE_DIR/lease.json" && test -f "$LEASE_RESPONSE_DIR/profile.cms"
          python3 - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"schema": 1, "kind": "dobbyvpn.render-lease", "run_id": os.environ["LEASE_RUN_ID"], "platform": "macos", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"], "state": "issued"}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))): raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "profile decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Start exact macOS functional candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          # This is the second start: all Render credential-bearing operations have finished.
          mkdir -p "$SERVICE_DIR"
          mkdir -p "$DIAGNOSTIC_DIR"
          control_socket="$SERVICE_DIR/control.sock"
          service_log="$DIAGNOSTIC_DIR/service.raw.log"
          : > "$service_log"
          chmod 600 "$service_log"
          product_tmp="$DIAGNOSTIC_DIR/product-tmp"
          mkdir -p "$product_tmp"
          chmod 700 "$product_tmp"
          product_log="$product_tmp/service.jsonl"
          : > "$product_log"
          chmod 600 "$product_log"
          service_binary="$GITHUB_WORKSPACE/candidate/macos_grpcvpnserver"
          peer_uid="$(id -u)"
          service_pid="$(sudo -n sh -c 'set -eu; product_tmp=$1; product_log=$2; control_socket=$3; peer_uid=$4; binary=$5; service_log=$6; env TMPDIR="$product_tmp" DOBBY_LOG_PATH="$product_log" DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" "$binary" > "$service_log" 2>&1 & printf "%s\n" "$!"' dobbyvpn-service "$product_tmp" "$product_log" "$control_socket" "$peer_uid" "$service_binary" "$service_log")"
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$HANDOFF_DIR/service.pid"
          printf 'SERVICE_PID=%s\nSERVICE_BINARY=%s\nSERVICE_PID_FILE=%s\nSERVICE_CONTROL_SOCKET=%s\nSERVICE_LOG=%s\nSERVICE_PRODUCT_LOG=%s\nDOBBYVPN_CONTROL_SOCKET=%s\n' "$service_pid" "$service_binary" "$HANDOFF_DIR/service.pid" "$control_socket" "$service_log" "$product_log" "$control_socket" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            printf 'service_readiness_attempt=%s\n' "$attempt"
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then printf 'service readiness reached cleanup reserve: remaining=%s\n' "$remaining" >&2; exit 1; fi
            if ! sudo -n kill -0 "$service_pid"; then
              emit_private_evidence service-exited "$service_log"
              printf 'service_readiness=failed code=SERVICE_EXITED\n' >&2
              exit 1
            fi
            if [ -S "$control_socket" ]; then
              printf 'service_control_socket_ready=true\n'
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence service-readiness-timeout "$service_log"
            printf 'service_readiness=failed code=CONTROL_SOCKET_TIMEOUT\n' >&2
            exit 1
          fi
          socket_mode="$(stat -f '%Lp' "$control_socket")"
          socket_owner="$(stat -f '%Su' "$control_socket")"
          printf 'control_socket_ready=1\n'
          test "$socket_mode" = 600
          status_log="$DIAGNOSTIC_DIR/control-status.raw.log"
          status_code=0
          DOBBYVPN_CONTROL_SOCKET="$control_socket" "$GITHUB_WORKSPACE/candidate/dobby-cli" status > "$status_log" 2>&1 || status_code=$?
          emit_private_evidence control-status "$status_log"
          if [ "$status_code" -ne 0 ]; then
            printf 'control_status=failed code=CLI_STATUS status=%s\n' "$status_code" >&2
            exit "$status_code"
          fi
          printf 'service_ready_for_functional_run=true\n'

      - name: Capture macOS default route baseline before VPN start
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          baseline="$DIAGNOSTIC_DIR/baseline-default-route.raw.log"
          baseline_status=0
          timeout --foreground --signal=TERM --kill-after=1s 30s route -n get default > "$baseline" 2>&1 || baseline_status=$?
          emit_private_evidence macos-baseline-default-route "$baseline"
          test "$baseline_status" -eq 0
          baseline_gateway="$(awk -F: '
            { key=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "gateway") { value=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value; exit }
            }
          ' "$baseline")"
          baseline_iface="$(awk -F: '
            { key=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "interface") { value=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value; exit }
            }
          ' "$baseline")"
          baseline_flags="$(awk -F: '
            { key=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "flags") { value=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value; exit }
            }
          ' "$baseline")"
          case "$baseline_gateway" in ""|*[!A-Za-z0-9.:#_-]*) printf 'invalid baseline route gateway\n' >&2; exit 1;; esac
          case "$baseline_iface" in ""|*[!A-Za-z0-9._-]*) printf 'invalid baseline route interface\n' >&2; exit 1;; esac
          case "$baseline_flags" in *[!A-Za-z0-9_,\<\>[:space:]-]*) printf 'invalid baseline route flags\n' >&2; exit 1;; esac
          printf 'MACOS_BASELINE_DEFAULT_GATEWAY=%s\nMACOS_BASELINE_DEFAULT_INTERFACE=%s\nMACOS_BASELINE_DEFAULT_FLAGS=%s\n' \
            "$baseline_gateway" "$baseline_iface" "$baseline_flags" >> "$GITHUB_ENV"
          printf 'macos_baseline_default_route=captured interface=%s\n' "$baseline_iface"

      - name: Run canonical macOS functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          export TORTURER_HOSTED_DEADLINE_EVIDENCE_DIR="$DIAGNOSTIC_DIR/hosted-deadline"
          export TORTURER_HOSTED_DEADLINE_SUMMARY_PATH="$HANDOFF_DIR/functional-deadline-summary.json"
          printf 'TORTURER_HOSTED_DEADLINE_EVIDENCE_DIR=%s\nTORTURER_HOSTED_DEADLINE_SUMMARY_PATH=%s\n' \
            "$TORTURER_HOSTED_DEADLINE_EVIDENCE_DIR" "$TORTURER_HOSTED_DEADLINE_SUMMARY_PATH" >> "$GITHUB_ENV"
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          if [ "$remaining" -lt 950 ]; then printf 'insufficient full-catalog budget before cleanup reserve: seconds=%s\n' "$remaining" >&2; exit 1; fi
          if [ "$remaining" -gt 1260 ]; then remaining=1260; fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          functional_status=0
          python3 -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            --summary-output "$TORTURER_HOSTED_DEADLINE_SUMMARY_PATH" \
            python3 -m torturer_checks.hosted.run --platform macos --cli "$GITHUB_WORKSPACE/candidate/dobby-cli" \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --platform-version "macos-15" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --download-url "https://proof.ovh.net/files/1Mb.dat" \
            --upload-url "https://speed.cloudflare.com/__up" --service-pid "$SERVICE_PID" --service-binary "$SERVICE_BINARY" \
            --service-socket "$SERVICE_CONTROL_SOCKET" --service-pid-file "$SERVICE_PID_FILE" || functional_status=$?
          printf 'FUNCTIONAL_STATUS=%s\n' "$functional_status" >> "$GITHUB_ENV"
          exit "$functional_status"

      - name: Stop exact macOS service and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          service_pid="${SERVICE_PID:-}"
          if [ -f "${SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$SERVICE_PID_FILE")"; fi
          case "$service_pid" in
            "") printf 'SERVICE_STOP_STATE=not-started\n' >> "$GITHUB_ENV"; exit 0;;
            0|*[!0-9]*) printf 'invalid cleanup pid=%s\n' "$service_pid" >&2; exit 1;;
          esac
          if sudo -n kill -0 "$service_pid"; then
            sudo -n kill -TERM "$service_pid"
            stopped=false
            for attempt in $(seq 1 30); do
              printf 'service_cleanup_attempt=%s\n' "$attempt"
              if ! sudo -n kill -0 "$service_pid"; then stopped=true; break; fi
              sleep 1
            done
            if [ "$stopped" != true ]; then
              sudo -n kill -KILL "$service_pid"
              for attempt in $(seq 1 10); do
                if ! sudo -n kill -0 "$service_pid"; then stopped=true; break; fi
                sleep 1
              done
            fi
            test "$stopped" = true
            stop_state=verified
          else
            printf 'candidate service was not running at cleanup\n'
            stop_state=already-dead
          fi
          children_snapshot="$DIAGNOSTIC_DIR/service-children.raw.log"
          children_status=0
          ps -axo pid=,ppid=,command= > "$children_snapshot" 2>&1 || children_status=$?
          children_count="$(awk -v parent="$service_pid" '$2 == parent {count++} END {print count + 0}' "$children_snapshot")"
          emit_private_evidence service-children "$children_snapshot"
          printf 'remaining_service_children_count=%s\n' "$children_count"
          test "$children_count" -eq 0
          test "$children_status" -eq 0
          printf 'SERVICE_STOP_STATE=%s\n' "$stop_state" >> "$GITHUB_ENV"

      - name: Retain opaque macOS functional evidence before route recovery
        if: always()
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 - "$HANDOFF_DIR/macos-failure-evidence.json" <<'PY'
          import os
          from pathlib import Path
          import sys

          from torturer_checks.hosted.deadline import (
              DeadlineError,
              opaque_file_evidence,
              write_opaque_manifest,
          )

          manifest = Path(sys.argv[1])
          records = []
          incomplete = False
          for variable, kind in (
              ("SERVICE_LOG", "macos-service-stream"),
              ("SERVICE_PRODUCT_LOG", "macos-service-structured"),
              ("TORTURER_HOSTED_DEADLINE_SUMMARY_PATH", "macos-deadline-summary"),
              ("DIAGNOSTIC_DIR", "macos-service-children"),
          ):
              value = os.environ.get(variable, "")
              if variable == "DIAGNOSTIC_DIR":
                  value = str(Path(value) / "service-children.raw.log") if value else ""
              if not value:
                  records.append({"evidence_kind": kind, "state": "missing"})
                  incomplete = True
                  continue
              try:
                  records.append(opaque_file_evidence(Path(value), evidence_kind=kind))
              except DeadlineError:
                  records.append({"evidence_kind": kind, "state": "unavailable"})
                  incomplete = True
          status_text = os.environ.get("FUNCTIONAL_STATUS", "")
          try:
              return_code = int(status_text) if status_text else None
          except ValueError:
              return_code = None
              incomplete = True
          outcome = os.environ.get("FUNCTIONAL_OUTCOME", "unknown")
          if outcome not in {"success", "failure", "cancelled", "skipped", "unknown"}:
              outcome = "unknown"
              incomplete = True
          if incomplete:
              manifest_status = "incomplete"
          elif outcome == "success" and return_code == 0:
              manifest_status = "completed"
          else:
              manifest_status = "failed"
          write_opaque_manifest(
              manifest,
              kind="dobbyvpn.macos.functional-evidence",
              status=manifest_status,
              return_code=return_code,
              records=records,
              fields={
                  "run_id": os.environ.get("LEASE_RUN_ID", "unknown"),
                  "platform": "macos",
                  "functional_outcome": outcome,
                  "service_stop_state": os.environ.get("SERVICE_STOP_STATE", "unknown"),
              },
          )
          print("macos_opaque_evidence_manifest=retained")
          PY

      - name: Restore macOS default route before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          service_pid="${SERVICE_PID:-}"
          if [ -f "${SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$SERVICE_PID_FILE")"; fi
          case "$service_pid" in ""|*[!0-9]*) printf 'missing or invalid macOS service pid during route cleanup\n' >&2; exit 1;; esac
          # macos_route treats the observed "not in table" marker separately
          # from a malformed or foreign default route and confirms it twice.
          restore_status=0
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.macos_route \
            --baseline-file "$DIAGNOSTIC_DIR/baseline-default-route.raw.log" \
            --service-probe-file "$DIAGNOSTIC_DIR/service-death-probe.raw.log" \
            --current-file "$DIAGNOSTIC_DIR/post-functional-default-route.raw.log" \
            --confirmation-file "$DIAGNOSTIC_DIR/confirmed-absent-default-route.raw.log" \
            --restore-file "$DIAGNOSTIC_DIR/restore-default-route.raw.log" \
            --verified-file "$DIAGNOSTIC_DIR/verified-default-route.raw.log" \
            --service-pid "$service_pid" --timeout-seconds 10 || restore_status=$?
          emit_private_evidence macos-service-death-probe "$DIAGNOSTIC_DIR/service-death-probe.raw.log"
          emit_private_evidence macos-post-functional-default-route "$DIAGNOSTIC_DIR/post-functional-default-route.raw.log"
          emit_private_evidence macos-confirmed-absent-default-route "$DIAGNOSTIC_DIR/confirmed-absent-default-route.raw.log"
          emit_private_evidence macos-restore-default-route "$DIAGNOSTIC_DIR/restore-default-route.raw.log"
          emit_private_evidence macos-verified-default-route "$DIAGNOSTIC_DIR/verified-default-route.raw.log"
          if [ "$restore_status" -ne 0 ]; then
            printf 'macos_default_route_restore=failed status=%s\n' "$restore_status" >&2
            exit "$restore_status"
          fi

      - name: Upload safe macOS failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-failure-evidence-${{ env.LEASE_RUN_ID }}
          path: |
            ${{ env.HANDOFF_DIR }}/macos-failure-evidence.json
            ${{ env.HANDOFF_DIR }}/functional-deadline-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload safe macOS functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-macos
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque macOS completion marker
        if: always()
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=macos\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque macOS completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-macos
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"

  controller:
    name: Dispatch isolated macOS Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: macos
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
         set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
         [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and macOS lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for macOS client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python3 - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 360); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python3 - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted macOS Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
