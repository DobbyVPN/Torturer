          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          emit_private_display() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              # Candidate-controlled text remains complete in its private
              # runner file.  Only fixed metadata from the adjacent evidence
              # and classification records is suitable for public logs.
