            emit_private_evidence service-error "$service_err"
            emit_private_evidence service-identity "$service_identity_file"
            emit_private_display service-launch "$launch_log"
            emit_private_display service-error "$service_err"
            emit_private_classification service-launch "$launch_log"
            emit_private_classification service-log "$service_log"
            emit_private_classification service-error "$service_err"
