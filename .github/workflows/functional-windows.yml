name: Trusted functional Windows

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Windows candidate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Prove Windows runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify checkout and build Windows candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          python .github/scripts/desktop_build.py libs --platform windows --arch amd64
          python .github/scripts/desktop_build.py app --platform windows --skip-libs
          sha256sum kmp_module/services/windows_grpcvpnserver.exe kmp_module/services/dobby-cli.exe \
            kmp_module/services/wintun.dll kmp_module/services/dobby_bridge.dll

      - name: Stage exact allow-listed Windows candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-windows" \
            --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated Windows candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-windows
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Windows
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: windows
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      SERVICE_CONTROL_ADDRESS: 127.0.0.1:50051

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/dobbyvpn-render-handoff"
          service="$RUNNER_TEMP/dobbyvpn-service"
          mkdir -p "$handoff" "$service"
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nRESULT_PATH=%s\n' \
            "$handoff" "$service" "$handoff/functional-result.json" >> "$GITHUB_ENV"

      - name: Prove Windows client runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST"

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | tee "$HANDOFF_DIR/origin-run.json"
          python - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          if not isinstance(value.get("run_started_at"), str):
              raise SystemExit("workflow run start timestamp is missing")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"workflow_started_epoch={int(started.timestamp())}\nrun_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Download and verify exact Windows candidate closure
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer checkout and candidate closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          python torturer/torturer_checks/hosted/candidate.py verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-windows":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "windows", "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\nREQUEST_ARTIFACT_NAME={name}\n")
          print(f"lease_run_id={run_id}\nrequest_artifact_name={name}")
          PY

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download exact encrypted Render lease response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}" | tee "$attempt_dir/poll.json"
            if lease_workflow_run_id="$(python - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [item for item in value.get("artifacts", []) if item.get("name") == sys.argv[2] and item.get("expired") is not True]
          if len(matches) != 1: raise SystemExit(1 if not matches else 2)
          run_id = (matches[0].get("workflow_run") or {}).get("id")
          if not isinstance(run_id, int) or run_id <= 0: raise SystemExit(2)
          print(run_id)
          PY
            )"; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}" | tee "$attempt_dir/lease-workflow-run.json"
              python - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"id": int(sys.argv[2]), "event": "workflow_dispatch", "head_branch": os.environ["GITHUB_REF_NAME"], "head_sha": os.environ["TORTURER_SHA"], "path": ".github/workflows/server-lease.yml", "display_title": sys.argv[3]}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease workflow {key} mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]: raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" --artifact-name "$response_name" --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" --metadata "$attempt_dir/artifacts.json" --archive "$attempt_dir/response.zip" \
                --expect-file lease.json --expect-file profile.cms; then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              test "$status" -eq 1
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Validate and decrypt encrypted profile
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LEASE_RESPONSE_DIR/lease.json" && test -f "$LEASE_RESPONSE_DIR/profile.cms"
          python - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"schema": 1, "kind": "dobbyvpn.render-lease", "run_id": os.environ["LEASE_RUN_ID"], "platform": "windows", "image_digest": os.environ["SERVER_IMAGE_DIGEST"], "state": "issued"}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))): raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Start exact Windows service candidate
        shell: bash
        run: |
          set -euo pipefail
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          mkdir -p "$SERVICE_DIR/ProgramData/DobbyVPN"
          export PROGRAMDATA="$SERVICE_DIR/ProgramData"
          printf 'PROGRAMDATA=%s\n' "$PROGRAMDATA" >> "$GITHUB_ENV"
          service_log="$SERVICE_DIR/service.raw.log"
          service_err="$SERVICE_DIR/service.stderr.raw.log"
          service_binary="$GITHUB_WORKSPACE/candidate/windows_grpcvpnserver.exe"
          # shellcheck disable=SC2016
          service_pid="$(powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $p=Start-Process -FilePath $args[0] -ArgumentList @("-port","50051") -RedirectStandardOutput $args[1] -RedirectStandardError $args[2] -PassThru; $p.Id' "$service_binary" "$service_log" "$service_err")"
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$HANDOFF_DIR/service.pid"
          printf 'SERVICE_PID=%s\nSERVICE_BINARY=%s\nSERVICE_PID_FILE=%s\nSERVICE_LOG=%s\n' "$service_pid" "$service_binary" "$HANDOFF_DIR/service.pid" "$service_log" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            printf 'service_readiness_attempt=%s\n' "$attempt"
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then printf 'service readiness reached cleanup reserve: remaining=%s\n' "$remaining" >&2; exit 1; fi
            # shellcheck disable=SC2016
            if ! powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid"; then
              printf 'candidate service exited before readiness\n' >&2; cat "$service_log" "$service_err"; exit 1
            fi
            # shellcheck disable=SC2016
            if powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$c=Test-NetConnection -ComputerName 127.0.0.1 -Port 50051; Write-Output $c; if ($c.TcpTestSucceeded) { exit 0 }; exit 1'; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then printf 'candidate service did not open loopback control port\n' >&2; cat "$service_log" "$service_err"; exit 1; fi
          control_token="$PROGRAMDATA/DobbyVPN/control.token"
          test -s "$control_token"
          token_value="$(tr -d '\r\n' < "$control_token")"
          [[ "$token_value" =~ ^[0-9a-fA-F]{64}$ ]]
          printf 'control_token_ready=1 path=%s bytes=%s\n' "$control_token" "${#token_value}"
          "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" status | tee "$SERVICE_DIR/control-status.raw.log"
          printf 'service_pid=%s service_control_address=%s\n' "$service_pid" "$SERVICE_CONTROL_ADDRESS"

      - name: Run canonical Windows functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          if [ "$remaining" -lt 950 ]; then printf 'insufficient full-catalog budget before cleanup reserve: seconds=%s\n' "$remaining" >&2; exit 1; fi
          if [ "$remaining" -gt 1260 ]; then remaining=1260; fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          python -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            python -m torturer_checks.hosted.run --platform windows --cli "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --download-url "https://proof.ovh.net/files/1Mb.dat" \
            --upload-url "https://speed.cloudflare.com/__up" --service-pid "$SERVICE_PID" --service-binary "$SERVICE_BINARY" \
            --service-socket "$SERVICE_CONTROL_ADDRESS" --service-pid-file "$SERVICE_PID_FILE"

      - name: Stop exact Windows service and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          service_pid="${SERVICE_PID:-}"
          if [ -f "${SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$SERVICE_PID_FILE")"; fi
          case "$service_pid" in "") exit 0;; 0|*[!0-9]*) printf 'invalid cleanup pid=%s\n' "$service_pid" >&2; exit 1;; esac
          # shellcheck disable=SC2016
          if powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid"; then
            taskkill.exe /PID "$service_pid" /T /F
            stopped=false
            for attempt in $(seq 1 30); do
              printf 'service_cleanup_attempt=%s\n' "$attempt"
              # shellcheck disable=SC2016
              if ! powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid"; then stopped=true; break; fi
              sleep 1
            done
            test "$stopped" = true
          else
            printf 'candidate service was not running at cleanup\n'
          fi

      - name: Upload safe Windows functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque Windows completion marker
        if: always()
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=windows\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque Windows completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"

  controller:
    name: Dispatch isolated Windows Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: windows
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Validate controller inputs
        run: |
          set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and Windows lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for Windows client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          found=false
          for attempt in $(seq 1 360); do
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}" | tee "$response"
            if python - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Windows Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" -f "inputs[mode]=acquire" -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
            -f "inputs[origin_workflow_path]=.github/workflows/functional-windows.yml" -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
