          status_log="$SERVICE_DIR/control-status.raw.log"
          status_code=0
          status_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - readiness_reserve_seconds - 1))
          status_timeout=30
          if [ "$status_timeout" -gt "$status_remaining" ]; then status_timeout="$status_remaining"; fi
