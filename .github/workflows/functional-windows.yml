      - name: Run canonical Windows functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 300))
          # Eight applicable scenarios plus ten resets require 950 seconds;
          # keep a deliberate 60-second scheduling margin inside the 1,200s cap.
          if [ "$remaining" -gt 1200 ]; then remaining=1200; fi
          available_until_epoch="$(python - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["available_until_epoch"])
          PY
          )"
          case "$available_until_epoch" in
            ''|*[!0-9]*) printf 'lease availability deadline is invalid\n' >&2; exit 1 ;;
          esac
          server_remaining=$((available_until_epoch - $(date +%s)))
          client_post_lane_reserve_seconds=300
          lane_start_margin_seconds=5
          server_lane_remaining=$((server_remaining - client_post_lane_reserve_seconds - lane_start_margin_seconds))
          if [ "$server_lane_remaining" -le 0 ]; then
            printf 'insufficient Render lease lifetime before functional lane: seconds=%s reserve=%s margin=%s\n' \
              "$server_remaining" "$client_post_lane_reserve_seconds" "$lane_start_margin_seconds" >&2
            exit 1
          fi
          if [ "$remaining" -gt "$server_lane_remaining" ]; then remaining="$server_lane_remaining"; fi
          if [ "$remaining" -lt 1010 ]; then printf 'insufficient Windows canonical budget before cleanup reserve: seconds=%s required=1010\n' "$remaining" >&2; exit 1; fi
          printf 'render_lease_lifetime_for_lane_seconds=%s required=%s reserve=%s margin=%s\n' \
            "$server_remaining" "$remaining" "$client_post_lane_reserve_seconds" "$lane_start_margin_seconds"
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          upload_url="$(cat "$HANDOFF_DIR/upload-url.txt")"
          test -n "$upload_url"
          python -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            python -m torturer_checks.hosted.run --platform windows --cli "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" \
            --lane-timeout-seconds "$remaining" \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --platform-version "windows-2022" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --upload-url "$upload_url" \
            --service-pid "$SERVICE_PID" --service-binary "$SERVICE_BINARY" \
            --service-socket "$SERVICE_CONTROL_ADDRESS" --service-pid-file "$SERVICE_PID_FILE" \
            --service-identity-file "$SERVICE_IDENTITY_FILE" \
            --expected-unavailable functional.network-transition=HOSTED_WINDOWS_UPLINK_TOGGLE_UNSUPPORTED \
            --expected-unavailable functional.sleep-wake=HOSTED_RUNNER_SUSPEND_UNSUPPORTED

      - name: Stop exact Windows service and verify cleanup
        id: essential_cleanup
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          # The trusted controller owns exact identity and tree finalization.
          # It also owns every replacement through a native Job Object; this
          # always-run step only supplies the initial launch contract.
          service_identity_file="${SERVICE_IDENTITY_FILE:-$HANDOFF_DIR/service.identity}"
          service_binary="${SERVICE_BINARY:-}"
          controller_raw="$SERVICE_DIR/controller-finalizer-raw"
          controller_log="$SERVICE_DIR/controller-finalizer.raw.log"
          fallback_log="$SERVICE_DIR/controller-finalizer-fallback.raw.log"
          mkdir -p "$controller_raw"
          chmod 700 "$controller_raw"
          service_identity=""
          if [ -f "$service_identity_file" ]; then service_identity="$(tr -d '\r\n' < "$service_identity_file")"; fi
          if ! [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]] || [ -z "$service_binary" ]; then
            emit_private_evidence service-identity "$service_identity_file"
            printf 'service_cleanup=failed code=IDENTITY_UNAVAILABLE\n' >&2
            exit 1
          fi
          service_pid="${service_identity%%|*}"
          service_binary_windows="$(cygpath -w "$service_binary" | tr -d '\r')"
          service_identity_file_windows="$(cygpath -w "$service_identity_file" | tr -d '\r')"
          cleanup_deadline_epoch=$((RUN_DEADLINE_EPOCH - 60))
          cleanup_remaining=$((cleanup_deadline_epoch - $(date +%s)))
          controller_timeout=40
          if [ "$controller_timeout" -gt "$cleanup_remaining" ]; then controller_timeout="$cleanup_remaining"; fi
          if [ "$controller_timeout" -le 0 ]; then
            printf 'service cleanup has no bounded budget before workflow deadline\n' >&2
            exit 1
          fi
          controller_status=0
          timeout --foreground --signal=TERM --kill-after=1s "${controller_timeout}s" \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python -m torturer_checks.hosted.finalize_windows_service \
              --service-identity-file "$service_identity_file" \
              --service-binary "$service_binary" \
              --raw-log-dir "$controller_raw" \
              --timeout-seconds "$controller_timeout" > "$controller_log" 2>&1 || controller_status=$?
          emit_private_evidence controller-finalizer "$controller_log"
          while IFS= read -r -d '' evidence_path; do
            emit_private_evidence controller-command "$evidence_path"
          done < <(find "$controller_raw" -type f -print0)
          if [ "$controller_status" -eq 0 ]; then
            printf 'service_stop_verified=true method=torturer-controller tree=proven pid=%s\n' "$service_pid"
            exit 0
          fi

          # Fallback is deliberately leader-only.  It proves the sidecar
          # identity adjacent to Stop-Process, records every observation, and
          # exits nonzero because YAML cannot prove descendants without the
          # controller's native finalizer.  A GitHub-observed successful
          # hosted step is the only allowed already-gone case: trusted adapter
          # finalization already proved the replacement Job empty and the
          # initial tree stopped before that step could return success.
          fallback_status=0
          allow_already_gone=0
          controller_reported_absent=0
          while IFS= read -r controller_line; do
            if [ "$controller_line" = 'windows_service_finalizer=failed code=SERVICE_PID_PROBE_FAILED' ]; then
              controller_reported_absent=1
            fi
          done < "$controller_log"
          if [ "$FUNCTIONAL_OUTCOME" = "success" ] && [ "$controller_reported_absent" -eq 1 ]; then allow_already_gone=1; fi
          fallback_timeout=5
          fallback_remaining=$((cleanup_deadline_epoch - $(date +%s)))
          if [ "$fallback_timeout" -gt "$fallback_remaining" ]; then fallback_timeout="$fallback_remaining"; fi
          if [ "$fallback_timeout" -le 0 ]; then
            printf 'fallback has no bounded budget before workflow deadline\n' >&2
            exit 1
          fi
          timeout --foreground --signal=TERM --kill-after=1s "${fallback_timeout}s" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $identity=([System.IO.File]::ReadAllText($args[0])).Trim(); if ($identity -notmatch "^[1-9][0-9]{0,9}\|[1-9][0-9]+$") { Write-Output "fallback_state=identity-invalid"; exit 2 }; $separator=$identity.IndexOf([char]124); $processId=[int]$identity.Substring(0,$separator); $expectedTicks=$identity.Substring($separator+1); $expected=[System.IO.Path]::GetFullPath($args[1]); $allow=([int]$args[2] -eq 1); $p=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $processId) -ErrorAction Stop; if ($null -eq $p) { if ($allow) { Write-Output "fallback_state=leader-absent trusted-controller-result"; exit 0 }; Write-Output "fallback_state=leader-absent tree-unproven"; exit 3 }; $actual=[System.IO.Path]::GetFullPath([string]$p.ExecutablePath); $ticks=$p.CreationDate.ToUniversalTime().Ticks; if ($actual -ine $expected) { Write-Output ("fallback_state=path-mismatch actual=" + $actual); exit 4 }; if ($expectedTicks -ne [string]$ticks) { Write-Output ("fallback_state=identity-mismatch actual=" + $p.ProcessId + "|" + $ticks); exit 5 }; Write-Output ("fallback_state=identity-checked pid=" + $processId + "|" + $ticks); Stop-Process -Id $processId -Force -ErrorAction Stop; $after=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $processId) -ErrorAction Stop; if ($null -ne $after) { Write-Output "fallback_state=leader-survived tree-unproven"; exit 6 }; Write-Output "fallback_state=leader-gone tree-unproven"; exit 7' \
            "$service_identity_file_windows" "$service_binary_windows" "$allow_already_gone" > "$fallback_log" 2>&1 || fallback_status=$?
          emit_private_evidence controller-fallback "$fallback_log"
          if [ "$allow_already_gone" -eq 1 ] && [ "$fallback_status" -eq 0 ]; then
            printf 'service_stop_verified=true method=completed-hosted-controller tree=proven pid=%s\n' "$service_pid"
            exit 0
          fi
          printf 'service_cleanup=failed code=CONTROLLER_FINALIZER status=%s fallback_status=%s\n' "$controller_status" "$fallback_status" >&2
          exit 1

      - name: Remove plaintext handoff material and prepare completion marker
        if: always()
        timeout-minutes: 1
        id: post_lane_marker_prepare
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          # Plaintext handoff material is removed even when timing metadata is
          # unavailable; marker publication itself still fails closed.
          if [ -n "${HANDOFF_DIR:-}" ]; then
            rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/upload-url.txt" "$HANDOFF_DIR/recipient.key"
          else
            printf '%s\n' 'post-lane plaintext removal skipped: handoff directory was never initialized' >&2
          fi
          run_deadline="${RUN_DEADLINE_EPOCH:-}"
          provider_deadline="${POST_LANE_DEADLINE_EPOCH:-}"
          post_lane_marker_reserve="${POST_LANE_MARKER_RESERVE_SECONDS:-}"
          if [ -z "${HANDOFF_DIR:-}" ] || ! [[ "$run_deadline" =~ ^[0-9]+$ ]] || ! [[ "$provider_deadline" =~ ^[0-9]+$ ]] || ! [[ "$post_lane_marker_reserve" =~ ^[0-9]+$ ]]; then
            printf '%s\n' 'post-lane marker preparation skipped: functional lane did not establish valid origin/provider deadlines' >&2
            exit 1
          fi
          if [ "$run_deadline" -le "$provider_deadline" ]; then
            post_deadline="$run_deadline"
          else
            post_deadline="$provider_deadline"
          fi
          post_remaining=$((post_deadline - $(date +%s)))
          if [ "$post_remaining" -lt "$post_lane_marker_reserve" ]; then
            printf 'post-lane marker preparation cannot fit before origin/provider deadline: remaining=%s required=%s\n' \
              "$post_remaining" "$post_lane_marker_reserve" >&2
            exit 1
          fi
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=windows\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque Windows completion marker
        timeout-minutes: 1
        if: always() && steps.essential_cleanup.outcome == 'success' && steps.post_lane_marker_prepare.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Upload safe Windows functional result
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

  controller:
    name: Dispatch isolated Windows Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: windows
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
         set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
         [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and Windows lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for Windows client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 360); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Windows Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" -f "inputs[mode]=acquire" -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
            -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
            -f "inputs[origin_workflow_path]=.github/workflows/functional-windows.yml" -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
            -f "inputs[platform]=${PLATFORM}" -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
