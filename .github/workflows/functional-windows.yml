            probe_log="$SERVICE_DIR/service-probe-${attempt}.raw.log"
            probe_status=0
            probe_timeout=10
            if [ "$probe_timeout" -gt "$remaining" ]; then probe_timeout="$remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${probe_timeout}s" \
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$probe_log" 2>&1 || probe_status=$?
