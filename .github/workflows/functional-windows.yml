name: Trusted functional Windows

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Windows candidate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Prove Windows runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Verify checkout and build Windows candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          python .github/scripts/desktop_build.py libs --platform windows --arch amd64
          python .github/scripts/desktop_build.py app --platform windows --skip-libs
          sha256sum kmp_module/services/windows_grpcvpnserver.exe kmp_module/services/dobby-cli.exe \
            kmp_module/services/wintun.dll kmp_module/services/dobby_bridge.dll

      - name: Stage exact allow-listed Windows candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-windows" \
            --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated Windows candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-windows
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Windows
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: windows
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      SERVICE_CONTROL_ADDRESS: 127.0.0.1:50051

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/dobbyvpn-render-handoff"
          service="$RUNNER_TEMP/dobbyvpn-service"
          mkdir -p "$handoff" "$service"
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nRESULT_PATH=%s\nLEASE_RUN_ID=unassigned\n' \
            "$handoff" "$service" "$handoff/functional-result.json" >> "$GITHUB_ENV"

      - name: Prove Windows client runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST"

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          if not isinstance(value.get("run_started_at"), str):
              raise SystemExit("workflow run start timestamp is missing")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"workflow_started_epoch={int(started.timestamp())}\nrun_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Download and verify exact Windows candidate closure
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer checkout and candidate closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          python torturer/torturer_checks/hosted/candidate.py verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Git Bash otherwise rewrites the OpenSSL /CN subject as a Windows path.
          export MSYS_NO_PATHCONV=1
          export MSYS2_ARG_CONV_EXCL='*'
          timeout --foreground --signal=KILL 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA","SOURCE_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-windows":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "windows", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\nREQUEST_ARTIFACT_NAME={name}\n")
          print(f"lease_run_id={run_id}\nrequest_artifact_name={name}")
          PY

      - name: Start exact Windows preflight candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          emit_private_display() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              display="$(python - "$file" <<'PY'
          import re
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_bytes().decode("utf-8", "replace")
          value = value.replace("\x00", " ")
          # This is an additive, public-safe diagnostic view.  The original
          # stderr remains private on the runner and is represented by the
          # evidence byte count and digest above.
          value = re.sub(r"(?i)(?:[A-Za-z]:\\|\\\\)[^\r\n]*", "<path>", value)
          value = re.sub(r"(?i)\bS-\d-\d+(?:-\d+)+\b", "<sid>", value)
          value = re.sub(r"(?i)\b(?:[A-Za-z0-9_.-]+\\)?(?:runner|administrator)[A-Za-z0-9_.-]*\b", "<user>", value)
          value = re.sub(r"\b\d{2,}\b", "<number>", value)
          lines = [" ".join(line.split()) for line in value.splitlines()]
          lines = [line for line in lines if line]
          print(" | ".join(lines)[:1000])
          PY
              )"
              printf 'diagnostic_display label=%s text=%s\n' "$label" "$display"
            else
              printf 'diagnostic_display label=%s state=missing\n' "$label"
            fi
          }
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # The preflight process is stopped and verified before any token-bearing Render step.
          # Keep this whole startup lane bounded independently of the job timeout.
          # A bounded attempt count is not sufficient: every PowerShell child and
          # the CLI status probe must have its own timeout, otherwise one hung
          # child can consume the entire workflow and skip useful diagnostics.
          PREFLIGHT_MAX_SECONDS=300
          PREFLIGHT_CLEANUP_RESERVE_SECONDS=180
          PREFLIGHT_PROBE_TIMEOUT_SECONDS=10
          preflight_started_epoch="$(date +%s)"
          preflight_deadline_epoch=$((preflight_started_epoch + PREFLIGHT_MAX_SECONDS))
          cleanup_reserve_deadline=$((RUN_DEADLINE_EPOCH - PREFLIGHT_CLEANUP_RESERVE_SECONDS))
          if [ "$preflight_deadline_epoch" -gt "$cleanup_reserve_deadline" ]; then
            preflight_deadline_epoch="$cleanup_reserve_deadline"
          fi
          if [ "$preflight_deadline_epoch" -le "$preflight_started_epoch" ]; then
            printf 'preflight startup has no bounded budget before cleanup reserve\n' >&2
            exit 1
          fi
          printf 'preflight_budget_seconds=%s cleanup_reserve_seconds=%s deadline_epoch=%s\n' \
            "$((preflight_deadline_epoch - preflight_started_epoch))" \
            "$PREFLIGHT_CLEANUP_RESERVE_SECONDS" "$preflight_deadline_epoch"

          run_preflight_probe() {
            label="$1"
            output="$2"
            shift 2
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 0 ]; then
              printf 'preflight_probe label=%s status=DEADLINE_EXCEEDED\n' "$label" >&2
              return 124
            fi
            timeout_seconds="$PREFLIGHT_PROBE_TIMEOUT_SECONDS"
            if [ "$timeout_seconds" -gt "$remaining" ]; then timeout_seconds="$remaining"; fi
            printf 'preflight_probe_start label=%s timeout_seconds=%s remaining_seconds=%s\n' \
              "$label" "$timeout_seconds" "$remaining"
            status=0
            if timeout --foreground --signal=TERM --kill-after=1s "${timeout_seconds}s" \
              "$@" > "$output" 2>&1; then
              status=0
            else
              status=$?
            fi
            printf 'preflight_probe_result label=%s status=%s\n' "$label" "$status"
            return "$status"
          }

          # shellcheck disable=SC2016
          programdata_path="$SERVICE_DIR/ProgramData"
          mkdir -p "$programdata_path/DobbyVPN"
          service_log="$SERVICE_DIR/preflight-service.raw.log"
          service_err="$SERVICE_DIR/preflight-service.stderr.raw.log"
          launch_log="$SERVICE_DIR/preflight-launch.raw.log"
          probe_log=""
          network_probe_log=""
          status_log="$SERVICE_DIR/preflight-control-status.raw.log"
          preflight_pid_file="$HANDOFF_DIR/preflight-service.pid"
          service_binary="$GITHUB_WORKSPACE/candidate/windows_grpcvpnserver.exe"
          service_binary_windows="$(cygpath -w "$service_binary" | tr -d '\r')"
          service_log_windows="$(cygpath -w "$service_log" | tr -d '\r')"
          service_err_windows="$(cygpath -w "$service_err" | tr -d '\r')"
          programdata_windows="$(cygpath -w "$programdata_path" | tr -d '\r')"
          preflight_pid_file_windows="$(cygpath -w "$preflight_pid_file" | tr -d '\r')"
          export DOBBYVPN_WINDOWS_SERVICE_BINARY="$service_binary_windows"
          export DOBBYVPN_WINDOWS_SERVICE_LOG="$service_log_windows"
          export DOBBYVPN_WINDOWS_SERVICE_ERR="$service_err_windows"
          export DOBBYVPN_WINDOWS_PROGRAMDATA="$programdata_windows"
          export DOBBYVPN_WINDOWS_SERVICE_PID_FILE="$preflight_pid_file_windows"
          # Publish the cleanup path before launch.  The PowerShell launcher
          # records the PID before returning it, so a launch timeout after
          # Start-Process cannot strand the candidate without a cleanup handle.
          printf 'PREFLIGHT_SERVICE_PID_FILE=%s\nPREFLIGHT_SERVICE_LOG=%s\n' \
            "$preflight_pid_file" "$service_log" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016
          # Do not resolve WindowsIdentity.Name here.  On a hosted runner that
          # account-name lookup can block before Start-Process returns, while
          # the Bash command substitution waits indefinitely.  USERDOMAIN and
          # USERNAME are already supplied by the runner and are the account
          # identity consumed by the product's LookupSID call.  Keep explicit
          # phase diagnostics on stderr so they remain visible even though the
          # PID itself is captured from stdout.
          launch_remaining=$((preflight_deadline_epoch - $(date +%s)))
          if [ "$launch_remaining" -le 0 ]; then
            printf 'preflight launch reached its bounded deadline\n' >&2
            exit 1
          fi
          launch_timeout="$PREFLIGHT_PROBE_TIMEOUT_SECONDS"
          if [ "$launch_timeout" -gt "$launch_remaining" ]; then launch_timeout="$launch_remaining"; fi
          printf 'preflight_probe_start label=service-launch timeout_seconds=%s remaining_seconds=%s\n' \
            "$launch_timeout" "$launch_remaining"
          launch_status=0
          service_pid="$(timeout --foreground --signal=TERM --kill-after=1s "${launch_timeout}s" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; [Console]::Error.WriteLine("windows_launch_phase=environment"); $env:ProgramData=$env:DOBBYVPN_WINDOWS_PROGRAMDATA; if ([string]::IsNullOrWhiteSpace($env:USERNAME)) { throw "USERNAME is unavailable" }; $account=$env:USERNAME; if (-not [string]::IsNullOrWhiteSpace($env:USERDOMAIN)) { $account="$($env:USERDOMAIN)\$($env:USERNAME)" }; $env:DOBBYVPN_CONTROL_TOKEN_USER=$account; [Console]::Error.WriteLine("windows_launch_phase=account_ready"); $p=Start-Process -FilePath $env:DOBBYVPN_WINDOWS_SERVICE_BINARY -ArgumentList @("-port","50051") -RedirectStandardOutput $env:DOBBYVPN_WINDOWS_SERVICE_LOG -RedirectStandardError $env:DOBBYVPN_WINDOWS_SERVICE_ERR -PassThru; [System.IO.File]::WriteAllText($env:DOBBYVPN_WINDOWS_SERVICE_PID_FILE, ([string]$p.Id + [Environment]::NewLine)); [Console]::Error.WriteLine("windows_launch_phase=process_started"); [Console]::Error.WriteLine("windows_launch_phase=pid_recorded"); $p.Id' \
            2> "$launch_log")" || launch_status=$?
          printf 'preflight_probe_result label=service-launch status=%s\n' "$launch_status"
          emit_private_evidence preflight-launch "$launch_log"
          if [ "$launch_status" -ne 0 ]; then
            if [ -f "$preflight_pid_file" ]; then
              IFS= read -r service_pid < "$preflight_pid_file" || true
            fi
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_display preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-launch "$launch_log"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            if [ "$launch_status" -eq 124 ]; then
              printf 'preflight_service_launch=failed code=LAUNCH_TIMEOUT status=%s\n' "$launch_status" >&2
            else
              printf 'preflight_service_launch=failed code=LAUNCH status=%s\n' "$launch_status" >&2
            fi
            exit 1
          fi
          unset DOBBYVPN_WINDOWS_SERVICE_BINARY DOBBYVPN_WINDOWS_SERVICE_LOG DOBBYVPN_WINDOWS_SERVICE_ERR DOBBYVPN_WINDOWS_PROGRAMDATA DOBBYVPN_WINDOWS_SERVICE_PID_FILE
          export PROGRAMDATA="$programdata_path"
          printf 'PROGRAMDATA=%s\n' "$PROGRAMDATA" >> "$GITHUB_ENV"
          if [ -z "$service_pid" ] && [ -f "$preflight_pid_file" ]; then
            IFS= read -r service_pid < "$preflight_pid_file" || true
          fi
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid preflight service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$preflight_pid_file"
          printf 'PREFLIGHT_SERVICE_PID=%s\n' "$service_pid" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            printf 'preflight_service_readiness_attempt=%s\n' "$attempt"
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 0 ]; then
              printf 'preflight readiness reached bounded startup deadline: remaining=%s\n' "$remaining" >&2
              break
            fi
            # shellcheck disable=SC2016
            probe_log="$SERVICE_DIR/preflight-service-probe-${attempt}.raw.log"
            probe_status=0
            if run_preflight_probe "service-process-${attempt}" "$probe_log" \
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("preflight_service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid"; then
              probe_status=0
            else
              probe_status=$?
            fi
            emit_private_evidence "preflight-service-probe-${attempt}" "$probe_log"
            if [ "$probe_status" -ne 0 ]; then
              emit_private_evidence preflight-service-log "$service_log"
              emit_private_evidence preflight-service-error "$service_err"
              emit_private_evidence preflight-launch "$launch_log"
              emit_private_display "preflight-service-probe-${attempt}" "$probe_log"
              emit_private_display preflight-service-error "$service_err"
              emit_private_classification "preflight-service-probe-${attempt}" "$probe_log"
              emit_private_classification preflight-service-log "$service_log"
              emit_private_classification preflight-service-error "$service_err"
              if [ "$probe_status" -eq 124 ]; then
                printf 'preflight_service_readiness=failed code=SERVICE_PROBE_TIMEOUT status=%s\n' "$probe_status" >&2
              else
                printf 'preflight_service_readiness=failed code=SERVICE_EXITED status=%s\n' "$probe_status" >&2
              fi
              exit 1
            fi
            network_probe_log="$SERVICE_DIR/preflight-network-probe-${attempt}.raw.log"
            network_probe_status=0
            if run_preflight_probe "control-port-${attempt}" "$network_probe_log" \
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$c=Test-NetConnection -ComputerName 127.0.0.1 -Port 50051; Write-Output $c; if ($c.TcpTestSucceeded) { exit 0 }; exit 1'; then
              network_probe_status=0
            else
              network_probe_status=$?
            fi
            emit_private_evidence "preflight-network-probe-${attempt}" "$network_probe_log"
            if [ "$network_probe_status" -eq 124 ]; then
              emit_private_evidence preflight-service-log "$service_log"
              emit_private_evidence preflight-service-error "$service_err"
              emit_private_evidence preflight-launch "$launch_log"
              emit_private_display "preflight-network-probe-${attempt}" "$network_probe_log"
              emit_private_display preflight-service-error "$service_err"
              emit_private_classification "preflight-network-probe-${attempt}" "$network_probe_log"
              emit_private_classification preflight-service-log "$service_log"
              emit_private_classification preflight-service-error "$service_err"
              printf 'preflight_service_readiness=failed code=CONTROL_PORT_PROBE_TIMEOUT status=%s\n' "$network_probe_status" >&2
              exit 1
            fi
            if [ "$network_probe_status" -eq 0 ]; then ready=true; break; fi
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 1 ]; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence preflight-service-timeout "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_evidence preflight-service-probe-last "$probe_log"
            emit_private_evidence preflight-network-probe-last "$network_probe_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_display preflight-service-probe-last "$probe_log"
            emit_private_display preflight-network-probe-last "$network_probe_log"
            emit_private_classification preflight-service-timeout "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_service_readiness=failed code=CONTROL_PORT_TIMEOUT budget_seconds=%s\n' \
              "$((preflight_deadline_epoch - preflight_started_epoch))" >&2
            exit 1
          fi
          control_token="$PROGRAMDATA/DobbyVPN/control.token"
          if [ ! -s "$control_token" ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=MISSING\n' >&2
            exit 1
          fi
          token_value=""
          token_read_status=0
          token_remaining=$((preflight_deadline_epoch - $(date +%s)))
          if [ "$token_remaining" -le 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=DEADLINE_EXCEEDED\n' >&2
            exit 1
          fi
          token_timeout=5
          if [ "$token_timeout" -gt "$token_remaining" ]; then token_timeout="$token_remaining"; fi
          printf 'preflight_probe_start label=control-token-read timeout_seconds=%s remaining_seconds=%s\n' \
            "$token_timeout" "$token_remaining"
          token_value="$(timeout --foreground --signal=TERM --kill-after=1s "${token_timeout}s" tr -d '\r\n' < "$control_token")" || token_read_status=$?
          printf 'preflight_probe_result label=control-token-read status=%s\n' "$token_read_status"
          if [ "$token_read_status" -ne 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=READ_TIMEOUT status=%s\n' "$token_read_status" >&2
            exit 1
          fi
          if [[ ! "$token_value" =~ ^[0-9a-fA-F]{64}$ ]]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=INVALID\n' >&2
            exit 1
          fi
          printf 'preflight_control_token_ready=1\n'
          status_code=0
          if run_preflight_probe control-status "$status_log" \
            "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" status; then
            status_code=0
          else
            status_code=$?
          fi
          emit_private_evidence preflight-control-status "$status_log"
          if [ "$status_code" -ne 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-control-status "$status_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-control-status "$status_log"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            if [ "$status_code" -eq 124 ]; then
              printf 'preflight_control_status=failed code=CLI_STATUS_TIMEOUT status=%s\n' "$status_code" >&2
            else
              printf 'preflight_control_status=failed code=CLI_STATUS status=%s\n' "$status_code" >&2
            fi
            exit "$status_code"
          fi
          printf 'preflight_service_ready=true\n'

      - name: Stop Windows preflight candidate before Render handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          # No candidate process may remain while the Render handoff uses the GitHub credential.
          service_pid="${PREFLIGHT_SERVICE_PID:-}"
          if [ -f "${PREFLIGHT_SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$PREFLIGHT_SERVICE_PID_FILE")"; fi
          case "$service_pid" in
            "") printf 'preflight_service_stop_verified=true state=not-started\n'; exit 0;;
            0|*[!0-9]*) printf 'invalid preflight cleanup pid=%s\n' "$service_pid" >&2; exit 1;;
          esac
          running=false
          cleanup_probe_log="$SERVICE_DIR/preflight-cleanup-probe-initial.raw.log"
          cleanup_probe_status=0
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("preflight_service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$cleanup_probe_log" 2>&1 || cleanup_probe_status=$?
          emit_private_evidence preflight-cleanup-probe "$cleanup_probe_log"
          if [ "$cleanup_probe_status" -eq 0 ]; then
            running=true
            taskkill_log="$SERVICE_DIR/preflight-taskkill.raw.log"
            taskkill_status=0
            taskkill.exe /PID "$service_pid" /T /F > "$taskkill_log" 2>&1 || taskkill_status=$?
            emit_private_evidence preflight-taskkill "$taskkill_log"
            if [ "$taskkill_status" -ne 0 ]; then
              printf 'preflight_service_cleanup=failed code=TASKKILL status=%s\n' "$taskkill_status" >&2
              exit "$taskkill_status"
            fi
          fi
          stopped=false
          if [ "$running" = true ]; then
            for attempt in $(seq 1 30); do
              printf 'preflight_service_stop_attempt=%s\n' "$attempt"
              cleanup_probe_log="$SERVICE_DIR/preflight-cleanup-probe-${attempt}.raw.log"
              cleanup_probe_status=0
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("preflight_service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$cleanup_probe_log" 2>&1 || cleanup_probe_status=$?
              emit_private_evidence preflight-cleanup-probe "$cleanup_probe_log"
              if [ "$cleanup_probe_status" -ne 0 ]; then stopped=true; break; fi
              sleep 1
            done
          else
            stopped=true
          fi
          test "$stopped" = true
          printf 'preflight_service_stop_verified=true pid=%s\n' "$service_pid"
          rm -f "$SERVICE_DIR/ProgramData/DobbyVPN/control.token"
          printf 'preflight_control_state_removed=true\n'

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download exact encrypted Render lease response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [item for item in value.get("artifacts", []) if item.get("name") == sys.argv[2] and item.get("expired") is not True]
          if len(matches) != 1: raise SystemExit(1 if not matches else 2)
          run_id = (matches[0].get("workflow_run") or {}).get("id")
          if not isinstance(run_id, int) or run_id <= 0: raise SystemExit(2)
          print(run_id)
          PY
            )"; then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
                "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"id": int(sys.argv[2]), "event": "workflow_dispatch", "head_branch": os.environ["GITHUB_REF_NAME"], "head_sha": os.environ["TORTURER_SHA"], "path": ".github/workflows/server-lease.yml", "display_title": sys.argv[3]}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease workflow {key} mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]: raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" --artifact-name "$response_name" --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" --metadata "$attempt_dir/artifacts.json" --archive "$attempt_dir/response.zip" \
                --expect-file lease.json --expect-file profile.cms; then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              test "$status" -eq 1
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Validate and decrypt encrypted profile
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LEASE_RESPONSE_DIR/lease.json" && test -f "$LEASE_RESPONSE_DIR/profile.cms"
          python - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"schema": 1, "kind": "dobbyvpn.render-lease", "run_id": os.environ["LEASE_RUN_ID"], "platform": "windows", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"], "state": "issued"}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))): raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "profile decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Start exact Windows functional candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          emit_private_display() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              display="$(python - "$file" <<'PY'
          import re
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_bytes().decode("utf-8", "replace")
          value = value.replace("\x00", " ")
          value = re.sub(r"(?i)(?:[A-Za-z]:\\|\\\\)[^\r\n]*", "<path>", value)
          value = re.sub(r"(?i)\bS-\d-\d+(?:-\d+)+\b", "<sid>", value)
          value = re.sub(r"(?i)\b(?:[A-Za-z0-9_.-]+\\)?(?:runner|administrator)[A-Za-z0-9_.-]*\b", "<user>", value)
          value = re.sub(r"\b\d{2,}\b", "<number>", value)
          lines = [" ".join(line.split()) for line in value.splitlines()]
          print(" | ".join(line for line in lines if line)[:1000])
          PY
              )"
              printf 'diagnostic_display label=%s text=%s\n' "$label" "$display"
            else
              printf 'diagnostic_display label=%s state=missing\n' "$label"
            fi
          }
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # This is the second start: all Render credential-bearing operations have finished.
          # shellcheck disable=SC2016
          programdata_path="$SERVICE_DIR/ProgramData"
          mkdir -p "$programdata_path/DobbyVPN"
          service_log="$SERVICE_DIR/service.raw.log"
          service_err="$SERVICE_DIR/service.stderr.raw.log"
          service_binary="$GITHUB_WORKSPACE/candidate/windows_grpcvpnserver.exe"
          service_binary_windows="$(cygpath -w "$service_binary" | tr -d '\r')"
          service_log_windows="$(cygpath -w "$service_log" | tr -d '\r')"
          service_err_windows="$(cygpath -w "$service_err" | tr -d '\r')"
          programdata_windows="$(cygpath -w "$programdata_path" | tr -d '\r')"
          export DOBBYVPN_WINDOWS_SERVICE_BINARY="$service_binary_windows"
          export DOBBYVPN_WINDOWS_SERVICE_LOG="$service_log_windows"
          export DOBBYVPN_WINDOWS_SERVICE_ERR="$service_err_windows"
          export DOBBYVPN_WINDOWS_PROGRAMDATA="$programdata_windows"
          # shellcheck disable=SC2016
          # Keep this launch path identical to the preflight path.  The
          # account is assembled from runner-provided environment values so a
          # domain lookup cannot hold the command substitution indefinitely.
          service_pid="$(powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; [Console]::Error.WriteLine("windows_launch_phase=environment"); $env:ProgramData=$env:DOBBYVPN_WINDOWS_PROGRAMDATA; if ([string]::IsNullOrWhiteSpace($env:USERNAME)) { throw "USERNAME is unavailable" }; $account=$env:USERNAME; if (-not [string]::IsNullOrWhiteSpace($env:USERDOMAIN)) { $account="$($env:USERDOMAIN)\$($env:USERNAME)" }; $env:DOBBYVPN_CONTROL_TOKEN_USER=$account; [Console]::Error.WriteLine("windows_launch_phase=account_ready"); $p=Start-Process -FilePath $env:DOBBYVPN_WINDOWS_SERVICE_BINARY -ArgumentList @("-port","50051") -RedirectStandardOutput $env:DOBBYVPN_WINDOWS_SERVICE_LOG -RedirectStandardError $env:DOBBYVPN_WINDOWS_SERVICE_ERR -PassThru; [Console]::Error.WriteLine("windows_launch_phase=process_started"); $p.Id')"
          unset DOBBYVPN_WINDOWS_SERVICE_BINARY DOBBYVPN_WINDOWS_SERVICE_LOG DOBBYVPN_WINDOWS_SERVICE_ERR DOBBYVPN_WINDOWS_PROGRAMDATA
          export PROGRAMDATA="$programdata_path"
          printf 'PROGRAMDATA=%s\n' "$PROGRAMDATA" >> "$GITHUB_ENV"
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$HANDOFF_DIR/service.pid"
          printf 'SERVICE_PID=%s\nSERVICE_BINARY=%s\nSERVICE_PID_FILE=%s\nSERVICE_LOG=%s\n' "$service_pid" "$service_binary" "$HANDOFF_DIR/service.pid" "$service_log" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            printf 'service_readiness_attempt=%s\n' "$attempt"
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then printf 'service readiness reached cleanup reserve: remaining=%s\n' "$remaining" >&2; exit 1; fi
            probe_log="$SERVICE_DIR/service-probe-${attempt}.raw.log"
            probe_status=0
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$probe_log" 2>&1 || probe_status=$?
            if [ "$probe_status" -ne 0 ]; then
              emit_private_evidence service-probe "$probe_log"
              emit_private_evidence service-log "$service_log"
              emit_private_evidence service-error "$service_err"
              emit_private_display service-error "$service_err"
              emit_private_classification service-error "$service_err"
              printf 'service_readiness=failed code=SERVICE_EXITED status=%s\n' "$probe_status" >&2
              exit 1
            fi
            network_probe_log="$SERVICE_DIR/network-probe-${attempt}.raw.log"
            network_probe_status=0
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$c=Test-NetConnection -ComputerName 127.0.0.1 -Port 50051; Write-Output $c; if ($c.TcpTestSucceeded) { exit 0 }; exit 1' > "$network_probe_log" 2>&1 || network_probe_status=$?
            if [ "$network_probe_status" -eq 0 ]; then ready=true; break; fi
            emit_private_evidence network-probe "$network_probe_log"
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence service-readiness-timeout "$service_log"
            emit_private_evidence service-error-timeout "$service_err"
            emit_private_display service-error-timeout "$service_err"
            emit_private_classification service-readiness-timeout "$service_log"
            emit_private_classification service-error-timeout "$service_err"
            printf 'service_readiness=failed code=CONTROL_PORT_TIMEOUT\n' >&2
            exit 1
          fi
          control_token="$PROGRAMDATA/DobbyVPN/control.token"
          test -s "$control_token"
          token_value="$(tr -d '\r\n' < "$control_token")"
          [[ "$token_value" =~ ^[0-9a-fA-F]{64}$ ]]
          printf 'control_token_ready=1\n'
          status_log="$SERVICE_DIR/control-status.raw.log"
          status_code=0
          "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" status > "$status_log" 2>&1 || status_code=$?
          emit_private_evidence control-status "$status_log"
          if [ "$status_code" -ne 0 ]; then
            printf 'control_status=failed code=CLI_STATUS status=%s\n' "$status_code" >&2
            exit "$status_code"
          fi
          printf 'service_ready_for_functional_run=true\n'

      - name: Run canonical Windows functional scenarios
        id: functional
        shell: bash
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          # Eight applicable scenarios plus ten resets require 938 seconds;
          # keep a deliberate 60-second scheduling margin inside the 1,200s cap.
          if [ "$remaining" -lt 998 ]; then printf 'insufficient Windows canonical budget before cleanup reserve: seconds=%s required=998\n' "$remaining" >&2; exit 1; fi
          if [ "$remaining" -gt 1200 ]; then remaining=1200; fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          python -m torturer_checks.hosted.deadline --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            python -m torturer_checks.hosted.run --platform windows --cli "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" \
            --profile "$HANDOFF_DIR/profile.toml" --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --platform-version "windows-2022" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" --server-image-digest "$SERVER_IMAGE_DIGEST" --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" --download-url "https://proof.ovh.net/files/1Mb.dat" \
            --upload-url "https://speed.cloudflare.com/__up" --service-pid "$SERVICE_PID" --service-binary "$SERVICE_BINARY" \
            --service-socket "$SERVICE_CONTROL_ADDRESS" --service-pid-file "$SERVICE_PID_FILE" \
            --expected-unavailable functional.network-transition=HOSTED_WINDOWS_UPLINK_TOGGLE_UNSUPPORTED \
            --expected-unavailable functional.sleep-wake=HOSTED_RUNNER_SUSPEND_UNSUPPORTED

      - name: Stop exact Windows service and verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          service_pid="${SERVICE_PID:-}"
          if [ -f "${SERVICE_PID_FILE:-}" ]; then service_pid="$(cat "$SERVICE_PID_FILE")"; fi
          case "$service_pid" in "") exit 0;; 0|*[!0-9]*) printf 'invalid cleanup pid=%s\n' "$service_pid" >&2; exit 1;; esac
          cleanup_probe_log="$SERVICE_DIR/cleanup-probe-initial.raw.log"
          cleanup_probe_status=0
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$cleanup_probe_log" 2>&1 || cleanup_probe_status=$?
          emit_private_evidence cleanup-probe "$cleanup_probe_log"
          if [ "$cleanup_probe_status" -eq 0 ]; then
            taskkill_log="$SERVICE_DIR/taskkill.raw.log"
            taskkill_status=0
            taskkill.exe /PID "$service_pid" /T /F > "$taskkill_log" 2>&1 || taskkill_status=$?
            emit_private_evidence taskkill "$taskkill_log"
            if [ "$taskkill_status" -ne 0 ]; then
              printf 'service_cleanup=failed code=TASKKILL status=%s\n' "$taskkill_status" >&2
              exit "$taskkill_status"
            fi
            stopped=false
            for attempt in $(seq 1 30); do
              printf 'service_cleanup_attempt=%s\n' "$attempt"
              cleanup_probe_log="$SERVICE_DIR/cleanup-probe-${attempt}.raw.log"
              cleanup_probe_status=0
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid" > "$cleanup_probe_log" 2>&1 || cleanup_probe_status=$?
              emit_private_evidence cleanup-probe "$cleanup_probe_log"
              if [ "$cleanup_probe_status" -ne 0 ]; then stopped=true; break; fi
              sleep 1
            done
            test "$stopped" = true
          else
            printf 'candidate service was not running at cleanup\n'
          fi

      - name: Upload safe Windows functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque Windows completion marker
        if: always()
        shell: bash
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/completion"
          printf 'schema=1\nrun_id=%s\nplatform=windows\nfunctional_outcome=%s\n' "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$HANDOFF_DIR/completion/completion.marker"

      - name: Upload opaque Windows completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-windows
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"

  controller:
    name: Dispatch isolated Windows Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: windows
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
         set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
         [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'controller_inputs=validated platform=%s\n' "$PLATFORM"

      - name: Derive one origin and Windows lease correlation
        run: |
          set -euo pipefail
          lease_run_id="$(printf '%s:%s:%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\nREQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$lease_run_id" "$lease_run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for Windows client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 360); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if any(item.get("name") == sys.argv[3] and item.get("expired") is not True and (item.get("workflow_run") or {}).get("id") == int(sys.argv[2]) for item in value.get("artifacts", [])): raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=true; break; fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Windows Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" -f "inputs[mode]=acquire" -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
            -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
            -f "inputs[origin_workflow_path]=.github/workflows/functional-windows.yml" -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
            -f "inputs[platform]=${PLATFORM}" -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
