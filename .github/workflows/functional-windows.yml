            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; Write-Output "windows_launch_phase=environment"; $env:ProgramData=$env:DOBBYVPN_WINDOWS_PROGRAMDATA; if ([string]::IsNullOrWhiteSpace($env:USERNAME)) { throw "USERNAME is unavailable" }; $account=$env:USERNAME; if (-not [string]::IsNullOrWhiteSpace($env:USERDOMAIN)) { $account="$($env:USERDOMAIN)\$($env:USERNAME)" }; $env:DOBBYVPN_CONTROL_TOKEN_USER=$account; Write-Output "windows_launch_phase=account_ready"; foreach ($path in @($env:DOBBYVPN_WINDOWS_SERVICE_LOG,$env:DOBBYVPN_WINDOWS_SERVICE_ERR,$env:DOBBYVPN_WINDOWS_SERVICE_PID_FILE,$env:DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE)) { $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop; if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or -not ($item.PSIsContainer -eq $false)) { throw "launch path is not a regular file" } }; $p=Start-Process -FilePath $env:DOBBYVPN_WINDOWS_SERVICE_BINARY -ArgumentList @("-port","50051") -RedirectStandardOutput $env:DOBBYVPN_WINDOWS_SERVICE_LOG -RedirectStandardError $env:DOBBYVPN_WINDOWS_SERVICE_ERR -PassThru; $info=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $p.Id) -ErrorAction Stop; if ($null -eq $info -or $null -eq $info.CreationDate) { throw "started process identity unavailable" }; $ticks=$info.CreationDate.ToUniversalTime().Ticks; [System.IO.File]::WriteAllText($env:DOBBYVPN_WINDOWS_SERVICE_PID_FILE, [string]$p.Id, [System.Text.Encoding]::ASCII); [System.IO.File]::WriteAllText($env:DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE, ([string]$p.Id + "|" + [string]$ticks), [System.Text.Encoding]::ASCII); Write-Output "windows_launch_phase=process_started"; Write-Output "windows_launch_phase=pid_recorded"; Write-Output ("windows_launch_identity=" + $p.Id + "|" + $ticks)' \
            > "$launch_log" 2>&1 || launch_status=$?
          printf 'service_launch_result status=%s\n' "$launch_status"
          emit_private_evidence service-launch "$launch_log"
          service_pid=""
          if [ -f "$service_pid_file" ]; then
            service_pid="$(tr -d '\r\n' < "$service_pid_file")"
          fi
          service_identity=""
          if [ -f "$service_identity_file" ]; then
            service_identity="$(tr -d '\r\n' < "$service_identity_file")"
          fi
          if ! [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]] || [ "${service_identity%%|*}" != "$service_pid" ]; then
            discovery_log="$SERVICE_DIR/candidate-discovery.raw.log"
            : > "$discovery_log"
            chmod 600 "$discovery_log"
            discovery_status=1
            for discovery_attempt in $(seq 1 3); do
              printf 'candidate_discovery_attempt=%s\n' "$discovery_attempt" >> "$discovery_log"
              discovery_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 60 - 1))
              if [ "$discovery_remaining" -le 0 ]; then
                printf 'candidate discovery reached cleanup reserve: remaining=%s\n' "$discovery_remaining" >> "$discovery_log"
                break
              fi
              discovery_timeout=5
              if [ "$discovery_timeout" -gt "$discovery_remaining" ]; then discovery_timeout="$discovery_remaining"; fi
              timeout --foreground --signal=TERM --kill-after=1s "${discovery_timeout}s" \
                powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $expected=[System.IO.Path]::GetFullPath($args[0]); $identityPath=$args[1]; $launchEpoch=[DateTimeOffset]::FromUnixTimeSeconds([int64]$args[2]).UtcDateTime.AddSeconds(-2); $matches=@(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { if ([string]::IsNullOrWhiteSpace($_.ExecutablePath) -or $null -eq $_.CreationDate) { return $false }; $actual=[System.IO.Path]::GetFullPath([string]$_.ExecutablePath); $actual -ieq $expected -and $_.CreationDate.ToUniversalTime() -ge $launchEpoch }); if ($matches.Count -eq 0) { Write-Output "candidate_discovery=none"; exit 1 }; if ($matches.Count -ne 1) { Write-Output ("candidate_discovery=ambiguous count=" + $matches.Count); exit 2 }; $p=$matches[0]; $ticks=$p.CreationDate.ToUniversalTime().Ticks; [System.IO.File]::WriteAllText($identityPath, ([string]$p.ProcessId + "|" + [string]$ticks), [System.Text.Encoding]::ASCII); Write-Output ("candidate_discovery=selected " + $p.ProcessId + "|" + $ticks)' \
                "$service_binary_windows" "$service_identity_file_windows" "$launch_started_epoch" >> "$discovery_log" 2>&1 || discovery_status=$?
              service_identity=""
              if [ -f "$service_identity_file" ]; then service_identity="$(tr -d '\r\n' < "$service_identity_file")"; fi
              if [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]]; then
