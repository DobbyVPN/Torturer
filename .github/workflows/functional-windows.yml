name: Trusted functional Windows

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-windows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Windows candidate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" != "0000000000000000000000000000000000000000"
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Prove Windows runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Verify checkout and build Windows candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf "%s\n" "$status"
          test -z "$status"
          python .github/scripts/desktop_build.py libs --platform windows --arch amd64
          python .github/scripts/desktop_build.py app --platform windows --skip-libs
          sha256sum kmp_module/services/windows_grpcvpnserver.exe kmp_module/services/dobby-cli.exe \
            kmp_module/services/wintun.dll kmp_module/services/dobby_bridge.dll

      - name: Stage exact allow-listed Windows candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python torturer/torturer_checks/hosted/candidate.py stage \
            --root "$GITHUB_WORKSPACE/candidate" \
            --output "$RUNNER_TEMP/candidate-windows" \
            --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated Windows candidate runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-windows
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Windows
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: windows
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      SERVER_SINK_IMAGE_DIGEST: ${{ vars.RENDER_SINK_IMAGE_DIGEST }}
      SERVICE_CONTROL_ADDRESS: 127.0.0.1:50051

    steps:
      - name: Establish runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="$RUNNER_TEMP/dobbyvpn-private"
          handoff="$private_root/render-handoff"
          service="$private_root/service"
          test ! -e "$private_root" && test ! -L "$private_root"
          mkdir "$private_root"
          mkdir "$handoff" "$service"
          chmod 700 "$private_root" "$handoff" "$service"
          # Git Bash mode bits are not an ACL boundary on Windows.  Remove
          # inherited access and grant the current runner SID only; resolve
          # the SID directly so no account-name lookup can block the step.
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $sid=[System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value; $verifiedCount=0; foreach ($path in $args) { $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop; if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw "private path is a reparse point" }; $acl=Get-Acl -LiteralPath $path; $acl.SetAccessRuleProtection($true,$false); $rule=New-Object System.Security.AccessControl.FileSystemAccessRule($sid,"FullControl","ContainerInherit,ObjectInherit","None","Allow"); $acl.SetAccessRule($rule); Set-Acl -LiteralPath $path -AclObject $acl; $verified=Get-Acl -LiteralPath $path; if (-not ($verified.Access | Where-Object { $_.IdentityReference.Value -eq $sid -and $_.AccessControlType -eq "Allow" -and (($_.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::FullControl) -eq [System.Security.AccessControl.FileSystemRights]::FullControl) })) { throw "private ACL verification failed" }; $verifiedCount++ }; Write-Output ("private_acl_verified_count=" + $verifiedCount)' \
            "$(cygpath -w "$private_root" | tr -d '\r')" \
            "$(cygpath -w "$handoff" | tr -d '\r')" \
            "$(cygpath -w "$service" | tr -d '\r')"
          printf 'HANDOFF_DIR=%s\nSERVICE_DIR=%s\nRESULT_PATH=%s\nLEASE_RUN_ID=unassigned\n' \
            "$handoff" "$service" "$handoff/functional-result.json" >> "$GITHUB_ENV"
          printf 'POST_LANE_DEADLINE_EPOCH=unvalidated\nPOST_LANE_STEP_TIMEOUT_SECONDS=60\nPOST_LANE_MARKER_RESERVE_SECONDS=180\n' >> "$GITHUB_ENV"

      - name: Prove Windows client runner architecture and elevation
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          # The single-quoted command is interpreted by PowerShell, not Bash.
          # shellcheck disable=SC2016
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$os=Get-CimInstance Win32_OperatingSystem; $admin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); Write-Output ("windows_version=" + $os.Version); Write-Output ("processor_architecture=" + $env:PROCESSOR_ARCHITECTURE); Write-Output ("is_administrator=" + $admin); if (-not $admin -or $env:PROCESSOR_ARCHITECTURE -ne "AMD64") { exit 1 }'

      - name: Validate trusted functional inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${SERVER_IMAGE_DIGEST#sha256:}"
          test -n "${image_digest//0/}"
          [[ "$SERVER_SINK_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sink_image_digest="${SERVER_SINK_IMAGE_DIGEST#sha256:}"
          test -n "${sink_image_digest//0/}"
          printf 'source_repository=%s\nsource_sha=%s\nplatform=%s\ntorturer_sha=%s\nserver_image_digest=%s\nserver_sink_image_digest=%s\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$PLATFORM" "$TORTURER_SHA" "$SERVER_IMAGE_DIGEST" "$SERVER_SINK_IMAGE_DIGEST"

      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Establish hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          if not isinstance(value.get("run_started_at"), str):
              raise SystemExit("workflow run start timestamp is missing")
          started = datetime.datetime.fromisoformat(value["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          if int(datetime.datetime.now(datetime.timezone.utc).timestamp()) >= deadline:
              raise SystemExit("workflow already exceeded its hard thirty-minute deadline")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"workflow_started_epoch={int(started.timestamp())}\nrun_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Download and verify exact Windows candidate closure
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-windows-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer checkout and candidate closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          python torturer/torturer_checks/hosted/candidate.py verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform windows --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Create ephemeral recipient and opaque Render lease request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Git Bash otherwise rewrites the OpenSSL /CN subject as a Windows path.
          export MSYS_NO_PATHCONV=1
          export MSYS2_ARG_CONV_EXCL='*'
          timeout --foreground --signal=KILL 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/recipient.crt"
          lease_run_id="$(python -c 'import hashlib,os; print(hashlib.sha256(":".join(os.environ[name] for name in ("GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","PLATFORM","TORTURER_SHA","SOURCE_SHA")).encode()).hexdigest()[:32])')"
          request_name="render-request-${lease_run_id}-${PLATFORM}"
          python - "$HANDOFF_DIR/request.json" "$lease_run_id" "$request_name" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          path, run_id, name = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id) or name != f"render-request-{run_id}-windows":
              raise SystemExit("lease request identity is invalid")
          path.write_text(json.dumps({"schema": 1, "kind": "dobbyvpn.render-lease-request", "run_id": run_id, "platform": "windows", "source_sha": os.environ["SOURCE_SHA"], "image_digest": os.environ["SERVER_IMAGE_DIGEST"]}, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\nREQUEST_ARTIFACT_NAME={name}\n")
          print(f"lease_run_id={run_id}\nrequest_artifact_name={name}")
          PY

      - name: Start exact Windows preflight candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          emit_private_display() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              # Candidate-controlled text cannot be made public-safe with a
              # best-effort regex.  Keep every byte in the runner-private
              # source file; the adjacent evidence and classification records
              # expose only its size, digest, and a fixed reason code.
              printf 'diagnostic_display label=%s state=retained-runner-private\n' "$label"
            else
              printf 'diagnostic_display label=%s state=missing\n' "$label"
            fi
          }
          # These single-quoted commands are interpreted by PowerShell, not Bash.
          # The preflight process is stopped and verified before any token-bearing Render step.
          # Keep this whole startup lane bounded independently of the job timeout.
          # A bounded attempt count is not sufficient: every PowerShell child and
          # the CLI status probe must have its own timeout, otherwise one hung
          # child can consume the entire workflow and skip useful diagnostics.
          PREFLIGHT_MAX_SECONDS=300
          PREFLIGHT_CLEANUP_RESERVE_SECONDS=180
          PREFLIGHT_PROBE_TIMEOUT_SECONDS=10
          preflight_started_epoch="$(date +%s)"
          preflight_deadline_epoch=$((preflight_started_epoch + PREFLIGHT_MAX_SECONDS))
          cleanup_reserve_deadline=$((RUN_DEADLINE_EPOCH - PREFLIGHT_CLEANUP_RESERVE_SECONDS))
          if [ "$preflight_deadline_epoch" -gt "$cleanup_reserve_deadline" ]; then
            preflight_deadline_epoch="$cleanup_reserve_deadline"
          fi
          if [ "$preflight_deadline_epoch" -le "$preflight_started_epoch" ]; then
            printf 'preflight startup has no bounded budget before cleanup reserve\n' >&2
            exit 1
          fi
          printf 'preflight_budget_seconds=%s cleanup_reserve_seconds=%s deadline_epoch=%s\n' \
            "$((preflight_deadline_epoch - preflight_started_epoch))" \
            "$PREFLIGHT_CLEANUP_RESERVE_SECONDS" "$preflight_deadline_epoch"

          run_preflight_probe() {
            label="$1"
            output="$2"
            shift 2
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 0 ]; then
              printf 'preflight_probe label=%s status=DEADLINE_EXCEEDED\n' "$label" >&2
              return 124
            fi
            timeout_seconds="$PREFLIGHT_PROBE_TIMEOUT_SECONDS"
            if [ "$timeout_seconds" -gt "$remaining" ]; then timeout_seconds="$remaining"; fi
            printf 'preflight_probe_start label=%s timeout_seconds=%s remaining_seconds=%s\n' \
              "$label" "$timeout_seconds" "$remaining"
            status=0
            if timeout --foreground --signal=TERM --kill-after=1s "${timeout_seconds}s" \
              "$@" > "$output" 2>&1; then
              status=0
            else
              status=$?
            fi
            printf 'preflight_probe_result label=%s status=%s\n' "$label" "$status"
            return "$status"
          }

          # shellcheck disable=SC2016
          programdata_path="$SERVICE_DIR/ProgramData"
          mkdir -p "$programdata_path/DobbyVPN"
          service_log="$SERVICE_DIR/preflight-service.raw.log"
          service_err="$SERVICE_DIR/preflight-service.stderr.raw.log"
          launch_log="$SERVICE_DIR/preflight-launch.raw.log"
          probe_log=""
          network_probe_log=""
          status_log="$SERVICE_DIR/preflight-control-status.raw.log"
          preflight_pid_file="$HANDOFF_DIR/preflight-service.pid"
          preflight_identity_file="$HANDOFF_DIR/preflight-service.identity"
          service_binary="$GITHUB_WORKSPACE/candidate/windows_grpcvpnserver.exe"
          service_binary_windows="$(cygpath -w "$service_binary" | tr -d '\r')"
          service_log_windows="$(cygpath -w "$service_log" | tr -d '\r')"
          service_err_windows="$(cygpath -w "$service_err" | tr -d '\r')"
          programdata_windows="$(cygpath -w "$programdata_path" | tr -d '\r')"
          preflight_pid_file_windows="$(cygpath -w "$preflight_pid_file" | tr -d '\r')"
          preflight_identity_file_windows="$(cygpath -w "$preflight_identity_file" | tr -d '\r')"
          : > "$service_log"
          : > "$service_err"
          : > "$launch_log"
          : > "$preflight_pid_file"
          : > "$preflight_identity_file"
          chmod 600 "$service_log" "$service_err" "$launch_log" "$preflight_pid_file" "$preflight_identity_file"
          export DOBBYVPN_WINDOWS_SERVICE_BINARY="$service_binary_windows"
          export DOBBYVPN_WINDOWS_SERVICE_LOG="$service_log_windows"
          export DOBBYVPN_WINDOWS_SERVICE_ERR="$service_err_windows"
          export DOBBYVPN_WINDOWS_PROGRAMDATA="$programdata_windows"
          export DOBBYVPN_WINDOWS_SERVICE_PID_FILE="$preflight_pid_file_windows"
          export DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE="$preflight_identity_file_windows"
          # Publish the cleanup path before launch.  The PowerShell launcher
          # records PID and creation identity without CRLF before returning.
          # Publish all cleanup paths before launch so a failed launch still
          # has an exact-candidate discovery/cleanup route.
          printf 'PREFLIGHT_SERVICE_PID_FILE=%s\nPREFLIGHT_SERVICE_IDENTITY_FILE=%s\nPREFLIGHT_SERVICE_BINARY=%s\nPREFLIGHT_SERVICE_LOG=%s\n' \
            "$preflight_pid_file" "$preflight_identity_file" "$service_binary" "$service_log" >> "$GITHUB_ENV"
          # Do not resolve WindowsIdentity.Name here.  On a hosted runner that
          # account-name lookup can block before Start-Process returns.  USERDOMAIN and
          # USERNAME are already supplied by the runner and are the account
          # identity consumed by the product's LookupSID call.  PowerShell
          # launches the service directly and writes launch diagnostics to a
          # regular file; Bash consumes only the exit status and handoff files,
          # never a native child's stdout pipe.  The GNU timeout is an outer
          # watchdog with a small grace interval beyond the expected launch.
          launch_remaining=$((preflight_deadline_epoch - $(date +%s)))
          if [ "$launch_remaining" -le 0 ]; then
            printf 'preflight launch reached its bounded deadline\n' >&2
            exit 1
          fi
          launch_timeout="$PREFLIGHT_PROBE_TIMEOUT_SECONDS"
          if [ "$launch_remaining" -le 3 ]; then
            printf 'preflight launch cannot preserve watchdog grace before deadline: remaining=%s\n' "$launch_remaining" >&2
            exit 1
          fi
          if [ "$launch_timeout" -gt "$((launch_remaining - 3))" ]; then launch_timeout="$((launch_remaining - 3))"; fi
          printf 'preflight_probe_start label=service-launch timeout_seconds=%s remaining_seconds=%s\n' \
            "$launch_timeout" "$launch_remaining"
          launch_status=0
          launch_watchdog_timeout=$((launch_timeout + 3))
          launch_started_epoch="$(date +%s)"
          printf 'PREFLIGHT_SERVICE_LAUNCH_STARTED_EPOCH=%s\n' "$launch_started_epoch" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=1s "${launch_watchdog_timeout}s" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; Write-Output "windows_launch_phase=environment"; $env:ProgramData=$env:DOBBYVPN_WINDOWS_PROGRAMDATA; if ([string]::IsNullOrWhiteSpace($env:USERNAME)) { throw "USERNAME is unavailable" }; $account=$env:USERNAME; if (-not [string]::IsNullOrWhiteSpace($env:USERDOMAIN)) { $account="$($env:USERDOMAIN)\$($env:USERNAME)" }; $env:DOBBYVPN_CONTROL_TOKEN_USER=$account; Write-Output "windows_launch_phase=account_ready"; foreach ($path in @($env:DOBBYVPN_WINDOWS_SERVICE_LOG,$env:DOBBYVPN_WINDOWS_SERVICE_ERR,$env:DOBBYVPN_WINDOWS_SERVICE_PID_FILE,$env:DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE)) { $item=Get-Item -LiteralPath $path -Force -ErrorAction Stop; if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or -not ($item.PSIsContainer -eq $false)) { throw "launch path is not a regular file" } }; $p=Start-Process -FilePath $env:DOBBYVPN_WINDOWS_SERVICE_BINARY -ArgumentList @("-port","50051") -RedirectStandardOutput $env:DOBBYVPN_WINDOWS_SERVICE_LOG -RedirectStandardError $env:DOBBYVPN_WINDOWS_SERVICE_ERR -PassThru; $info=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $p.Id) -ErrorAction Stop; if ($null -eq $info -or $null -eq $info.CreationDate) { throw "started process identity unavailable" }; $ticks=$info.CreationDate.ToUniversalTime().Ticks; [System.IO.File]::WriteAllText($env:DOBBYVPN_WINDOWS_SERVICE_PID_FILE, [string]$p.Id, [System.Text.Encoding]::ASCII); [System.IO.File]::WriteAllText($env:DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE, ([string]$p.Id + "|" + [string]$ticks), [System.Text.Encoding]::ASCII); Write-Output "windows_launch_phase=process_started"; Write-Output "windows_launch_phase=pid_recorded"; Write-Output ("windows_launch_identity=" + $p.Id + "|" + $ticks)' \
            > "$launch_log" 2>&1 || launch_status=$?
          printf 'preflight_probe_result label=service-launch status=%s\n' "$launch_status"
          emit_private_evidence preflight-launch "$launch_log"
          service_pid=""
          if [ -f "$preflight_pid_file" ]; then
            service_pid="$(tr -d '\r\n' < "$preflight_pid_file")"
          fi
          service_identity=""
          if [ -f "$preflight_identity_file" ]; then
            service_identity="$(tr -d '\r\n' < "$preflight_identity_file")"
          fi
          if ! [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]] || [ "${service_identity%%|*}" != "$service_pid" ]; then
            discovery_log="$SERVICE_DIR/preflight-candidate-discovery.raw.log"
            : > "$discovery_log"
            chmod 600 "$discovery_log"
            discovery_status=1
            for discovery_attempt in $(seq 1 3); do
              printf 'preflight_candidate_discovery_attempt=%s\n' "$discovery_attempt" >> "$discovery_log"
              discovery_remaining=$((preflight_deadline_epoch - $(date +%s) - 1))
              if [ "$discovery_remaining" -le 0 ]; then
                printf 'preflight candidate discovery reached bounded deadline: remaining=%s\n' "$discovery_remaining" >> "$discovery_log"
                break
              fi
              discovery_timeout=5
              if [ "$discovery_timeout" -gt "$discovery_remaining" ]; then discovery_timeout="$discovery_remaining"; fi
              timeout --foreground --signal=TERM --kill-after=1s "${discovery_timeout}s" \
                powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $expected=[System.IO.Path]::GetFullPath($args[0]); $identityPath=$args[1]; $launchEpoch=[DateTimeOffset]::FromUnixTimeSeconds([int64]$args[2]).UtcDateTime.AddSeconds(-2); $matches=@(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { if ([string]::IsNullOrWhiteSpace($_.ExecutablePath) -or $null -eq $_.CreationDate) { return $false }; $actual=[System.IO.Path]::GetFullPath([string]$_.ExecutablePath); $actual -ieq $expected -and $_.CreationDate.ToUniversalTime() -ge $launchEpoch }); if ($matches.Count -eq 0) { Write-Output "candidate_discovery=none"; exit 1 }; if ($matches.Count -ne 1) { Write-Output ("candidate_discovery=ambiguous count=" + $matches.Count); exit 2 }; $p=$matches[0]; $ticks=$p.CreationDate.ToUniversalTime().Ticks; [System.IO.File]::WriteAllText($identityPath, ([string]$p.ProcessId + "|" + [string]$ticks), [System.Text.Encoding]::ASCII); Write-Output ("candidate_discovery=selected " + $p.ProcessId + "|" + $ticks)' \
                "$service_binary_windows" "$preflight_identity_file_windows" "$launch_started_epoch" >> "$discovery_log" 2>&1 || discovery_status=$?
              service_identity=""
              if [ -f "$preflight_identity_file" ]; then service_identity="$(tr -d '\r\n' < "$preflight_identity_file")"; fi
              if [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]]; then
                service_pid="${service_identity%%|*}"
                discovery_status=0
                break
              fi
              sleep 1
            done
            emit_private_evidence preflight-candidate-discovery "$discovery_log"
          fi
          if [ "$launch_status" -ne 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-service-identity "$preflight_identity_file"
            emit_private_display preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-launch "$launch_log"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            if [ "$launch_status" -eq 124 ]; then
              printf 'preflight_service_launch=failed code=LAUNCH_TIMEOUT status=%s\n' "$launch_status" >&2
            else
              printf 'preflight_service_launch=failed code=LAUNCH status=%s\n' "$launch_status" >&2
            fi
            exit 1
          fi
          if ! [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]] || [ "${service_identity%%|*}" != "$service_pid" ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-service-identity "$preflight_identity_file"
            printf 'preflight_service_launch=failed code=IDENTITY_UNAVAILABLE\n' >&2
            exit 1
          fi
          printf '%s\n' "$service_pid" > "$preflight_pid_file"
          unset DOBBYVPN_WINDOWS_SERVICE_BINARY DOBBYVPN_WINDOWS_SERVICE_LOG DOBBYVPN_WINDOWS_SERVICE_ERR DOBBYVPN_WINDOWS_PROGRAMDATA DOBBYVPN_WINDOWS_SERVICE_PID_FILE DOBBYVPN_WINDOWS_SERVICE_IDENTITY_FILE
          export PROGRAMDATA="$programdata_path"
          printf 'PROGRAMDATA=%s\n' "$PROGRAMDATA" >> "$GITHUB_ENV"
          case "$service_pid" in ""|*[!0-9]*) printf 'invalid preflight service pid=%s\n' "$service_pid" >&2; exit 1;; esac
          printf '%s\n' "$service_pid" > "$preflight_pid_file"
          printf 'PREFLIGHT_SERVICE_PID=%s\n' "$service_pid" >> "$GITHUB_ENV"
          ready=false
          readiness_remaining=$((preflight_deadline_epoch - $(date +%s)))
          if [ "$readiness_remaining" -le 0 ]; then
            printf 'preflight readiness reached bounded startup deadline: remaining=%s\n' "$readiness_remaining" >&2
            exit 1
          fi
          readiness_timeout=60
          if [ "$readiness_timeout" -gt "$readiness_remaining" ]; then readiness_timeout="$readiness_remaining"; fi
          for attempt in $(seq 1 "$readiness_timeout"); do
            printf 'preflight_service_readiness_attempt=%s\n' "$attempt"
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 0 ]; then
              printf 'preflight readiness reached bounded startup deadline: remaining=%s\n' "$remaining" >&2
              break
            fi
            # shellcheck disable=SC2016
            probe_log="$SERVICE_DIR/preflight-service-probe-${attempt}.raw.log"
            probe_status=0
            if run_preflight_probe "service-process-${attempt}" "$probe_log" \
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'try { $p=Get-Process -Id ([int]$args[0]) -ErrorAction Stop; Write-Output ("preflight_service_probe_pid=" + $p.Id); exit 0 } catch { Write-Error $_; exit 1 }' "$service_pid"; then
              probe_status=0
            else
              probe_status=$?
            fi
            emit_private_evidence "preflight-service-probe-${attempt}" "$probe_log"
            if [ "$probe_status" -ne 0 ]; then
              emit_private_evidence preflight-service-log "$service_log"
              emit_private_evidence preflight-service-error "$service_err"
              emit_private_evidence preflight-launch "$launch_log"
              emit_private_display "preflight-service-probe-${attempt}" "$probe_log"
              emit_private_display preflight-service-error "$service_err"
              emit_private_classification "preflight-service-probe-${attempt}" "$probe_log"
              emit_private_classification preflight-service-log "$service_log"
              emit_private_classification preflight-service-error "$service_err"
              if [ "$probe_status" -eq 124 ]; then
                printf 'preflight_service_readiness=failed code=SERVICE_PROBE_TIMEOUT status=%s\n' "$probe_status" >&2
              else
                printf 'preflight_service_readiness=failed code=SERVICE_EXITED status=%s\n' "$probe_status" >&2
              fi
              exit 1
            fi
            network_probe_log="$SERVICE_DIR/preflight-network-probe-${attempt}.raw.log"
            network_probe_status=0
            if run_preflight_probe "control-port-${attempt}" "$network_probe_log" \
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$c=Test-NetConnection -ComputerName 127.0.0.1 -Port 50051; Write-Output $c; if ($c.TcpTestSucceeded) { exit 0 }; exit 1'; then
              network_probe_status=0
            else
              network_probe_status=$?
            fi
            emit_private_evidence "preflight-network-probe-${attempt}" "$network_probe_log"
            if [ "$network_probe_status" -eq 124 ]; then
              emit_private_evidence preflight-service-log "$service_log"
              emit_private_evidence preflight-service-error "$service_err"
              emit_private_evidence preflight-launch "$launch_log"
              emit_private_display "preflight-network-probe-${attempt}" "$network_probe_log"
              emit_private_display preflight-service-error "$service_err"
              emit_private_classification "preflight-network-probe-${attempt}" "$network_probe_log"
              emit_private_classification preflight-service-log "$service_log"
              emit_private_classification preflight-service-error "$service_err"
              printf 'preflight_service_readiness=failed code=CONTROL_PORT_PROBE_TIMEOUT status=%s\n' "$network_probe_status" >&2
              exit 1
            fi
            if [ "$network_probe_status" -eq 0 ]; then ready=true; break; fi
            remaining=$((preflight_deadline_epoch - $(date +%s)))
            if [ "$remaining" -le 1 ]; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence preflight-service-timeout "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_evidence preflight-service-probe-last "$probe_log"
            emit_private_evidence preflight-network-probe-last "$network_probe_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_display preflight-service-probe-last "$probe_log"
            emit_private_display preflight-network-probe-last "$network_probe_log"
            emit_private_classification preflight-service-timeout "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_service_readiness=failed code=CONTROL_PORT_TIMEOUT budget_seconds=%s\n' \
              "$((preflight_deadline_epoch - preflight_started_epoch))" >&2
            exit 1
          fi
          control_token="$PROGRAMDATA/DobbyVPN/control.token"
          if [ ! -s "$control_token" ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=MISSING\n' >&2
            exit 1
          fi
          token_value=""
          token_read_status=0
          token_remaining=$((preflight_deadline_epoch - $(date +%s)))
          if [ "$token_remaining" -le 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=DEADLINE_EXCEEDED\n' >&2
            exit 1
          fi
          token_timeout=5
          if [ "$token_timeout" -gt "$token_remaining" ]; then token_timeout="$token_remaining"; fi
          printf 'preflight_probe_start label=control-token-read timeout_seconds=%s remaining_seconds=%s\n' \
            "$token_timeout" "$token_remaining"
          token_value="$(timeout --foreground --signal=TERM --kill-after=1s "${token_timeout}s" tr -d '\r\n' < "$control_token")" || token_read_status=$?
          printf 'preflight_probe_result label=control-token-read status=%s\n' "$token_read_status"
          if [ "$token_read_status" -ne 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=READ_TIMEOUT status=%s\n' "$token_read_status" >&2
            exit 1
          fi
          if [[ ! "$token_value" =~ ^[0-9a-fA-F]{64}$ ]]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            printf 'preflight_control_token=failed code=INVALID\n' >&2
            exit 1
          fi
          printf 'preflight_control_token_ready=1\n'
          status_code=0
          if run_preflight_probe control-status "$status_log" \
            "$GITHUB_WORKSPACE/candidate/dobby-cli.exe" status; then
            status_code=0
          else
            status_code=$?
          fi
          emit_private_evidence preflight-control-status "$status_log"
          if [ "$status_code" -ne 0 ]; then
            emit_private_evidence preflight-service-log "$service_log"
            emit_private_evidence preflight-service-error "$service_err"
            emit_private_evidence preflight-launch "$launch_log"
            emit_private_display preflight-control-status "$status_log"
            emit_private_display preflight-service-error "$service_err"
            emit_private_classification preflight-control-status "$status_log"
            emit_private_classification preflight-service-log "$service_log"
            emit_private_classification preflight-service-error "$service_err"
            if [ "$status_code" -eq 124 ]; then
              printf 'preflight_control_status=failed code=CLI_STATUS_TIMEOUT status=%s\n' "$status_code" >&2
            else
              printf 'preflight_control_status=failed code=CLI_STATUS status=%s\n' "$status_code" >&2
            fi
            exit "$status_code"
          fi
          printf 'preflight_service_ready=true\n'

      - name: Stop Windows preflight candidate before Render handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          emit_private_classification() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              classification="$(python - "$file" <<'PY'
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          lower = data.lower()
          rules = (
              (b"set explicit runtime path acl", "CONTROL_TOKEN_ACL_SET_FAILED"),
              (b"resolve installed-user sid", "CONTROL_TOKEN_USER_SID_FAILED"),
              (b"resolve current windows user", "CONTROL_TOKEN_USER_FAILED"),
              (b"invalid desktop control token", "CONTROL_TOKEN_INVALID"),
              (b"programdata is required", "CONTROL_TOKEN_PROGRAMDATA_MISSING"),
              (b"the requested operation requires elevation", "ELEVATION_REQUIRED"),
              (b"failed to initialize secure local logging", "LOG_INIT_FAILED"),
              (b"failed to prepare control authentication", "CONTROL_AUTH_INIT_FAILED"),
              (b"failed to listen", "LISTEN_FAILED"),
              (b"access is denied", "ACCESS_DENIED"),
              (b"not a valid win32 application", "WIN32_INVALID_IMAGE"),
              (b"panic", "PANIC"),
          )
          for needle, code in rules:
              if needle in lower:
                  print(code)
                  break
          else:
              print("OTHER_ERROR" if lower.strip() else "EMPTY")
          PY
              )"
              printf 'diagnostic_classification label=%s code=%s\n' "$label" "$classification"
            else
              printf 'diagnostic_classification label=%s code=MISSING\n' "$label"
            fi
          }
          # The trusted controller owns exact identity and tree finalization.
          # This workflow only supplies its launch contract; it never walks or
          # recursively signals a PID-derived process tree in YAML.
          service_identity_file="${PREFLIGHT_SERVICE_IDENTITY_FILE:-$HANDOFF_DIR/preflight-service.identity}"
          service_binary="${PREFLIGHT_SERVICE_BINARY:-}"
          controller_raw="$SERVICE_DIR/preflight-controller-raw"
          controller_log="$SERVICE_DIR/preflight-controller-finalizer.raw.log"
          fallback_log="$SERVICE_DIR/preflight-controller-fallback.raw.log"
          mkdir -p "$controller_raw"
          chmod 700 "$controller_raw"
          service_identity=""
          if [ -f "$service_identity_file" ]; then service_identity="$(tr -d '\r\n' < "$service_identity_file")"; fi
          if ! [[ "$service_identity" =~ ^[1-9][0-9]{0,9}\|[1-9][0-9]+$ ]] || [ -z "$service_binary" ]; then
            emit_private_evidence preflight-service-identity "$service_identity_file"
            printf 'preflight_service_cleanup=failed code=IDENTITY_UNAVAILABLE\n' >&2
            exit 1
          fi
          service_pid="${service_identity%%|*}"
          service_binary_windows="$(cygpath -w "$service_binary" | tr -d '\r')"
          service_identity_file_windows="$(cygpath -w "$service_identity_file" | tr -d '\r')"
          cleanup_deadline_epoch=$((RUN_DEADLINE_EPOCH - 60))
          cleanup_remaining=$((cleanup_deadline_epoch - $(date +%s)))
          controller_timeout=40
          if [ "$controller_timeout" -gt "$cleanup_remaining" ]; then controller_timeout="$cleanup_remaining"; fi
          if [ "$controller_timeout" -le 0 ]; then
            printf 'preflight service cleanup has no bounded budget before workflow deadline\n' >&2
            exit 1
          fi
          controller_status=0
          timeout --foreground --signal=TERM --kill-after=1s "${controller_timeout}s" \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python -m torturer_checks.hosted.finalize_windows_service \
              --service-identity-file "$service_identity_file" \
              --service-binary "$service_binary" \
              --raw-log-dir "$controller_raw" \
              --timeout-seconds "$controller_timeout" > "$controller_log" 2>&1 || controller_status=$?
          emit_private_evidence preflight-controller-finalizer "$controller_log"
          while IFS= read -r -d '' evidence_path; do
            emit_private_evidence preflight-controller-command "$evidence_path"
          done < <(find "$controller_raw" -type f -print0)
          if [ "$controller_status" -eq 0 ]; then
            printf 'preflight_service_stop_verified=true method=torturer-controller tree=proven pid=%s\n' "$service_pid"
            rm -f "$SERVICE_DIR/ProgramData/DobbyVPN/control.token"
            printf 'preflight_control_state_removed=true\n'
            exit 0
          fi

          # Fallback is deliberately leader-only.  It proves the sidecar
          # identity adjacent to Stop-Process, records every observation, and
          # exits nonzero because YAML cannot prove descendants without the
          # controller's native tree finalizer.
          fallback_status=0
          fallback_timeout=5
          fallback_remaining=$((cleanup_deadline_epoch - $(date +%s)))
          if [ "$fallback_timeout" -gt "$fallback_remaining" ]; then fallback_timeout="$fallback_remaining"; fi
          if [ "$fallback_timeout" -le 0 ]; then
            printf 'preflight fallback has no bounded budget before workflow deadline\n' >&2
            exit 1
          fi
          timeout --foreground --signal=TERM --kill-after=1s "${fallback_timeout}s" \
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $identity=([System.IO.File]::ReadAllText($args[0])).Trim(); if ($identity -notmatch "^[1-9][0-9]{0,9}\|[1-9][0-9]+$") { Write-Output "fallback_state=identity-invalid"; exit 2 }; $separator=$identity.IndexOf([char]124); $processId=[int]$identity.Substring(0,$separator); $expectedTicks=$identity.Substring($separator+1); $expected=[System.IO.Path]::GetFullPath($args[1]); $p=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $processId) -ErrorAction Stop; if ($null -eq $p) { Write-Output "fallback_state=leader-absent tree-unproven"; exit 3 }; $actual=[System.IO.Path]::GetFullPath([string]$p.ExecutablePath); $ticks=$p.CreationDate.ToUniversalTime().Ticks; if ($actual -ine $expected) { Write-Output ("fallback_state=path-mismatch actual=" + $actual); exit 4 }; if ($expectedTicks -ne [string]$ticks) { Write-Output ("fallback_state=identity-mismatch actual=" + $p.ProcessId + "|" + $ticks); exit 5 }; Write-Output ("fallback_state=identity-checked pid=" + $processId + "|" + $ticks); Stop-Process -Id $processId -Force -ErrorAction Stop; $after=Get-CimInstance Win32_Process -Filter ("ProcessId = {0}" -f $processId) -ErrorAction Stop; if ($null -ne $after) { Write-Output "fallback_state=leader-survived tree-unproven"; exit 6 }; Write-Output "fallback_state=leader-gone tree-unproven"; exit 7' \
            "$service_identity_file_windows" "$service_binary_windows" > "$fallback_log" 2>&1 || fallback_status=$?
          emit_private_evidence preflight-controller-fallback "$fallback_log"
          printf 'preflight_service_cleanup=failed code=CONTROLLER_FINALIZER status=%s fallback_status=%s\n' "$controller_status" "$fallback_status" >&2
          exit 1

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download exact encrypted Render lease response
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [item for item in value.get("artifacts", []) if item.get("name") == sys.argv[2] and item.get("expired") is not True]
          if len(matches) != 1: raise SystemExit(1 if not matches else 2)
          run_id = (matches[0].get("workflow_run") or {}).get("id")
          if not isinstance(run_id, int) or run_id <= 0: raise SystemExit(2)
          print(run_id)
          PY
            )"; then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              timeout --foreground --signal=TERM --kill-after=1s "${api_timeout}s" \
                "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"id": int(sys.argv[2]), "event": "workflow_dispatch", "head_branch": os.environ["GITHUB_REF_NAME"], "head_sha": os.environ["TORTURER_SHA"], "path": ".github/workflows/server-lease.yml", "display_title": sys.argv[3]}
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease workflow {key} mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]: raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              transfer_timeout=30
              if [ "$transfer_timeout" -gt "$api_remaining" ]; then transfer_timeout="$api_remaining"; fi
              if [ "$transfer_timeout" -le 0 ]; then
                printf 'lease response transfer reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" --artifact-name "$response_name" --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" --metadata "$attempt_dir/artifacts.json" --archive "$attempt_dir/response.zip" \
                --timeout-seconds "$transfer_timeout" \
                --expect-file lease.json --expect-file profile.cms --expect-file upload.cms; then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              test "$status" -eq 1
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          test "$found" = true

      - name: Validate and decrypt encrypted profile
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LEASE_RESPONSE_DIR/lease.json" && test -f "$LEASE_RESPONSE_DIR/profile.cms" && test -f "$LEASE_RESPONSE_DIR/upload.cms"
          python - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": 2,
              "kind": "dobbyvpn.render-lease",
              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": "windows",
              "source_sha": os.environ["SOURCE_SHA"],
              "state": "issued",
          }
          expected_keys = set(expected) | {"services", "available_until_epoch"}
          if set(value) != expected_keys:
              raise SystemExit("Windows safe lease record has an unsafe shape")
          for key, wanted in expected.items():
              if value.get(key) != wanted: raise SystemExit(f"lease field {key} is invalid")
          available_until_epoch = value.get("available_until_epoch")
          if (isinstance(available_until_epoch, bool)
                  or not isinstance(available_until_epoch, int)
                  or available_until_epoch <= 0):
              raise SystemExit("lease availability deadline is invalid")
          services = value.get("services")
          if not isinstance(services, list) or len(services) != 2:
              raise SystemExit("Windows lease service bundle is invalid")
          roles = {service.get("role") for service in services if isinstance(service, dict)}
          if roles != {"outline", "upload-sink"}:
              raise SystemExit("Windows lease service roles are invalid")
          service_ids = set()
          services_by_role = {}
          for service in services:
              if not isinstance(service, dict) or set(service) != {"role", "service_id", "image_digest", "provider_generation"}:
                  raise SystemExit("Windows lease service shape is invalid")
              if not isinstance(service["role"], str) or service["role"] in services_by_role:
                  raise SystemExit("Windows lease service roles are duplicated")
              if not isinstance(service["service_id"], str) or not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["service_id"]):
                  raise SystemExit("lease service id is invalid")
              if service["service_id"] in service_ids:
                  raise SystemExit("Windows lease service IDs are not distinct")
              service_ids.add(service["service_id"])
              if not isinstance(service["image_digest"], str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", service["image_digest"]):
                  raise SystemExit("Windows lease image digest is invalid")
              if not isinstance(service["provider_generation"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["provider_generation"]):
                  raise SystemExit("Windows lease provider generation is invalid")
              services_by_role[service["role"]] = service
          if services_by_role["outline"]["image_digest"] != os.environ["SERVER_IMAGE_DIGEST"]:
              raise SystemExit("Windows Outline image identity is not bound")
          if services_by_role["upload-sink"]["image_digest"] != os.environ["SERVER_SINK_IMAGE_DIGEST"]:
              raise SystemExit("Windows upload-sink image identity is not bound")
          if any(token in json.dumps(value).lower() for token in ("url", "path", "password", "secret")):
              raise SystemExit("Windows safe lease record contains private handoff data")
          print("lease_record=validated")
          PY
          cleanup_reserve_seconds=120
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - cleanup_reserve_seconds - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "profile decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - cleanup_reserve_seconds - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "upload URL decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER -in "$LEASE_RESPONSE_DIR/upload.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" -inkey "$HANDOFF_DIR/recipient.key" -out "$HANDOFF_DIR/upload-url.txt"
          chmod 600 "$HANDOFF_DIR/upload-url.txt"
          test -s "$HANDOFF_DIR/upload-url.txt"
          python - "$HANDOFF_DIR/upload-url.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]{1,253}/upload/[0-9a-f]{32}", value):
              raise SystemExit("encrypted upload URL is invalid")
          print("upload_handoff=validated")
          PY

      - name: Establish validated post-lane provider deadline
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          lease_file="${LEASE_RESPONSE_DIR:-}/lease.json"
          if [ -z "${LEASE_RESPONSE_DIR:-}" ] || [ ! -f "$lease_file" ]; then
            printf '%s\n' 'post-lane provider deadline unavailable: no validated lease exists; server hard cleanup remains authoritative' >&2
            exit 1
          fi
          available_until_epoch="$(python - "$lease_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          deadline = value.get("available_until_epoch")
          if isinstance(deadline, bool) or not isinstance(deadline, int) or deadline <= 0:
              raise SystemExit("lease availability deadline is invalid")
          print(deadline)
          PY
          )"
          printf 'POST_LANE_DEADLINE_EPOCH=%s\nPOST_LANE_STEP_TIMEOUT_SECONDS=60\nPOST_LANE_MARKER_RESERVE_SECONDS=180\n' \
