name: Trusted functional Linux

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-linux-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|"") printf '%s\n' 'commit_sha must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Check out exact trusted Torturer helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          git -C candidate status --porcelain=v1 --untracked-files=all
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"

      - name: Build untrusted Linux service and CLI
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_build.py libs --platform linux --arch amd64
          python3 .github/scripts/desktop_build.py app --platform linux --skip-libs
          sha256sum kmp_module/services/ubuntu_grpcvpnserver kmp_module/services/dobby-cli

      - name: Stage an allow-listed candidate runtime closure
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.candidate stage \
            --root "$GITHUB_WORKSPACE/candidate" --output "$RUNNER_TEMP/candidate-linux" \
            --platform linux --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated candidate runtime
        id: candidate_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-linux-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-linux
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: linux
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}

    steps:
      - name: Establish runner-local paths
        run: |
          set -euo pipefail
          {
            printf 'HANDOFF_DIR=%s\n' "$RUNNER_TEMP/dobbyvpn-render-handoff"
            printf 'SERVICE_DIR=%s\n' "$RUNNER_TEMP/dobbyvpn-service"
            printf 'RESULT_PATH=%s\n' "$RUNNER_TEMP/dobbyvpn-render-handoff/functional-result.json"
            printf 'LEASE_RUN_ID=unassigned\n'
          } >> "$GITHUB_ENV"

      - name: Validate trusted functional inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          repository = os.environ["SOURCE_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          image_digest = os.environ["SERVER_IMAGE_DIGEST"]
          if repository != "DobbyVPN/DobbyVPN":
              raise SystemExit("source_repository must be DobbyVPN/DobbyVPN")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("commit_sha must be a full lowercase SHA")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest):
              raise SystemExit("RENDER_IMAGE_DIGEST must be an immutable SHA-256 digest")
          if set(image_digest.removeprefix("sha256:")) == {"0"}:
              raise SystemExit("RENDER_IMAGE_DIGEST must not be all zeroes")
          print(f"source_repository={repository}")
          print(f"source_sha={source_sha}")
          print(f"platform={os.environ['PLATFORM']}")
          print(f"torturer_sha={os.environ['TORTURER_SHA']}")
          print(f"server_image_digest={image_digest}")
          PY

      - name: Create ephemeral recipient and lease request
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HANDOFF_DIR"
          timeout --foreground --signal=KILL 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/recipient.crt"
          run_id="$(printf "%s:%s:%s:%s:%s" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          artifact_name="render-request-${run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$run_id" "$artifact_name" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          run_id = sys.argv[2]
          artifact_name = sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id):
              raise SystemExit("generated lease run id is invalid")
          if not re.fullmatch(r"render-request-[0-9a-f]{32}-linux", artifact_name):
              raise SystemExit("generated request artifact name is invalid")
          path.write_text(json.dumps({
              "schema": 1,
              "kind": "dobbyvpn.render-lease-request",
             "run_id": run_id,
             "platform": "linux",
              "source_sha": os.environ["SOURCE_SHA"],
             "image_digest": os.environ["SERVER_IMAGE_DIGEST"],
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          print(f"lease_run_id={run_id}")
          print(f"request_artifact_name={artifact_name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\n")
              env.write(f"REQUEST_ARTIFACT_NAME={artifact_name}\n")
          PY

      - name: Check out exact Torturer workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Download isolated candidate runtime without executing it
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-linux-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer and exact candidate runtime closure
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.candidate verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform linux --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Establish the hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"run_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Upload public certificate and opaque request after verified client readiness
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download the exact encrypted lease response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached the workflow cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python3 - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json
          from pathlib import Path
          import sys

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [
              item for item in document.get("artifacts", [])
              if item.get("name") == sys.argv[2] and item.get("expired") is not True
          ]
          if not matches:
              raise SystemExit(1)
          if len(matches) != 1:
              print("encrypted response artifact identity is ambiguous", file=sys.stderr)
              raise SystemExit(2)
          workflow_run = matches[0].get("workflow_run")
          run_id = workflow_run.get("id") if isinstance(workflow_run, dict) else None
          if not isinstance(run_id, int) or run_id <= 0:
              print("encrypted response workflow run identity is invalid", file=sys.stderr)
              raise SystemExit(2)
          print(run_id)
          PY
            )"
            then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python3 - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "id": int(sys.argv[2]),
              "event": "workflow_dispatch",
              "head_branch": os.environ["GITHUB_REF_NAME"],
              "head_sha": os.environ["TORTURER_SHA"],
              "path": ".github/workflows/server-lease.yml",
              "display_title": sys.argv[3],
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"lease workflow {key} mismatch")
          if run.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" \
                --artifact-name "$response_name" \
                --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" \
                --metadata "$attempt_dir/artifacts.json" \
                --archive "$attempt_dir/response.zip" \
                --expect-file lease.json \
                --expect-file profile.cms
              then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          unset GH_TOKEN
          test "$found" = true

      - name: Validate and decrypt the encrypted profile
        run: |
          set -euo pipefail
          test -n "${LEASE_RESPONSE_DIR:-}"
          test -f "$LEASE_RESPONSE_DIR/lease.json"
          test -f "$LEASE_RESPONSE_DIR/profile.cms"
          python3 - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": 1,
              "kind": "dobbyvpn.render-lease",
             "run_id": os.environ["LEASE_RUN_ID"],
             "platform": "linux",
              "source_sha": os.environ["SOURCE_SHA"],
             "image_digest": os.environ["SERVER_IMAGE_DIGEST"],
              "state": "issued",
          }
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))):
              raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "profile decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER \
            -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" \
            -inkey "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Start the candidate Linux service
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          mkdir -p "$SERVICE_DIR"
          control_socket="$SERVICE_DIR/control.sock"
          service_log="$HANDOFF_DIR/service.raw.log"
          : > "$service_log"
          chmod 600 "$service_log"
          expected_service="$GITHUB_WORKSPACE/candidate/ubuntu_grpcvpnserver"
          expected_exe="$(readlink -f "$expected_service")"
          peer_uid="$(id -u)"
          service_pid="$(
            sudo -n sh -c '
              set -eu
              binary=$1
              control_socket=$2
              peer_uid=$3
              library_path=$4
              log_path=$5
              umask 077
              env \
                DOBBYVPN_CONTROL_SOCKET="$control_socket" \
                DOBBYVPN_CONTROL_PEER_UID="$peer_uid" \
                LD_LIBRARY_PATH="$library_path" \
                "$binary" > "$log_path" 2>&1 < /dev/null &
              printf "%s\n" "$!"
            ' dobbyvpn-service \
              "$expected_service" \
              "$control_socket" \
              "$peer_uid" \
              "$GITHUB_WORKSPACE/candidate" \
              "$service_log"
          )"
          case "$service_pid" in
            ""|0|*[!0-9]*) printf 'candidate service returned invalid pid=%s\n' "$service_pid" >&2; exit 1 ;;
          esac
          service_pid_file="$HANDOFF_DIR/service.pid"
          printf '%s\n' "$service_pid" > "$service_pid_file"
          chmod 600 "$service_pid_file"
          {
            printf 'SERVICE_PID=%s\n' "$service_pid"
            printf 'SERVICE_PID_FILE=%s\n' "$service_pid_file"
            printf 'SERVICE_SOCKET=%s\n' "$control_socket"
            printf 'DOBBYVPN_CONTROL_SOCKET=%s\n' "$control_socket"
            printf 'SERVICE_LOG=%s\n' "$service_log"
          } >> "$GITHUB_ENV"
          ready=false
          for _ in $(seq 1 60); do
            if ! sudo -n kill -0 "$service_pid"; then
              emit_private_evidence candidate-service-exited "$service_log"
              printf 'candidate_service_readiness=failed code=SERVICE_EXITED\n' >&2
              exit 1
            fi
            if [ -S "$control_socket" ]; then
              if actual_exe="$(sudo -n readlink -f "/proc/$service_pid/exe")"; then
                if [ "$actual_exe" != "$expected_exe" ]; then
                  process_snapshot="$HANDOFF_DIR/service-executable-mismatch.raw.log"
                  snapshot_status=0
                  sudo -n ps -o pid,ppid,uid,gid,state,etime,args -p "$service_pid" > "$process_snapshot" 2>&1 || snapshot_status=$?
                  emit_private_evidence service-process-mismatch "$process_snapshot"
                  emit_private_evidence service-log-mismatch "$service_log"
                  printf 'candidate_service_readiness=failed code=EXECUTABLE_MISMATCH snapshot_status=%s\n' "$snapshot_status" >&2
                  exit 1
                fi
              else
                process_snapshot="$HANDOFF_DIR/service-executable-probe.raw.log"
                snapshot_status=0
                sudo -n ps -o pid,ppid,uid,gid,state,etime,args -p "$service_pid" > "$process_snapshot" 2>&1 || snapshot_status=$?
                emit_private_evidence service-process-probe "$process_snapshot"
                emit_private_evidence service-log-probe "$service_log"
                printf 'candidate_service_readiness=failed code=EXECUTABLE_PROBE snapshot_status=%s\n' "$snapshot_status" >&2
                exit 1
              fi
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence service-readiness-timeout "$service_log"
            printf 'candidate_service_readiness=failed code=CONTROL_SOCKET_TIMEOUT\n' >&2
            exit 1
          fi

      - name: Discover physical default-route interface for network transition
        run: |
          set -euo pipefail
          umask 077
          route_log="$HANDOFF_DIR/default-route-interface.raw.log"
          timeout --foreground --signal=TERM --kill-after=1s 10s \
            ip -o route show table main default > "$route_log" 2>&1
          network_interface="$(awk '
            $1 == "default" {
              for (i = 1; i < NF; i++) {
                if ($i == "dev") {
                  print $(i + 1)
                  exit
                }
              }
            }
          ' "$route_log")"
          case "$network_interface" in
            ""|lo|tun*|wg*|tap*|utun*)
              printf '%s\n' 'no usable physical default-route interface was discovered' >&2
              exit 1
              ;;
          esac
          timeout --foreground --signal=TERM --kill-after=1s 10s \
            ip link show dev "$network_interface" >> "$route_log" 2>&1
          printf 'NETWORK_INTERFACE=%s\n' "$network_interface" >> "$GITHUB_ENV"
          printf 'network_transition_interface_discovered=true\n'

      - name: Run canonical Linux functional scenarios
        id: functional
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120))
          if [ "$remaining" -lt 950 ]; then
            printf 'insufficient full-catalog budget before cleanup reserve: seconds=%s\n' "$remaining" >&2
            exit 1
          fi
          if [ "$remaining" -gt 1260 ]; then
            remaining=1260
          fi
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.run \
            --platform linux \
            --cli "$GITHUB_WORKSPACE/candidate/dobby-cli" \
            --profile "$HANDOFF_DIR/profile.toml" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --platform-version "ubuntu-24.04" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" \
            --server-image-digest "$SERVER_IMAGE_DIGEST" \
            --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" \
            --download-url "https://proof.ovh.net/files/1Mb.dat" \
            --upload-url "https://speed.cloudflare.com/__up" \
            --service-pid "$SERVICE_PID" \
            --service-binary "$GITHUB_WORKSPACE/candidate/ubuntu_grpcvpnserver" \
            --service-socket "$SERVICE_SOCKET" \
            --service-library-path "$GITHUB_WORKSPACE/candidate" \
            --service-pid-file "$SERVICE_PID_FILE" \
            --network-interface "$NETWORK_INTERFACE" \
            --expected-unavailable "functional.sleep-wake=HOSTED_RUNNER_SUSPEND_UNSUPPORTED"

      - name: Stop candidate service and verify process cleanup
        if: always()
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          service_pid="${SERVICE_PID:-}"
          if [ -f "${SERVICE_PID_FILE:-}" ]; then
            service_pid="$(cat "$SERVICE_PID_FILE")"
          fi
          case "$service_pid" in
            "") ;;
            0|*[!0-9]*) printf 'cleanup received invalid service pid=%s\n' "$service_pid" >&2; exit 1 ;;
          esac
          service_state_probe="$HANDOFF_DIR/service-state-probes.raw.log"
          : > "$service_state_probe"
          process_is_live() {
            local pid="$1" state probe_status=0
            sudo -n ps -o state= -p "$pid" >> "$service_state_probe" 2>&1 || probe_status=$?
            state="$(awk 'NF {last=$1} END {print last}' "$service_state_probe")"
            if [ "$probe_status" -ne 0 ] || ! sudo -n kill -0 "$pid"; then
              return 1
            fi
            case "$state" in
              Z*|z*) return 1 ;;
              *) return 0 ;;
            esac
          }
          if [ -n "$service_pid" ] && process_is_live "$service_pid"; then
            sudo -n kill -TERM "$service_pid"
            stopped=false
            for _ in $(seq 1 30); do
              if ! process_is_live "$service_pid"; then
                stopped=true
                break
              fi
              sleep 1
            done
            if [ "$stopped" != true ]; then
              kill_status=0
              sudo -n kill -KILL "$service_pid" || kill_status=$?
              printf 'candidate_service_kill=KILL status=%s\n' "$kill_status"
              for _ in $(seq 1 10); do
                if ! process_is_live "$service_pid"; then
                  stopped=true
                  break
                fi
                sleep 1
              done
            fi
            test "$stopped" = true
            children_snapshot="$HANDOFF_DIR/service-children.raw.log"
            children_status=0
            ps -eo pid=,ppid=,args= > "$children_snapshot" 2>&1 || children_status=$?
            children_count="$(awk -v parent="$service_pid" '$2 == parent {count++} END {print count + 0}' "$children_snapshot")"
            emit_private_evidence service-children "$children_snapshot"
            if [ "$children_count" -ne 0 ] || [ "$children_status" -ne 0 ]; then
              printf 'candidate_service_cleanup=failed code=CHILD_PROCESSES count=%s snapshot_status=%s\n' "$children_count" "$children_status" >&2
              exit 1
            fi
          else
            printf '%s\n' 'candidate service was not running at cleanup'
          fi
          emit_private_evidence service-state-probes "$service_state_probe"

      - name: Upload safe functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque completion marker for trusted cleanup
        if: always()
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          marker_dir="$HANDOFF_DIR/completion"
          mkdir -p "$marker_dir"
          printf 'schema=1\nrun_id=%s\nplatform=linux\nfunctional_outcome=%s\n' \
            "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$marker_dir/completion.marker"

      - name: Upload opaque completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"


  controller:
    name: Dispatch isolated Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: linux
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      LEASE_RUN_ID: ""
      REQUEST_ARTIFACT_NAME: ""

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["SERVER_IMAGE_DIGEST"]):
              raise SystemExit("RENDER_IMAGE_DIGEST must be immutable")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["TORTURER_SHA"]):
              raise SystemExit("TORTURER_SHA must be a full lowercase SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]):
              raise SystemExit("SOURCE_SHA must be a full lowercase SHA")
          print("controller_inputs=validated")
          PY

      - name: Derive one origin/platform lease correlation
        run: |
          set -euo pipefail
          run_id="$(printf "%s:%s:%s:%s:%s" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\n' "$run_id" >> "$GITHUB_ENV"
          printf 'REQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for the client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python3 - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 180); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python3 - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          wanted_run = int(sys.argv[2])
          wanted_name = sys.argv[3]
          for artifact in document.get("artifacts", []):
              if artifact.get("name") != wanted_name or artifact.get("expired") is True:
                  continue
              if (artifact.get("workflow_run") or {}).get("id") == wanted_run:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              found=true
              break
            fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
              -f "ref=${GITHUB_REF_NAME}" \
              -f "inputs[mode]=acquire" \
              -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
              -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" \
              -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
              -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
              -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
              -f "inputs[platform]=${PLATFORM}" \
              -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" \
              -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
          unset GH_TOKEN
