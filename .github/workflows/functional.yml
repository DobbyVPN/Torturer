name: Trusted functional Linux

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-functional-linux-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build untrusted Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}

    steps:
      - name: Validate exact public candidate identity
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "DobbyVPN/DobbyVPN"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|"") printf '%s\n' 'commit_sha must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Check out exact trusted Torturer helper revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Verify exact trusted Torturer helper checkout
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Check out exact untrusted DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          git -C candidate status --porcelain=v1 --untracked-files=all
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"

      - name: Build untrusted Linux service and CLI
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_build.py libs --platform linux --arch amd64
          python3 .github/scripts/desktop_build.py app --platform linux --skip-libs
          sha256sum kmp_module/services/ubuntu_grpcvpnserver kmp_module/services/dobby-cli

      - name: Stage an allow-listed candidate runtime closure
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.candidate stage \
            --root "$GITHUB_WORKSPACE/candidate" --output "$RUNNER_TEMP/candidate-linux" \
            --platform linux --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Upload isolated candidate runtime
        id: candidate_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-linux-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/candidate-linux
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  client:
    needs: build
    name: Trusted functional Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: linux
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      SERVER_SINK_IMAGE_DIGEST: ${{ vars.RENDER_SINK_IMAGE_DIGEST }}

    steps:
      - name: Establish runner-local paths
        run: |
          set -euo pipefail
          {
            printf 'HANDOFF_DIR=%s\n' "$RUNNER_TEMP/dobbyvpn-render-handoff"
            printf 'SERVICE_DIR=%s\n' "$RUNNER_TEMP/dobbyvpn-service"
            printf 'RESULT_PATH=%s\n' "$RUNNER_TEMP/dobbyvpn-render-handoff/functional-result.json"
            printf 'LEASE_RUN_ID=unassigned\n'
            printf 'POST_LANE_DEADLINE_EPOCH=unvalidated\n'
            printf 'POST_LANE_STEP_TIMEOUT_SECONDS=60\n'
            printf 'POST_LANE_MARKER_RESERVE_SECONDS=180\n'
          } >> "$GITHUB_ENV"

      - name: Validate trusted functional inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          repository = os.environ["SOURCE_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          image_digest = os.environ["SERVER_IMAGE_DIGEST"]
          if repository != "DobbyVPN/DobbyVPN":
              raise SystemExit("source_repository must be DobbyVPN/DobbyVPN")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("commit_sha must be a full lowercase SHA")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest):
              raise SystemExit("RENDER_IMAGE_DIGEST must be an immutable SHA-256 digest")
          if set(image_digest.removeprefix("sha256:")) == {"0"}:
              raise SystemExit("RENDER_IMAGE_DIGEST must not be all zeroes")
          sink_digest = os.environ["SERVER_SINK_IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", sink_digest):
              raise SystemExit("RENDER_SINK_IMAGE_DIGEST must be an immutable SHA-256 digest")
          if set(sink_digest.removeprefix("sha256:")) == {"0"}:
              raise SystemExit("RENDER_SINK_IMAGE_DIGEST must not be all zeroes")
          print(f"source_repository={repository}")
          print(f"source_sha={source_sha}")
          print(f"platform={os.environ['PLATFORM']}")
          print(f"torturer_sha={os.environ['TORTURER_SHA']}")
          print(f"server_image_digest={image_digest}")
          PY

      - name: Create ephemeral recipient and lease request
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HANDOFF_DIR"
          timeout --foreground --signal=KILL 60s openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/recipient.crt"
          run_id="$(printf "%s:%s:%s:%s:%s" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          artifact_name="render-request-${run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$run_id" "$artifact_name" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          run_id = sys.argv[2]
          artifact_name = sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id):
              raise SystemExit("generated lease run id is invalid")
          if not re.fullmatch(r"render-request-[0-9a-f]{32}-linux", artifact_name):
              raise SystemExit("generated request artifact name is invalid")
          path.write_text(json.dumps({
              "schema": 1,
              "kind": "dobbyvpn.render-lease-request",
             "run_id": run_id,
             "platform": "linux",
              "source_sha": os.environ["SOURCE_SHA"],
             "image_digest": os.environ["SERVER_IMAGE_DIGEST"],
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          print(f"lease_run_id={run_id}")
          print(f"request_artifact_name={artifact_name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\n")
              env.write(f"REQUEST_ARTIFACT_NAME={artifact_name}\n")
          PY

      - name: Check out exact Torturer workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Download isolated candidate runtime without executing it
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-linux-${{ inputs.commit_sha }}
          path: candidate

      - name: Verify trusted Torturer and exact candidate runtime closure
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          git -C torturer status --porcelain=v1 --untracked-files=all
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.candidate verify \
            --root "$GITHUB_WORKSPACE/candidate" --platform linux --architecture amd64 --source-sha "$SOURCE_SHA"

      - name: Establish the hard thirty-minute workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 origin-run "$HANDOFF_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$HANDOFF_DIR/origin-run.json" <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("workflow run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          if int(datetime.datetime.now(datetime.timezone.utc).timestamp()) >= deadline:
              raise SystemExit("workflow already exceeded its hard thirty-minute deadline")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RUN_DEADLINE_EPOCH={deadline}\n")
          print(f"run_deadline_epoch={deadline}")
          PY
          unset GH_TOKEN

      - name: Upload public certificate and opaque request after verified client readiness
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for and download the exact encrypted lease response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          response_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          expected_title="Trusted Render lease ${LEASE_RUN_ID} ${PLATFORM}"
          found=false
          for attempt in $(seq 1 120); do
            remaining=$((RUN_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 180 ]; then
              printf 'lease response wait reached the workflow cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            attempt_dir="$HANDOFF_DIR/lease-response-attempt-$attempt"
            mkdir -p "$attempt_dir"
            api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
            if [ "$api_remaining" -le 0 ]; then
              printf 'lease response polling reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
              break
            fi
            api_timeout=30
            if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" artifact-poll "$attempt_dir/poll.json" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${response_name}"
            if lease_workflow_run_id="$(python3 - "$attempt_dir/poll.json" "$response_name" <<'PY'
          import json
          from pathlib import Path
          import sys

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [
              item for item in document.get("artifacts", [])
              if item.get("name") == sys.argv[2] and item.get("expired") is not True
          ]
          if not matches:
              raise SystemExit(1)
          if len(matches) != 1:
              print("encrypted response artifact identity is ambiguous", file=sys.stderr)
              raise SystemExit(2)
          workflow_run = matches[0].get("workflow_run")
          run_id = workflow_run.get("id") if isinstance(workflow_run, dict) else None
          if not isinstance(run_id, int) or run_id <= 0:
              print("encrypted response workflow run identity is invalid", file=sys.stderr)
              raise SystemExit(2)
          print(run_id)
          PY
            )"
            then
              api_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 181))
              if [ "$api_remaining" -le 0 ]; then
                printf 'lease workflow lookup reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              api_timeout=30
              if [ "$api_timeout" -gt "$api_remaining" ]; then api_timeout="$api_remaining"; fi
              "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" lease-workflow-run "$attempt_dir/lease-workflow-run.json" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${lease_workflow_run_id}"
              python3 - "$attempt_dir/lease-workflow-run.json" "$lease_workflow_run_id" "$expected_title" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "id": int(sys.argv[2]),
              "event": "workflow_dispatch",
              "head_branch": os.environ["GITHUB_REF_NAME"],
              "head_sha": os.environ["TORTURER_SHA"],
              "path": ".github/workflows/server-lease.yml",
              "display_title": sys.argv[3],
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"lease workflow {key} mismatch")
          if run.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("lease workflow repository mismatch")
          print("lease_workflow_run=validated")
          PY
              transfer_timeout=30
              if [ "$transfer_timeout" -gt "$api_remaining" ]; then transfer_timeout="$api_remaining"; fi
              if [ "$transfer_timeout" -le 0 ]; then
                printf 'lease response transfer reached the cleanup reserve: remaining=%s\n' "$api_remaining" >&2
                break
              fi
              if PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.artifacts \
                --repository "$GITHUB_REPOSITORY" \
                --artifact-name "$response_name" \
                --run-id "$lease_workflow_run_id" \
                --output-dir "$attempt_dir/unpacked" \
                --metadata "$attempt_dir/artifacts.json" \
                --archive "$attempt_dir/response.zip" \
                --timeout-seconds "$transfer_timeout" \
                --expect-file lease.json \
                --expect-file profile.cms \
                --expect-file upload.cms
              then
                printf 'LEASE_RESPONSE_DIR=%s\n' "$attempt_dir/unpacked" >> "$GITHUB_ENV"
                found=true
                break
              fi
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
            fi
            printf 'lease_response_attempt=%s status=pending\n' "$attempt"
            sleep 5
          done
          unset GH_TOKEN
          test "$found" = true

      - name: Validate and decrypt the encrypted profile
        run: |
          set -euo pipefail
          test -n "${LEASE_RESPONSE_DIR:-}"
          test -f "$LEASE_RESPONSE_DIR/lease.json"
          test -f "$LEASE_RESPONSE_DIR/profile.cms"
          test -f "$LEASE_RESPONSE_DIR/upload.cms"
          python3 - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": 2,
              "kind": "dobbyvpn.render-lease",
              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": "linux",
              "source_sha": os.environ["SOURCE_SHA"],
              "state": "issued",
          }
          expected_keys = set(expected) | {"services", "available_until_epoch"}
          if set(value) != expected_keys:
              raise SystemExit("Linux safe lease record has an unsafe shape")
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"lease field {key} is invalid")
          available_until_epoch = value.get("available_until_epoch")
          if (
              isinstance(available_until_epoch, bool)
              or not isinstance(available_until_epoch, int)
              or available_until_epoch <= 0
          ):
              raise SystemExit("lease availability deadline is invalid")
          services = value.get("services")
          if not isinstance(services, list) or len(services) != 2:
              raise SystemExit("Linux lease service bundle is invalid")
          roles = {service.get("role") for service in services if isinstance(service, dict)}
          if roles != {"outline", "upload-sink"}:
              raise SystemExit("Linux lease service roles are invalid")
          service_ids = set()
          services_by_role = {}
          for service in services:
              if not isinstance(service, dict) or set(service) != {"role", "service_id", "image_digest", "provider_generation"}:
                  raise SystemExit("Linux lease service shape is invalid")
              if not isinstance(service["role"], str) or service["role"] in services_by_role:
                  raise SystemExit("Linux lease service roles are duplicated")
              if not isinstance(service["service_id"], str) or not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["service_id"]):
                  raise SystemExit("lease service id is invalid")
              if service["service_id"] in service_ids:
                  raise SystemExit("Linux lease service IDs are not distinct")
              service_ids.add(service["service_id"])
              if not isinstance(service["image_digest"], str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", service["image_digest"]):
                  raise SystemExit("Linux lease image digest is invalid")
              if not isinstance(service["provider_generation"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["provider_generation"]):
                  raise SystemExit("Linux lease provider generation is invalid")
              services_by_role[service["role"]] = service
          if services_by_role["outline"]["image_digest"] != os.environ["SERVER_IMAGE_DIGEST"]:
              raise SystemExit("Linux Outline image identity is not bound")
          if services_by_role["upload-sink"]["image_digest"] != os.environ["SERVER_SINK_IMAGE_DIGEST"]:
              raise SystemExit("Linux upload-sink image identity is not bound")
          if any(token in json.dumps(value).lower() for token in ("url", "path", "password", "secret")):
              raise SystemExit("Linux safe lease record contains private handoff data")
          print("lease_record=validated")
          PY
          cleanup_reserve_seconds=120
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - cleanup_reserve_seconds - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "profile decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER \
            -in "$LEASE_RESPONSE_DIR/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" \
            -inkey "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"
          openssl_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - cleanup_reserve_seconds - 1))
          if [ "$openssl_timeout" -le 0 ]; then printf "%s\n" "upload URL decryption reached the hard workflow deadline" >&2; exit 1; fi
          if [ "$openssl_timeout" -gt 60 ]; then openssl_timeout=60; fi
          timeout --foreground --signal=TERM --kill-after=1s "${openssl_timeout}s" openssl cms -decrypt -binary -inform DER \
            -in "$LEASE_RESPONSE_DIR/upload.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" \
            -inkey "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/upload-url.txt"
          chmod 600 "$HANDOFF_DIR/upload-url.txt"
          python3 - "$HANDOFF_DIR/upload-url.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]{1,253}/upload/[0-9a-f]{32}", value):
              raise SystemExit("encrypted upload URL is invalid")
          print("upload_handoff=validated")
          PY

      - name: Establish validated post-lane provider deadline
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          lease_file="${LEASE_RESPONSE_DIR:-}/lease.json"
          if [ -z "${LEASE_RESPONSE_DIR:-}" ] || [ ! -f "$lease_file" ]; then
            printf '%s\n' 'post-lane provider deadline unavailable: no validated lease exists; server hard cleanup remains authoritative' >&2
            exit 1
          fi
          available_until_epoch="$(python3 - "$lease_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          deadline = value.get("available_until_epoch")
          if isinstance(deadline, bool) or not isinstance(deadline, int) or deadline <= 0:
              raise SystemExit("lease availability deadline is invalid")
          print(deadline)
          PY
          )"
          printf 'POST_LANE_DEADLINE_EPOCH=%s\nPOST_LANE_STEP_TIMEOUT_SECONDS=60\nPOST_LANE_MARKER_RESERVE_SECONDS=180\n' \
            "$((available_until_epoch - 5))" >> "$GITHUB_ENV"
          printf 'validated_post_lane_provider_deadline=%s marker_reserve_seconds=180\n' "$available_until_epoch"

      - name: Start the candidate Linux service
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          mkdir -p "$SERVICE_DIR"
          control_socket="$SERVICE_DIR/control.sock"
          service_log="$HANDOFF_DIR/service.raw.log"
          : > "$service_log"
          chmod 600 "$service_log"
          expected_service="$GITHUB_WORKSPACE/candidate/ubuntu_grpcvpnserver"
          expected_exe="$(readlink -f "$expected_service")"
          service_identity_file="$HANDOFF_DIR/service.identity"
          peer_uid="$(id -u)"
          launch_log="$HANDOFF_DIR/service-launch.raw.log"
          : > "$launch_log"
          chmod 600 "$launch_log"
          launch_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 60 - 1))
          launch_timeout=10
          if [ "$launch_timeout" -gt "$launch_remaining" ]; then launch_timeout="$launch_remaining"; fi
          if [ "$launch_timeout" -le 0 ]; then
            printf 'candidate service launch reached cleanup reserve: remaining=%s\n' "$launch_remaining" >&2
            exit 1
          fi
          launch_status=0
          service_pid="$(
            timeout --foreground --signal=TERM --kill-after=1s "${launch_timeout}s" sudo -n sh -c '
              set -eu
              binary=$1
              control_socket=$2
              peer_uid=$3
              library_path=$4
              log_path=$5
              umask 077
              env \
                DOBBYVPN_CONTROL_SOCKET="$control_socket" \
                DOBBYVPN_CONTROL_PEER_UID="$peer_uid" \
                LD_LIBRARY_PATH="$library_path" \
                "$binary" > "$log_path" 2>&1 < /dev/null &
              printf "%s\n" "$!"
            ' dobbyvpn-service \
              "$expected_service" \
              "$control_socket" \
              "$peer_uid" \
              "$GITHUB_WORKSPACE/candidate" \
              "$service_log"
          )" 2>"$launch_log" || launch_status=$?
          emit_private_evidence service-launch "$launch_log"
          if [ "$launch_status" -ne 0 ]; then
            printf 'candidate_service_launch=failed code=LAUNCH status=%s\n' "$launch_status" >&2
            emit_private_evidence service-log "$service_log"
            exit 1
          fi
          case "$service_pid" in
            ""|0|*[!0-9]*) printf 'candidate service returned invalid pid=%s\n' "$service_pid" >&2; exit 1 ;;
          esac
          identity_probe="$HANDOFF_DIR/service-identity.raw.log"
          identity_probe_status=0
          identity_probe_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120 - 1))
          identity_probe_timeout=10
          if [ "$identity_probe_timeout" -gt "$identity_probe_remaining" ]; then identity_probe_timeout="$identity_probe_remaining"; fi
          if [ "$identity_probe_timeout" -le 0 ]; then
            printf 'candidate service identity reached cleanup reserve: remaining=%s\n' "$identity_probe_remaining" >&2
            exit 1
          fi
          timeout --foreground --signal=TERM --kill-after=1s "${identity_probe_timeout}s" \
            sudo -n sh -c 'set -eu; cat "/proc/$1/stat"' dobbyvpn-process-stat "$service_pid" > "$identity_probe" 2>&1 || identity_probe_status=$?
          emit_private_evidence service-identity "$identity_probe"
          if [ "$identity_probe_status" -ne 0 ]; then
            printf 'candidate_service_launch=failed code=IDENTITY_PROBE status=%s\n' "$identity_probe_status" >&2
            emit_private_evidence service-log "$service_log"
            exit 1
          fi
          python3 - "$identity_probe" "$service_identity_file" "$service_pid" <<'PY'
          from pathlib import Path
          import sys

          raw = Path(sys.argv[1]).read_text(encoding="ascii", errors="strict").strip()
          expected_pid = int(sys.argv[3])
          try:
              prefix, fields = raw.rsplit(") ", 1)
              pid = int(prefix.split("(", 1)[0].strip())
              columns = fields.split()
              state = columns[0]
              process_group = int(columns[2])
              start = columns[19]
          except (ValueError, IndexError):
              raise SystemExit("Linux service identity probe is incomplete")
          if (
              pid != expected_pid
              or len(state) != 1
              or process_group <= 0
              or not start.isdigit()
              or int(start) <= 0
              or state.upper() == "Z"
          ):
              raise SystemExit("Linux service identity probe is invalid")
          destination = Path(sys.argv[2])
          destination.write_text(f"{pid}|{start}|{process_group}\n", encoding="ascii")
          destination.chmod(0o600)
          PY
          identity_exe_status=0
          identity_exe_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 120 - 1))
          identity_exe_timeout=5
          if [ "$identity_exe_timeout" -gt "$identity_exe_remaining" ]; then identity_exe_timeout="$identity_exe_remaining"; fi
          if [ "$identity_exe_timeout" -le 0 ]; then
            printf 'candidate service executable proof reached cleanup reserve: remaining=%s\n' "$identity_exe_remaining" >&2
            exit 1
          fi
          actual_exe="$(timeout --foreground --signal=TERM --kill-after=1s "${identity_exe_timeout}s" sudo -n readlink -f "/proc/$service_pid/exe")" || identity_exe_status=$?
          if [ "$identity_exe_status" -ne 0 ] || [ "$actual_exe" != "$expected_exe" ]; then
            printf 'candidate_service_launch=failed code=EXECUTABLE_IDENTITY status=%s\n' "$identity_exe_status" >&2
            emit_private_evidence service-log "$service_log"
            exit 1
          fi
          service_pid_file="$HANDOFF_DIR/service.pid"
          printf '%s\n' "$service_pid" > "$service_pid_file"
          chmod 600 "$service_pid_file"
          {
            printf 'SERVICE_PID=%s\n' "$service_pid"
            printf 'SERVICE_PID_FILE=%s\n' "$service_pid_file"
            printf 'SERVICE_IDENTITY_FILE=%s\n' "$service_identity_file"
            printf 'SERVICE_BINARY=%s\n' "$expected_service"
            printf 'SERVICE_SOCKET=%s\n' "$control_socket"
            printf 'SERVICE_IDENTITY_FILE=%s\n' "$service_identity_file"
            printf 'DOBBYVPN_CONTROL_SOCKET=%s\n' "$control_socket"
            printf 'SERVICE_LOG=%s\n' "$service_log"
          } >> "$GITHUB_ENV"
          ready=false
          readiness_reserve_seconds=120
          readiness_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - readiness_reserve_seconds))
          if [ "$readiness_remaining" -le 0 ]; then
            printf 'candidate service readiness reached the cleanup reserve: remaining=%s\n' "$readiness_remaining" >&2
            exit 1
          fi
          readiness_timeout=60
          if [ "$readiness_timeout" -gt "$readiness_remaining" ]; then readiness_timeout="$readiness_remaining"; fi
          for _ in $(seq 1 "$readiness_timeout"); do
            readiness_remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - readiness_reserve_seconds))
            if [ "$readiness_remaining" -le 0 ]; then break; fi
            if ! sudo -n kill -0 "$service_pid"; then
              emit_private_evidence candidate-service-exited "$service_log"
              printf 'candidate_service_readiness=failed code=SERVICE_EXITED\n' >&2
              exit 1
            fi
            if [ -S "$control_socket" ]; then
              if actual_exe="$(sudo -n readlink -f "/proc/$service_pid/exe")"; then
                if [ "$actual_exe" != "$expected_exe" ]; then
                  process_snapshot="$HANDOFF_DIR/service-executable-mismatch.raw.log"
                  snapshot_status=0
                  sudo -n ps -o pid,ppid,uid,gid,state,etime,args -p "$service_pid" > "$process_snapshot" 2>&1 || snapshot_status=$?
                  emit_private_evidence service-process-mismatch "$process_snapshot"
                  emit_private_evidence service-log-mismatch "$service_log"
                  printf 'candidate_service_readiness=failed code=EXECUTABLE_MISMATCH snapshot_status=%s\n' "$snapshot_status" >&2
                  exit 1
                fi
              else
                process_snapshot="$HANDOFF_DIR/service-executable-probe.raw.log"
                snapshot_status=0
                sudo -n ps -o pid,ppid,uid,gid,state,etime,args -p "$service_pid" > "$process_snapshot" 2>&1 || snapshot_status=$?
                emit_private_evidence service-process-probe "$process_snapshot"
                emit_private_evidence service-log-probe "$service_log"
                printf 'candidate_service_readiness=failed code=EXECUTABLE_PROBE snapshot_status=%s\n' "$snapshot_status" >&2
                exit 1
              fi
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            emit_private_evidence service-readiness-timeout "$service_log"
            printf 'candidate_service_readiness=failed code=CONTROL_SOCKET_TIMEOUT\n' >&2
            exit 1
          fi

      - name: Run canonical Linux functional scenarios
        id: functional
        working-directory: torturer
        run: |
          set -euo pipefail
          remaining=$((RUN_DEADLINE_EPOCH - $(date +%s) - 300))
          # Eight applicable scenarios plus ten resets require 950 seconds;
          # keep a deliberate 60-second scheduling margin inside the 1,200s cap.
          if [ "$remaining" -gt 1200 ]; then
            remaining=1200
          fi
          available_until_epoch="$(python3 - "$LEASE_RESPONSE_DIR/lease.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(value["available_until_epoch"])
          PY
          )"
          case "$available_until_epoch" in
            ''|*[!0-9]*) printf 'lease availability deadline is invalid\n' >&2; exit 1 ;;
          esac
          server_remaining=$((available_until_epoch - $(date +%s)))
          client_post_lane_reserve_seconds=300
          lane_start_margin_seconds=5
          server_lane_remaining=$((server_remaining - client_post_lane_reserve_seconds - lane_start_margin_seconds))
          if [ "$server_lane_remaining" -le 0 ]; then
            printf 'insufficient Render lease lifetime before functional lane: seconds=%s reserve=%s margin=%s\n' \
              "$server_remaining" "$client_post_lane_reserve_seconds" "$lane_start_margin_seconds" >&2
            exit 1
          fi
          if [ "$remaining" -gt "$server_lane_remaining" ]; then
            remaining="$server_lane_remaining"
          fi
          if [ "$remaining" -lt 1010 ]; then
            printf 'insufficient Linux canonical budget before cleanup reserve: seconds=%s required=1010\n' "$remaining" >&2
            exit 1
          fi
          printf 'render_lease_lifetime_for_lane_seconds=%s required=%s reserve=%s margin=%s\n' \
            "$server_remaining" "$remaining" "$client_post_lane_reserve_seconds" "$lane_start_margin_seconds"
          printf 'canonical_lane_timeout_seconds=%s\n' "$remaining"
          upload_url="$(cat "$HANDOFF_DIR/upload-url.txt")"
          test -n "$upload_url"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$remaining" --kill-grace-seconds 30 \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.run \
            --lane-timeout-seconds "$remaining" \
            --platform linux \
            --cli "$GITHUB_WORKSPACE/candidate/dobby-cli" \
            --profile "$HANDOFF_DIR/profile.toml" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --platform-version "ubuntu-24.04" \
            --candidate-manifest "$GITHUB_WORKSPACE/candidate/manifest.json" \
            --server-image-digest "$SERVER_IMAGE_DIGEST" \
            --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw" \
            --upload-url "$upload_url" \
            --service-pid "$SERVICE_PID" \
            --service-binary "$GITHUB_WORKSPACE/candidate/ubuntu_grpcvpnserver" \
            --service-socket "$SERVICE_SOCKET" \
            --service-library-path "$GITHUB_WORKSPACE/candidate" \
            --service-pid-file "$SERVICE_PID_FILE" \
            --service-identity-file "$SERVICE_IDENTITY_FILE" \
            --expected-unavailable functional.network-transition=HOSTED_LINUX_INTERFACE_REQUIRED \
            --expected-unavailable functional.sleep-wake=HOSTED_RUNNER_SUSPEND_UNSUPPORTED

      - name: Stop candidate service and verify process cleanup
        id: essential_cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          emit_private_evidence() {
            label="$1"
            file="$2"
            if [ -f "$file" ]; then
              bytes="$(wc -c < "$file" | tr -d '[:space:]')"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              evidence_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$label" | sha256sum | cut -c1-16)"
              printf 'diagnostic_evidence label=%s id=%s bytes=%s sha256=%s\n' \
                "$label" "$evidence_id" "$bytes" "$digest"
            else
              printf 'diagnostic_evidence label=%s state=missing\n' "$label"
            fi
          }
          service_pid="${SERVICE_PID:-}"
          service_identity_file="${SERVICE_IDENTITY_FILE:-}"
          service_binary="${SERVICE_BINARY:-$GITHUB_WORKSPACE/candidate/ubuntu_grpcvpnserver}"
          service_identity=""
          expected_start=""
          expected_group=""
          if [ -n "$service_identity_file" ] && [ -f "$service_identity_file" ]; then
            service_identity="$(tr -d '\r\n' < "$service_identity_file")"
          fi
          if [ -n "$service_pid" ] || [ -n "$service_identity" ]; then
            if ! [[ "$service_identity" =~ ^([1-9][0-9]{0,9})\|([1-9][0-9]+)\|([1-9][0-9]+)$ ]]; then
              emit_private_evidence service-identity "$service_identity_file"
              printf 'candidate_service_cleanup=failed code=IDENTITY_UNAVAILABLE\n' >&2
              exit 1
            fi
            service_pid="${BASH_REMATCH[1]}"
            expected_start="${BASH_REMATCH[2]}"
            expected_group="${BASH_REMATCH[3]}"
          fi
          if [ -f "${SERVICE_PID_FILE:-}" ]; then
            if [ -z "$service_identity" ]; then
              service_pid="$(cat "$SERVICE_PID_FILE")"
            fi
          fi
          if [ -n "$service_pid" ] && [ -z "$expected_start" ]; then
            emit_private_evidence service-identity "$service_identity_file"
            printf 'candidate_service_cleanup=failed code=IDENTITY_UNAVAILABLE\n' >&2
            exit 1
          fi
          case "$service_pid" in
            "") ;;
            0|*[!0-9]*) printf 'cleanup received invalid service pid=%s\n' "$service_pid" >&2; exit 1 ;;
          esac
          cleanup_deadline_epoch=$((RUN_DEADLINE_EPOCH - 60))
          cleanup_deadline_hit=false
          service_state_probe="$HANDOFF_DIR/service-state-probes.raw.log"
          : > "$service_state_probe"
          identity_matches() {
            local identity_status=0 identity_remaining identity_timeout actual_exe stat_record
            identity_remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$identity_remaining" -le 0 ]; then cleanup_deadline_hit=true; return 1; fi
            identity_timeout=5
            if [ "$identity_timeout" -gt "$identity_remaining" ]; then identity_timeout="$identity_remaining"; fi
            actual_exe="$(timeout --foreground --signal=TERM --kill-after=1s "${identity_timeout}s" sudo -n readlink -f "/proc/$service_pid/exe" 2>>"$service_state_probe")" || identity_status=$?
            printf 'identity_probe_pid=%s status=%s exe=%s\n' "$service_pid" "$identity_status" "$actual_exe" >> "$service_state_probe"
            if [ "$identity_status" -ne 0 ] || [ "$actual_exe" != "$(readlink -f "$service_binary")" ]; then return 1; fi
            identity_remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$identity_remaining" -le 0 ]; then cleanup_deadline_hit=true; return 1; fi
            identity_timeout=5
            if [ "$identity_timeout" -gt "$identity_remaining" ]; then identity_timeout="$identity_remaining"; fi
            stat_record="$(timeout --foreground --signal=TERM --kill-after=1s "${identity_timeout}s" sudo -n sh -c 'cat "/proc/$1/stat"' dobbyvpn-process-stat "$service_pid" 2>>"$service_state_probe")" || identity_status=$?
            printf 'identity_stat_pid=%s status=%s\n%s\n' "$service_pid" "$identity_status" "$stat_record" >> "$service_state_probe"
            if [ "$identity_status" -ne 0 ]; then return 1; fi
            python3 - "$stat_record" "$service_pid" "$expected_start" "$expected_group" <<'PY'
          from pathlib import Path
          import sys

          raw, expected_pid, expected_start, expected_group = sys.argv[1:]
          try:
              prefix, fields = raw.strip().rsplit(") ", 1)
              pid = int(prefix.split("(", 1)[0].strip())
              columns = fields.split()
              process_group = int(columns[2])
              start = columns[19]
          except (ValueError, IndexError):
              raise SystemExit(1)
          if pid != int(expected_pid) or start != expected_start or process_group != int(expected_group):
              raise SystemExit(1)
          PY
          }
          process_is_live() {
            local pid="$1" state probe_status=0 remaining probe_timeout kill_timeout kill_status=0
            remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$remaining" -le 0 ]; then cleanup_deadline_hit=true; return 1; fi
            probe_timeout=5
            if [ "$probe_timeout" -gt "$remaining" ]; then probe_timeout="$remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${probe_timeout}s" \
              sudo -n ps -o state= -p "$pid" >> "$service_state_probe" 2>&1 || probe_status=$?
            if [ "$probe_status" -eq 124 ]; then cleanup_deadline_hit=true; return 1; fi
            if [ "$probe_status" -ne 0 ]; then return 1; fi
            state="$(awk 'NF {last=$1} END {print last}' "$service_state_probe")"
            remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$remaining" -le 0 ]; then cleanup_deadline_hit=true; return 1; fi
            kill_timeout=5
            if [ "$kill_timeout" -gt "$remaining" ]; then kill_timeout="$remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${kill_timeout}s" \
              sudo -n kill -0 "$pid" >> "$service_state_probe" 2>&1 || kill_status=$?
            if [ "$kill_status" -eq 124 ]; then cleanup_deadline_hit=true; return 1; fi
            if [ "$kill_status" -ne 0 ]; then
              return 1
            fi
            case "$state" in
              Z*|z*) return 1 ;;
              *) return 0 ;;
            esac
          }
          if [ -n "$service_pid" ] && process_is_live "$service_pid"; then
            if ! identity_matches; then
              printf 'candidate_service_cleanup=failed code=IDENTITY_MISMATCH\n' >&2
              exit 1
            fi
            remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$remaining" -le 0 ]; then printf 'candidate_service_cleanup=failed code=CLEANUP_DEADLINE\n' >&2; exit 1; fi
            term_timeout=10
            if [ "$term_timeout" -gt "$remaining" ]; then term_timeout="$remaining"; fi
            timeout --foreground --signal=TERM --kill-after=1s "${term_timeout}s" \
              sudo -n kill -TERM "$service_pid"
            stopped=false
            stop_timeout=30
            remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            if [ "$stop_timeout" -gt "$remaining" ]; then stop_timeout="$remaining"; fi
            if [ "$stop_timeout" -gt 0 ]; then for _ in $(seq 1 "$stop_timeout"); do
              if ! process_is_live "$service_pid"; then
                stopped=true
                break
              fi
              sleep 1
            done; fi
            if [ "$stopped" != true ]; then
              if ! identity_matches; then
                printf 'candidate_service_cleanup=failed code=IDENTITY_MISMATCH\n' >&2
                exit 1
              fi
              kill_status=0
              remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
              kill_timeout=10
              if [ "$kill_timeout" -gt "$remaining" ]; then kill_timeout="$remaining"; fi
              if [ "$kill_timeout" -gt 0 ]; then
                timeout --foreground --signal=KILL "${kill_timeout}s" sudo -n kill -KILL "$service_pid" || kill_status=$?
              else
                cleanup_deadline_hit=true
              fi
              printf 'candidate_service_kill=KILL status=%s\n' "$kill_status"
              force_timeout=10
              remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
              if [ "$force_timeout" -gt "$remaining" ]; then force_timeout="$remaining"; fi
              if [ "$force_timeout" -gt 0 ]; then for _ in $(seq 1 "$force_timeout"); do
                if ! process_is_live "$service_pid"; then
                  stopped=true
                  break
                fi
                sleep 1
              done; fi
            fi
            if [ "$cleanup_deadline_hit" = true ]; then printf 'candidate_service_cleanup=failed code=CLEANUP_DEADLINE\n' >&2; exit 1; fi
            test "$stopped" = true
            children_snapshot="$HANDOFF_DIR/service-children.raw.log"
            children_status=0
            remaining=$((cleanup_deadline_epoch - $(date +%s) - 1))
            children_timeout=10
            if [ "$children_timeout" -gt "$remaining" ]; then children_timeout="$remaining"; fi
            if [ "$children_timeout" -le 0 ]; then printf 'candidate_service_cleanup=failed code=CLEANUP_DEADLINE\n' >&2; exit 1; fi
            timeout --foreground --signal=TERM --kill-after=1s "${children_timeout}s" \
              ps -eo pid=,ppid=,args= > "$children_snapshot" 2>&1 || children_status=$?
            children_count="$(awk -v parent="$service_pid" '$2 == parent {count++} END {print count + 0}' "$children_snapshot")"
            emit_private_evidence service-children "$children_snapshot"
            if [ "$children_count" -ne 0 ] || [ "$children_status" -ne 0 ]; then
              printf 'candidate_service_cleanup=failed code=CHILD_PROCESSES count=%s snapshot_status=%s\n' "$children_count" "$children_status" >&2
              exit 1
            fi
          else
            printf '%s\n' 'candidate service was not running at cleanup'
          fi
          if [ "$cleanup_deadline_hit" = true ]; then
            printf 'candidate_service_cleanup=failed code=CLEANUP_DEADLINE\n' >&2
            exit 1
          fi
          emit_private_evidence service-state-probes "$service_state_probe"

      - name: Remove plaintext handoff material and prepare completion marker
        if: always()
        timeout-minutes: 1
        id: post_lane_marker_prepare
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          # Plaintext handoff material is removed even when timing metadata is
          # unavailable; marker publication itself still fails closed.
          if [ -n "${HANDOFF_DIR:-}" ]; then
            rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/upload-url.txt" "$HANDOFF_DIR/recipient.key"
          else
            printf '%s\n' 'post-lane plaintext removal skipped: handoff directory was never initialized' >&2
          fi
          run_deadline="${RUN_DEADLINE_EPOCH:-}"
          provider_deadline="${POST_LANE_DEADLINE_EPOCH:-}"
          post_lane_marker_reserve="${POST_LANE_MARKER_RESERVE_SECONDS:-}"
          if [ -z "${HANDOFF_DIR:-}" ] || ! [[ "$run_deadline" =~ ^[0-9]+$ ]] || ! [[ "$provider_deadline" =~ ^[0-9]+$ ]] || ! [[ "$post_lane_marker_reserve" =~ ^[0-9]+$ ]]; then
            printf '%s\n' 'post-lane marker preparation skipped: functional lane did not establish valid origin/provider deadlines' >&2
            exit 1
          fi
          if [ "$run_deadline" -le "$provider_deadline" ]; then
            post_deadline="$run_deadline"
          else
            post_deadline="$provider_deadline"
          fi
          post_remaining=$((post_deadline - $(date +%s)))
          if [ "$post_remaining" -lt "$post_lane_marker_reserve" ]; then
            printf 'post-lane marker preparation cannot fit before origin/provider deadline: remaining=%s required=%s\n' \
              "$post_remaining" "$post_lane_marker_reserve" >&2
            exit 1
          fi
          marker_dir="$HANDOFF_DIR/completion"
          mkdir -p "$marker_dir"
          printf 'schema=1\nrun_id=%s\nplatform=linux\nfunctional_outcome=%s\n' \
            "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$marker_dir/completion.marker"

      - name: Upload opaque completion marker
        timeout-minutes: 1
        if: always() && steps.essential_cleanup.outcome == 'success' && steps.post_lane_marker_prepare.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Upload safe functional result
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

  controller:
    name: Dispatch isolated Render lease controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      PLATFORM: linux
      SOURCE_SHA: ${{ inputs.commit_sha }}
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      LEASE_RUN_ID: ""
      REQUEST_ARTIFACT_NAME: ""

    steps:
      - name: Check out exact trusted Torturer output helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Validate controller inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["SERVER_IMAGE_DIGEST"]):
              raise SystemExit("RENDER_IMAGE_DIGEST must be immutable")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["TORTURER_SHA"]):
              raise SystemExit("TORTURER_SHA must be a full lowercase SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]):
              raise SystemExit("SOURCE_SHA must be a full lowercase SHA")
          print("controller_inputs=validated")
          PY

      - name: Derive one origin/platform lease correlation
        run: |
          set -euo pipefail
          run_id="$(printf "%s:%s:%s:%s:%s" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PLATFORM" "$TORTURER_SHA" "$SOURCE_SHA" | sha256sum | cut -c1-32)"
          printf 'LEASE_RUN_ID=%s\n' "$run_id" >> "$GITHUB_ENV"
          printf 'REQUEST_ARTIFACT_NAME=render-request-%s-%s\n' "$run_id" "$PLATFORM" >> "$GITHUB_ENV"

      - name: Wait for the client request artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" 30 controller-run "$RUNNER_TEMP/controller/controller-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          controller_deadline_epoch="$(python3 - "$RUNNER_TEMP/controller/controller-run.json" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]): raise SystemExit("controller run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          print(deadline)
          PY
          )"
          export CONTROLLER_DEADLINE_EPOCH="$controller_deadline_epoch"
          printf 'CONTROLLER_DEADLINE_EPOCH=%s\n' "$controller_deadline_epoch" >> "$GITHUB_ENV"
          printf 'controller_deadline_epoch=%s\n' "$controller_deadline_epoch"
          found=false
          for attempt in $(seq 1 180); do
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 1 ]; then printf 'controller request wait reached finalization reserve: remaining=%s\n' "$remaining" >&2; break; fi
            response="$RUNNER_TEMP/controller/request-${attempt}.json"
            api_timeout=30
            if [ "$api_timeout" -gt "$((remaining - 1))" ]; then api_timeout="$((remaining - 1))"; fi
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$api_timeout" request-artifact-poll "$response" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${REQUEST_ARTIFACT_NAME}"
            if python3 - "$response" "$GITHUB_RUN_ID" "$REQUEST_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          wanted_run = int(sys.argv[2])
          wanted_name = sys.argv[3]
          for artifact in document.get("artifacts", []):
              if artifact.get("name") != wanted_name or artifact.get("expired") is True:
                  continue
              if (artifact.get("workflow_run") or {}).get("id") == wanted_run:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              found=true
              break
            fi
            printf 'request_artifact_attempt=%s status=pending\n' "$attempt"
            sleep_seconds=5
            remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 120))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          test "$found" = true

      - name: Dispatch exactly one trusted Render lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((CONTROLLER_DEADLINE_EPOCH - $(date +%s) - 1))
          if [ "$remaining" -le 0 ]; then printf '%s\n' 'controller dispatch reached the hard workflow deadline' >&2; exit 1; fi
          dispatch_timeout=30
          if [ "$dispatch_timeout" -gt "$remaining" ]; then dispatch_timeout="$remaining"; fi
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" "$dispatch_timeout" lease-dispatch "$RUNNER_TEMP/controller/lease-dispatch.json" \
            --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
              -f "ref=${GITHUB_REF_NAME}" \
              -f "inputs[mode]=acquire" \
              -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
              -f "inputs[origin_run_attempt]=${GITHUB_RUN_ATTEMPT}" \
              -f "inputs[origin_torturer_sha]=${TORTURER_SHA}" \
              -f "inputs[origin_source_sha]=${SOURCE_SHA}" \
              -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
              -f "inputs[platform]=${PLATFORM}" \
              -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" \
              -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
          unset GH_TOKEN
