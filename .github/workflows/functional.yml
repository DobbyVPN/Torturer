name: Trusted functional Linux

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public DobbyVPN owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: trusted-functional-linux-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Trusted functional Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      PLATFORM: linux
      TORTURER_SHA: ${{ github.sha }}
      SERVER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      HANDOFF_DIR: ${{ runner.temp }}/dobbyvpn-render-handoff
      SERVICE_DIR: ${{ runner.temp }}/dobbyvpn-service
      RESULT_PATH: ${{ runner.temp }}/dobbyvpn-render-handoff/functional-result.json

    steps:
      - name: Validate trusted functional inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          repository = os.environ["SOURCE_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          image_digest = os.environ["SERVER_IMAGE_DIGEST"]
          if not re.fullmatch(r"[A-Za-z0-9.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("source_repository is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("commit_sha must be a full lowercase SHA")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest):
              raise SystemExit("RENDER_IMAGE_DIGEST must be an immutable SHA-256 digest")
          if set(image_digest.removeprefix("sha256:")) == {"0"}:
              raise SystemExit("RENDER_IMAGE_DIGEST must not be all zeroes")
          print(f"source_repository={repository}")
          print(f"source_sha={source_sha}")
          print(f"platform={os.environ['PLATFORM']}")
          print(f"torturer_sha={os.environ['TORTURER_SHA']}")
          print(f"server_image_digest={image_digest}")
          PY

      - name: Check out exact Torturer workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ github.sha }}
          path: torturer
          persist-credentials: false

      - name: Check out exact DobbyVPN candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify exact source identities and clean Torturer checkout
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build the candidate Linux service and CLI
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_build.py libs --platform linux --arch amd64
          python3 .github/scripts/desktop_build.py app --platform linux --skip-libs
          test -x kmp_module/services/ubuntu_grpcvpnserver
          test -x kmp_module/services/dobby-cli
          sha256sum kmp_module/services/ubuntu_grpcvpnserver kmp_module/services/dobby-cli

      - name: Create ephemeral recipient and lease request
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HANDOFF_DIR"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj "/CN=dobbyvpn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -keyout "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/recipient.crt"
          run_id="$(openssl rand -hex 16)"
          artifact_name="render-request-${run_id}-${PLATFORM}"
          python3 - "$HANDOFF_DIR/request.json" "$run_id" "$artifact_name" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          run_id = sys.argv[2]
          artifact_name = sys.argv[3]
          if not re.fullmatch(r"[0-9a-f]{32}", run_id):
              raise SystemExit("generated lease run id is invalid")
          if not re.fullmatch(r"render-request-[0-9a-f]{32}-linux", artifact_name):
              raise SystemExit("generated request artifact name is invalid")
          path.write_text(json.dumps({
              "schema": 1,
              "kind": "dobbyvpn.render-lease-request",
              "run_id": run_id,
              "platform": "linux",
              "image_digest": os.environ["SERVER_IMAGE_DIGEST"],
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          path.chmod(0o600)
          print(f"lease_run_id={run_id}")
          print(f"request_artifact_name={artifact_name}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"LEASE_RUN_ID={run_id}\n")
              env.write(f"REQUEST_ARTIFACT_NAME={artifact_name}\n")
          PY

      - name: Upload public certificate and opaque request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: |
            ${{ env.HANDOFF_DIR }}/request.json
            ${{ env.HANDOFF_DIR }}/recipient.crt
          if-no-files-found: error
          retention-days: 1

      - name: Dispatch trusted Render lease wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/server-lease.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[mode]=acquire" \
            -f "inputs[origin_run_id]=${GITHUB_RUN_ID}" \
            -f "inputs[lease_run_id]=${LEASE_RUN_ID}" \
            -f "inputs[platform]=${PLATFORM}" \
            -f "inputs[request_artifact_name]=${REQUEST_ARTIFACT_NAME}" \
            -f "inputs[trusted_ref]=${GITHUB_REF_NAME}"
          unset GH_TOKEN

      - name: Poll for encrypted lease response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR/lease-response"
          archive_url=""
          for attempt in $(seq 1 180); do
            response="$HANDOFF_DIR/lease-response/artifacts-${attempt}.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=render-lease-${LEASE_RUN_ID}-linux" \
              | tee "$response"
            archive_url="$(python3 - "$response" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for artifact in document.get("artifacts", []):
              if artifact.get("name") != "render-lease-" + os.environ["LEASE_RUN_ID"] + "-linux":
                  continue
              if artifact.get("expired") is True:
                  continue
              url = artifact.get("archive_download_url")
              if isinstance(url, str) and url:
                  print(url)
                  break
          PY
            )"
            if [ -n "$archive_url" ]; then
              break
            fi
            sleep 10
          done
          test -n "$archive_url"
          gh api "$archive_url" > "$HANDOFF_DIR/lease-response/lease.zip"
          unzip -l "$HANDOFF_DIR/lease-response/lease.zip"
          unzip -o "$HANDOFF_DIR/lease-response/lease.zip" -d "$HANDOFF_DIR/lease-response/unpacked"
          test -f "$HANDOFF_DIR/lease-response/unpacked/profile.cms"
          test -f "$HANDOFF_DIR/lease-response/unpacked/lease.json"

      - name: Validate and decrypt the encrypted profile
        run: |
          set -euo pipefail
          python3 - "$HANDOFF_DIR/lease-response/unpacked/lease.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": 1,
              "kind": "dobbyvpn.render-lease",
              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": "linux",
              "image_digest": os.environ["SERVER_IMAGE_DIGEST"],
              "state": "issued",
          }
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"lease field {key} is invalid")
          if not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", str(value.get("service_id"))):
              raise SystemExit("lease service id is invalid")
          print("lease_record=validated")
          PY
          openssl cms -decrypt -binary -inform DER \
            -in "$HANDOFF_DIR/lease-response/unpacked/profile.cms" \
            -recip "$HANDOFF_DIR/recipient.crt" \
            -inkey "$HANDOFF_DIR/recipient.key" \
            -out "$HANDOFF_DIR/profile.toml"
          chmod 600 "$HANDOFF_DIR/profile.toml"
          test -s "$HANDOFF_DIR/profile.toml"

      - name: Start the candidate Linux service
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$SERVICE_DIR"
          control_socket="$SERVICE_DIR/control.sock"
          service_log="$SERVICE_DIR/service.raw.log"
          sudo -n env \
            DOBBYVPN_CONTROL_SOCKET="$control_socket" \
            DOBBYVPN_CONTROL_PEER_UID="$(id -u)" \
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/candidate/go_module" \
            "$GITHUB_WORKSPACE/candidate/kmp_module/services/ubuntu_grpcvpnserver" \
            > "$service_log" 2>&1 &
          service_pid=$!
          printf 'SERVICE_PID=%s\n' "$service_pid" >> "$GITHUB_ENV"
          printf 'SERVICE_SOCKET=%s\n' "$control_socket" >> "$GITHUB_ENV"
          printf 'SERVICE_LOG=%s\n' "$service_log" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            if ! sudo -n kill -0 "$service_pid"; then
              printf '%s\n' 'candidate service exited before readiness' >&2
              cat "$service_log"
              exit 1
            fi
            if [ -S "$control_socket" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            printf '%s\n' 'candidate service did not create its control socket' >&2
            cat "$service_log"
            exit 1
          fi

      - name: Run canonical Linux functional scenarios
        id: functional
        working-directory: torturer
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.run \
            --platform linux \
            --cli "$GITHUB_WORKSPACE/candidate/kmp_module/services/dobby-cli" \
            --profile "$HANDOFF_DIR/profile.toml" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --artifact "$GITHUB_WORKSPACE/candidate/kmp_module/services/dobby-cli" \
            --server-image-digest "$SERVER_IMAGE_DIGEST" \
            --output "$RESULT_PATH" \
            --raw-log-dir "$HANDOFF_DIR/hosted-command-raw"

      - name: Stop candidate service and verify process cleanup
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SERVICE_PID:-}" ] && sudo -n kill -0 "$SERVICE_PID"; then
            sudo -n kill -TERM "$SERVICE_PID"
            stopped=false
            for attempt in $(seq 1 30); do
              if ! sudo -n kill -0 "$SERVICE_PID"; then
                stopped=true
                break
              fi
              sleep 1
            done
            if [ "$stopped" != true ]; then
              sudo -n kill -KILL "$SERVICE_PID"
              for attempt in $(seq 1 10); do
                if ! sudo -n kill -0 "$SERVICE_PID"; then
                  stopped=true
                  break
                fi
                sleep 1
              done
            fi
            test "$stopped" = true
          else
            printf '%s\n' 'candidate service was not running at cleanup'
          fi

      - name: Upload safe functional result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: functional-result-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 1

      - name: Publish opaque completion marker for trusted cleanup
        if: always()
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          set -euo pipefail
          marker_dir="$HANDOFF_DIR/completion"
          mkdir -p "$marker_dir"
          printf 'schema=1\nrun_id=%s\nplatform=linux\nfunctional_outcome=%s\n' \
            "$LEASE_RUN_ID" "$FUNCTIONAL_OUTCOME" > "$marker_dir/completion.marker"

      - name: Upload opaque completion marker
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-complete-${{ env.LEASE_RUN_ID }}-linux
          path: ${{ env.HANDOFF_DIR }}/completion/completion.marker
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext handoff material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$HANDOFF_DIR/profile.toml" "$HANDOFF_DIR/recipient.key"
