name: Render disposable-lease reaper

on:
  workflow_dispatch:
    inputs:
      name_prefix:
        description: Random lease namespace, for example dobby-torturer-<32-hex>-.
        required: true
        type: string
      older_than_seconds:
        description: Minimum age of an orphan lease before deletion.
        required: false
        default: "900"
        type: string
      active_service_ids:
        description: Comma-separated service IDs that must never be reaped.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dobbyvpn-render-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: Reap disposable Render leases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: render-functional
    steps:
      - name: Check out this trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reap only the requested random namespace
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          NAME_PREFIX: ${{ inputs.name_prefix }}
          OLDER_THAN_SECONDS: ${{ inputs.older_than_seconds }}
          ACTIVE_SERVICE_IDS: ${{ inputs.active_service_ids }}
        run: |
          set -euo pipefail
          active_args=()
          if [[ -n "$ACTIVE_SERVICE_IDS" ]]; then
            IFS=',' read -r -a active_ids <<< "$ACTIVE_SERVICE_IDS"
            for service_id in "${active_ids[@]}"; do
              active_args+=(--active-service-id "$service_id")
            done
          fi
          python3 -m torturer_provider.reaper_cli \
            --name-prefix "$NAME_PREFIX" \
            --older-than-seconds "$OLDER_THAN_SECONDS" \
            "${active_args[@]}"
