name: Trusted Render lease
run-name: Trusted Render lease ${{ inputs.lease_run_id }} ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Trusted lease operation.
        required: true
        type: choice
        options:
          - acquire
      origin_run_id:
        description: Numeric ID of the trusted functional workflow run.
        required: true
        type: string
      origin_run_attempt:
        description: Attempt number of the originating functional workflow run.
        required: true
        type: string
      origin_torturer_sha:
        description: Exact Torturer commit used by the originating workflow run.
        required: true
        type: string
      origin_source_sha:
        description: Exact DobbyVPN source commit used by the originating workflow run.
        required: true
        type: string
      origin_workflow_path:
        description: Exact trusted functional workflow path that requested this lease.
        required: false
        default: .github/workflows/functional.yml
        type: string
      lease_run_id:
        description: Exact 32-hex opaque lease correlation ID.
        required: true
        type: string
      platform:
        description: Hosted platform requesting one lease.
        required: true
        type: choice
        options:
          - linux
          - windows
          - macos
          - android
      request_artifact_name:
        description: Opaque request artifact name from the origin run.
        required: true
        type: string
      trusted_ref:
        description: Protected branch that dispatched this lease.
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  # One two-service lease at a time protects the Render account-wide service
  # cap.  The unattended functional controller must dispatch platforms
  # sequentially and wait for verified cleanup; this is only an admission
  # guard, not a matrix queue.
  group: trusted-render-lease-account
  cancel-in-progress: false

jobs:
  lease:
    name: Trusted Render lease
    runs-on: ubuntu-24.04
    # The provider controller has the same hard maximum as every client lane.
    # Its diagnostic/cleanup reserve is inside this 30-minute job bound.
    timeout-minutes: 30
    environment: render-functional
    env:
      MODE: ${{ inputs.mode }}
      ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
      ORIGIN_RUN_ATTEMPT: ${{ inputs.origin_run_attempt }}
      ORIGIN_TORTURER_SHA: ${{ inputs.origin_torturer_sha }}
      ORIGIN_SOURCE_SHA: ${{ inputs.origin_source_sha }}
      ORIGIN_WORKFLOW_PATH: ${{ inputs.origin_workflow_path }}
      LEASE_RUN_ID: ${{ inputs.lease_run_id }}
      PLATFORM: ${{ inputs.platform }}
      REQUEST_ARTIFACT_NAME: ${{ inputs.request_artifact_name }}
      TRUSTED_REF: ${{ inputs.trusted_ref }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      RENDER_IMAGE_OWNER_ID: ${{ vars.RENDER_IMAGE_OWNER_ID }}
      RENDER_IMAGE_PATH: ${{ vars.RENDER_IMAGE_PATH }}
      RENDER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
      RENDER_SINK_IMAGE_OWNER_ID: ${{ vars.RENDER_SINK_IMAGE_OWNER_ID }}
      RENDER_SINK_IMAGE_PATH: ${{ vars.RENDER_SINK_IMAGE_PATH }}
      RENDER_SINK_IMAGE_DIGEST: ${{ vars.RENDER_SINK_IMAGE_DIGEST }}
      RENDER_REGION: ${{ vars.RENDER_REGION }}
      # The lease is dispatched asynchronously.  The branch may advance between
      # the client workflow and this controller, so trust only the exact
      # revision recorded by the originating client run.
      TORTURER_SHA: ${{ inputs.origin_torturer_sha }}

    steps:
      - name: Check out exact trusted Torturer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.origin_torturer_sha }}
          path: torturer
          persist-credentials: false

      - name: Establish runner-local paths and hard thirty-minute deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          lease_dir="$RUNNER_TEMP/dobbyvpn-render-lease"
          mkdir -p "$lease_dir"
          chmod 700 "$lease_dir"
          printf 'LEASE_DIR=%s\n' "$lease_dir" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" \
            30 lease-run "$lease_dir/lease-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$lease_dir/lease-run.json" <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          run = json.loads(path.read_text(encoding="utf-8"))
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("lease run identity mismatch")
          started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
          deadline = int(started.timestamp()) + 30 * 60
          # RenderAPI uses a 20-second transport timeout, two retries, and
          # 0.5s/1s backoff.  A stale journal can require an exact existence
          # probe, delete, and final existence probe per service.  A
          # journal-only namespace repair can additionally require one list,
          # delete+verify for each unknown service, a second list, and the
          # final absence list.  The one-known/one-unknown two-service case is
          # the worst bounded path: eight API calls at 61.5 seconds each.
          render_api_timeout_seconds = 20
          render_api_retry_attempts = 2
          render_api_backoff_seconds = 0.5 + 1.0
          render_api_attempt_seconds = (
              (render_api_retry_attempts + 1) * render_api_timeout_seconds
              + render_api_backoff_seconds
          )
          cleanup_provider_api_calls = 8
          cleanup_provider_worst_case_seconds = (
              cleanup_provider_api_calls * render_api_attempt_seconds
          )
          cleanup_command_seconds = 600
          reserve = 680
          cleanup_kill_grace_seconds = 1
          plaintext_cleanup_seconds = 4
          plaintext_kill_grace_seconds = 1
          evidence_upload_seconds = 60
          finalization_overhead_seconds = 10
          finalization_components = (
              cleanup_command_seconds,
              cleanup_kill_grace_seconds,
              plaintext_cleanup_seconds,
              plaintext_kill_grace_seconds,
              evidence_upload_seconds,
              finalization_overhead_seconds,
          )
          if cleanup_provider_worst_case_seconds >= cleanup_command_seconds:
              raise SystemExit(
                  "cleanup command budget does not cover worst-case provider retries"
              )
          if sum(finalization_components) > reserve:
              raise SystemExit(
                  "finalization sub-budgets exceed the configured cleanup reserve"
              )
          if int(datetime.datetime.now(datetime.timezone.utc).timestamp()) >= deadline:
              raise SystemExit("lease workflow already exceeded its hard deadline")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"LEASE_DEADLINE_EPOCH={deadline}\n")
              output.write(f"LEASE_CLEANUP_RESERVE_SECONDS={reserve}\n")
              output.write(f"LEASE_CLEANUP_COMMAND_SECONDS={cleanup_command_seconds}\n")
              output.write(
                  "LEASE_CLEANUP_PROVIDER_WORST_CASE_SECONDS="
                  f"{int(cleanup_provider_worst_case_seconds)}\n"
              )
              output.write(f"LEASE_CLEANUP_KILL_GRACE_SECONDS={cleanup_kill_grace_seconds}\n")
              output.write(f"LEASE_PLAINTEXT_CLEANUP_SECONDS={plaintext_cleanup_seconds}\n")
              output.write(f"LEASE_PLAINTEXT_KILL_GRACE_SECONDS={plaintext_kill_grace_seconds}\n")
              output.write(f"LEASE_EVIDENCE_UPLOAD_SECONDS={evidence_upload_seconds}\n")
              output.write(f"LEASE_FINALIZATION_OVERHEAD_SECONDS={finalization_overhead_seconds}\n")
          print(f"lease_workflow_started_epoch={int(started.timestamp())}")
          print(f"lease_workflow_deadline_epoch={deadline}")
          print(f"lease_cleanup_reserve_seconds={reserve}")
          print(
              "lease_cleanup_provider_worst_case_seconds="
              f"{int(cleanup_provider_worst_case_seconds)}"
          )
          print(f"lease_finalization_sub_budget_sum={sum(finalization_components)}")
          PY
          unset GH_TOKEN

      - name: Validate trusted lease boundary
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$LEASE_DIR"
          chmod 700 "$LEASE_DIR"
          test "$MODE" = acquire
          test "$GITHUB_REF_NAME" = "$TRUSTED_REF"
          test "$GITHUB_REF_NAME" = "transition/functional-render" || test "$GITHUB_REF_NAME" = "main"
          python3 - <<'PY'
          import hashlib
          import os
          import re

          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              raise SystemExit("lease must be manually dispatched")
          platform = os.environ["PLATFORM"]
          if platform not in {"linux", "windows", "macos", "android"}:
              raise SystemExit("hosted platform is not enabled")
          if not re.fullmatch(r"[0-9]+", os.environ["ORIGIN_RUN_ID"]):
              raise SystemExit("origin_run_id is invalid")
          if not re.fullmatch(r"[0-9]+", os.environ["ORIGIN_RUN_ATTEMPT"]):
              raise SystemExit("origin_run_attempt is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["ORIGIN_TORTURER_SHA"]):
              raise SystemExit("origin_torturer_sha is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["ORIGIN_SOURCE_SHA"]):
              raise SystemExit("origin_source_sha is invalid")
          origin_platforms = {
              ".github/workflows/functional.yml": "linux",
              ".github/workflows/functional-windows.yml": "windows",
              ".github/workflows/functional-macos.yml": "macos",
              ".github/workflows/functional-android.yml": "android",
          }
          origin_workflow_path = os.environ["ORIGIN_WORKFLOW_PATH"]
          if origin_workflow_path not in origin_platforms:
              raise SystemExit("origin workflow path is not allow-listed")
          if origin_platforms[origin_workflow_path] != platform:
              raise SystemExit("origin workflow path does not match platform")
          origin_id = os.environ["ORIGIN_RUN_ID"]
          origin_attempt = os.environ["ORIGIN_RUN_ATTEMPT"]
          expected_lease = hashlib.sha256(
              f"{origin_id}:{origin_attempt}:{platform}:{os.environ['ORIGIN_TORTURER_SHA']}:{os.environ['ORIGIN_SOURCE_SHA']}".encode()
          ).hexdigest()[:32]
          if os.environ["LEASE_RUN_ID"] != expected_lease:
              raise SystemExit("lease_run_id does not match origin correlation")
          expected_artifact = f"render-request-{os.environ['LEASE_RUN_ID']}-{platform}"
          if os.environ["REQUEST_ARTIFACT_NAME"] != expected_artifact:
              raise SystemExit("request_artifact_name is invalid")
          digest = os.environ["RENDER_IMAGE_DIGEST"]
          image_path = os.environ["RENDER_IMAGE_PATH"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("RENDER_IMAGE_DIGEST is not immutable")
          if not image_path.endswith("@" + digest):
              raise SystemExit("RENDER_IMAGE_PATH must end in the configured digest")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/@-]{2,255}", image_path):
              raise SystemExit("RENDER_IMAGE_PATH is invalid")
          sink_digest = os.environ["RENDER_SINK_IMAGE_DIGEST"]
          sink_path = os.environ["RENDER_SINK_IMAGE_PATH"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", sink_digest):
              raise SystemExit("RENDER_SINK_IMAGE_DIGEST is not immutable")
          if not sink_path.endswith("@" + sink_digest):
              raise SystemExit("RENDER_SINK_IMAGE_PATH must end in the configured digest")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/@-]{2,255}", sink_path):
              raise SystemExit("RENDER_SINK_IMAGE_PATH is invalid")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", os.environ["RENDER_SINK_IMAGE_OWNER_ID"]):
              raise SystemExit("RENDER_SINK_IMAGE_OWNER_ID is invalid")
          for name in ("RENDER_OWNER_ID", "RENDER_IMAGE_OWNER_ID"):
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", os.environ[name]):
                  raise SystemExit(f"{name} is invalid")
          if os.environ["RENDER_REGION"] not in {"frankfurt", "oregon", "ohio", "singapore", "virginia"}:
              raise SystemExit("RENDER_REGION is unsupported")
          print("trusted_lease_boundary=validated")
          PY

      - name: Verify trusted Torturer checkout
        run: |
          set -euo pipefail
          test "$(git -C torturer rev-parse HEAD)" = "$TORTURER_SHA"
          test -z "$(git -C torturer status --porcelain=v1 --untracked-files=all)"

      - name: Verify origin workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" \
            30 origin-run "$LEASE_DIR/origin-run.json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}"
          python3 - "$LEASE_DIR/origin-run.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("id") != int(os.environ["ORIGIN_RUN_ID"]):
              raise SystemExit("origin run identity mismatch")
          if value.get("run_attempt") != int(os.environ["ORIGIN_RUN_ATTEMPT"]):
              raise SystemExit("origin run attempt mismatch")
          if value.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("origin run repository mismatch")
          if value.get("event") != "workflow_dispatch":
              raise SystemExit("origin run trigger is not trusted manual dispatch")
          if value.get("head_branch") != os.environ["TRUSTED_REF"]:
              raise SystemExit("origin run branch mismatch")
          if value.get("head_sha") != os.environ["ORIGIN_TORTURER_SHA"]:
              raise SystemExit("origin Torturer commit mismatch")
          if value.get("head_sha") != os.environ["TORTURER_SHA"]:
              raise SystemExit("provider Torturer commit drifted from origin")
          if value.get("path") != os.environ["ORIGIN_WORKFLOW_PATH"]:
              raise SystemExit("origin run workflow mismatch")
          print("origin_run=validated")
          PY

      - name: Reject a second lease for this origin and platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="render-lease-${LEASE_RUN_ID}-${PLATFORM}"
          "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" \
            30 existing-lease-artifacts "$LEASE_DIR/existing-lease-artifacts.json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}"
          python3 - "$LEASE_DIR/existing-lease-artifacts.json" "$artifact_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_name = sys.argv[2]
          for artifact in document.get("artifacts", []):
              if artifact.get("name") != expected_name:
                  continue
              if artifact.get("expired") is not True:
                  raise SystemExit("one Render lease already exists for this origin/platform")
          print("origin_lease_slot=available")
          PY

      - name: Download and validate opaque lease request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
          if [ "$remaining" -le 1 ]; then
            printf 'lease request download reached the cleanup reserve: remaining=%s\n' "$remaining" >&2
            exit 1
          fi
          command_timeout=$((remaining - 1))
          if [ "$command_timeout" -gt 900 ]; then command_timeout=900; fi
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$command_timeout" --kill-grace-seconds 1 \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$REQUEST_ARTIFACT_NAME" \
            --run-id "$ORIGIN_RUN_ID" \
            --output-dir "$LEASE_DIR/request/unpacked" \
            --metadata "$LEASE_DIR/request/artifacts.json" \
            --archive "$LEASE_DIR/request/request.zip" \
            --expect-file request.json \
            --expect-file recipient.crt
          unset GH_TOKEN
          python3 - "$LEASE_DIR/request/unpacked" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          files = {path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()}
          if files != {"request.json", "recipient.crt"}:
              raise SystemExit(f"request artifact contains unexpected files: {sorted(files)}")
          request = json.loads((root / "request.json").read_text(encoding="utf-8"))
          expected = {
             "schema": 1,
             "kind": "dobbyvpn.render-lease-request",
              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": os.environ["PLATFORM"],
             "source_sha": os.environ["ORIGIN_SOURCE_SHA"],
              "image_digest": os.environ["RENDER_IMAGE_DIGEST"],
          }
          if request != expected:
              raise SystemExit("lease request does not match trusted inputs")
          cert = root / "recipient.crt"
          if cert.is_symlink() or not cert.is_file() or cert.stat().st_size > 16 * 1024:
              raise SystemExit("recipient certificate is invalid")
          cert.chmod(0o600)
          print("lease_request=validated")
          PY

      - name: Acquire disposable Render service and upload sink
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$LEASE_DIR"
          test -n "$RENDER_API_TOKEN"
          remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
          if [ "$remaining" -le 61 ]; then
            printf 'Render acquisition reached the cleanup reserve: remaining=%s\n' "$remaining" >&2
            exit 1
          fi
          command_timeout=$((remaining - 1))
          if [ "$command_timeout" -gt 900 ]; then command_timeout=900; fi
          readiness_timeout=$((command_timeout - 60))
          if [ "$readiness_timeout" -le 0 ]; then
            printf 'Render acquisition has no bounded readiness budget: seconds=%s\n' "$readiness_timeout" >&2
            exit 1
          fi
          acquire_args=(
            --request "$LEASE_DIR/request/unpacked/request.json" \
            --owner-id "$RENDER_OWNER_ID" \
            --image-owner-id "$RENDER_IMAGE_OWNER_ID" \
            --image-path "$RENDER_IMAGE_PATH" \
            --expected-image-digest "$RENDER_IMAGE_DIGEST" \
            --profile-output "$LEASE_DIR/profile.toml" \
            --lease-output "$LEASE_DIR/lease.json" \
            --safe-result-output "$LEASE_DIR/acquire-result.json" \
            --journal "$LEASE_DIR/journal.json" \
            --region "$RENDER_REGION" \
            --timeout-seconds "$readiness_timeout" \
            --poll-seconds 5
          )
          acquire_args+=(
            --sink-image-owner-id "$RENDER_SINK_IMAGE_OWNER_ID" \
            --sink-image-path "$RENDER_SINK_IMAGE_PATH" \
            --expected-sink-image-digest "$RENDER_SINK_IMAGE_DIGEST" \
            --upload-url-output "$LEASE_DIR/upload-url.txt"
          )
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$command_timeout" --kill-grace-seconds 1 \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_provider.lease_cli acquire "${acquire_args[@]}"
          test -f "$LEASE_DIR/profile.toml"
          test -f "$LEASE_DIR/lease.json"
          test -f "$LEASE_DIR/journal.json"
          test -f "$LEASE_DIR/upload-url.txt"
          python3 - "$LEASE_DIR/lease.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(value, dict):
              raise SystemExit("lease bundle is not an object")
          expected = {
              "schema": 2,
              "kind": "dobbyvpn.render-lease",
              "run_id": os.environ["LEASE_RUN_ID"],
              "platform": os.environ["PLATFORM"],
              "source_sha": os.environ["ORIGIN_SOURCE_SHA"],
              "state": "issued",
          }
          if set(value) != set(expected) | {"services"}:
              raise SystemExit("lease bundle has an unsafe top-level shape")
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"lease bundle field {key} is invalid")
          services = value.get("services")
          if not isinstance(services, list) or len(services) != 2:
              raise SystemExit("lease must contain exactly two services")
          expected_digests = {
              "outline": os.environ["RENDER_IMAGE_DIGEST"],
              "upload-sink": os.environ["RENDER_SINK_IMAGE_DIGEST"],
          }
          services_by_role = {}
          for service in services:
              if not isinstance(service, dict) or set(service) != {"role", "service_id", "image_digest", "provider_generation"}:
                  raise SystemExit("lease service shape is invalid")
              role = service["role"]
              if role not in expected_digests or role in services_by_role:
                  raise SystemExit("lease service roles are incomplete or duplicated")
              services_by_role[role] = service
              if not isinstance(service["service_id"], str) or not re.fullmatch(r"srv-[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["service_id"]):
                  raise SystemExit("lease service ID is invalid")
              if not isinstance(service["image_digest"], str) or service["image_digest"] != expected_digests[role]:
                  raise SystemExit("lease service image identity is invalid")
              if not isinstance(service["provider_generation"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{1,99}", service["provider_generation"]):
                  raise SystemExit("lease provider generation is invalid")
          if set(services_by_role) != set(expected_digests):
              raise SystemExit("lease service roles are incomplete or duplicated")
          service_ids = [service["service_id"] for service in services]
          if len(set(service_ids)) != len(service_ids):
              raise SystemExit("lease service IDs must be distinct")
          if any(token in json.dumps(value).lower() for token in ("url", "path", "password", "secret")):
              raise SystemExit("safe lease record contains private handoff data")
          print("lease_identity=validated")
          PY

      - name: Report safe Render acquisition result
        if: always()
        run: |
          set -euo pipefail
          result="$LEASE_DIR/acquire-result.json"
          if [ ! -f "$result" ]; then
            printf '%s\n' 'render_acquisition status=failed code=SAFE_RESULT_MISSING' >&2
            exit 1
          fi
          python3 - "$result" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file() or path.stat().st_mode & 0o077:
              raise SystemExit("safe acquisition result is not owner-only")
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": 1,
              "kind": "dobbyvpn.render-lease-command-result",
              "command": "acquire",
          }
          if not isinstance(value, dict) or set(value) != set(expected) | {"status", "code"}:
              raise SystemExit("safe acquisition result has an invalid shape")
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"safe acquisition result field {key} is invalid")
          status = value.get("status")
          code = value.get("code")
          if status not in {"completed", "failed"}:
              raise SystemExit("safe acquisition result status is invalid")
          if not isinstance(code, str) or re.fullmatch(r"[A-Z][A-Z0-9_]{1,127}", code) is None:
              raise SystemExit("safe acquisition result code is invalid")
          if status == "completed" and code != "OK":
              raise SystemExit("completed acquisition result code is invalid")
          if status == "failed" and code == "OK":
              raise SystemExit("failed acquisition result code is invalid")
          print(f"render_acquisition status={status} code={code}")
          if status == "failed":
              raise SystemExit(1)
          PY

      - name: Encrypt and publish the profile and upload handoffs
        run: |
          set -euo pipefail
          umask 077
          remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
          if [ "$remaining" -le 2 ]; then
            printf 'profile encryption reached the cleanup reserve: remaining=%s\n' "$remaining" >&2
            exit 1
          fi
          # Encrypt two independent CMS handoffs.  Split the remaining
          # budget so both bounded children and their one-second reaping tails
          # stay inside the shared finalization reserve.
          encryption_timeout=$(( (remaining - 3) / 2 ))
          if [ "$encryption_timeout" -le 0 ]; then
            printf 'insufficient aggregate CMS encryption budget: seconds=%s\n' "$remaining" >&2
            exit 1
          fi
          if [ "$encryption_timeout" -gt 60 ]; then encryption_timeout=60; fi
          printf 'profile_encryption_timeout_seconds=%s\n' "$encryption_timeout"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$encryption_timeout" --kill-grace-seconds 1 \
            openssl cms -encrypt -binary -aes-256-gcm \
            -in "$LEASE_DIR/profile.toml" \
            -out "$LEASE_DIR/profile.cms" \
            -outform DER \
            "$LEASE_DIR/request/unpacked/recipient.crt"
          test -s "$LEASE_DIR/profile.cms"
          rm -f "$LEASE_DIR/profile.toml"
          test -s "$LEASE_DIR/upload-url.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$encryption_timeout" --kill-grace-seconds 1 \
            openssl cms -encrypt -binary -aes-256-gcm \
            -in "$LEASE_DIR/upload-url.txt" \
            -out "$LEASE_DIR/upload.cms" \
            -outform DER \
            "$LEASE_DIR/request/unpacked/recipient.crt"
          test -s "$LEASE_DIR/upload.cms"
          rm -f "$LEASE_DIR/upload-url.txt"

      - name: Upload encrypted profile and safe lease record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: render-lease-${{ inputs.lease_run_id }}-${{ inputs.platform }}
          path: |
            ${{ env.LEASE_DIR }}/profile.cms
            ${{ env.LEASE_DIR }}/lease.json
            ${{ env.LEASE_DIR }}/upload.cms
          if-no-files-found: error
          retention-days: 1

      - name: Mark the issued lease as actively testing
        run: |
          set -euo pipefail
          remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
          if [ "$remaining" -le 1 ]; then
            printf 'lease activation reached the cleanup reserve: remaining=%s\n' "$remaining" >&2
            exit 1
          fi
          command_timeout=$((remaining - 1))
          if [ "$command_timeout" -gt 30 ]; then command_timeout=30; fi
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
            --timeout-seconds "$command_timeout" --kill-grace-seconds 1 \
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_provider.lease_cli begin-testing \
            --lease "$LEASE_DIR/lease.json" \
            --journal "$LEASE_DIR/journal.json"

      - name: Wait for opaque functional completion marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker_name="render-complete-${LEASE_RUN_ID}-${PLATFORM}"
          marker_found=false
          for attempt in $(seq 1 180); do
            remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
            if [ "$remaining" -le 1 ]; then
              printf 'completion marker wait reached the cleanup reserve: remaining=%s\n' "$remaining" >&2
              break
            fi
            poll_timeout=30
            if [ "$poll_timeout" -gt $((remaining - 1)) ]; then
              poll_timeout=$((remaining - 1))
            fi
            response="$LEASE_DIR/completion-${attempt}.json"
            "$GITHUB_WORKSPACE/torturer/.github/scripts/private-gh-api.sh" \
              "$poll_timeout" completion-poll "$response" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker_name}"
            if python3 - "$response" "$ORIGIN_RUN_ID" "$marker_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          wanted_run = int(sys.argv[2])
          wanted_name = sys.argv[3]
          for artifact in document.get("artifacts", []):
              if artifact.get("name") != wanted_name:
                  continue
              workflow_run = artifact.get("workflow_run") or {}
              if workflow_run.get("id") != wanted_run or artifact.get("expired") is True:
                  continue
              print("completion_marker=found")
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              marker_found=true
              break
            fi
            sleep_seconds=10
            remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s) - LEASE_CLEANUP_RESERVE_SECONDS))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$sleep_seconds" -gt "$remaining" ]; then sleep_seconds="$remaining"; fi
            sleep "$sleep_seconds"
          done
          if [ "$marker_found" != true ]; then
            printf '%s\n' 'functional completion marker deadline expired' >&2
            exit 1
          fi

      - name: Delete the exact Render service and verify absence
        if: always()
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f "$LEASE_DIR/journal.json" ]; then
            test -n "$RENDER_API_TOKEN"
            cleanup_args=(
              --journal "$LEASE_DIR/journal.json"
              --request "$LEASE_DIR/request/unpacked/request.json"
              --owner-id "$RENDER_OWNER_ID"
            )
            if [ -f "$LEASE_DIR/lease.json" ]; then
              cleanup_args+=(--lease "$LEASE_DIR/lease.json")
            fi
            remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 1 ]; then
              printf 'Render cleanup reached the hard deadline: remaining=%s\n' "$remaining" >&2
              exit 1
            fi
            command_timeout=$((remaining - 1))
            cleanup_command_limit="$LEASE_CLEANUP_COMMAND_SECONDS"
            if [ "$command_timeout" -gt "$cleanup_command_limit" ]; then
              command_timeout="$cleanup_command_limit"
            fi
            PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.deadline \
              --timeout-seconds "$command_timeout" --kill-grace-seconds "$LEASE_CLEANUP_KILL_GRACE_SECONDS" \
              env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_provider.lease_cli cleanup "${cleanup_args[@]}"
          else
            printf '%s\n' 'no lease journal exists; no provider request reached service creation'
          fi

      - name: Remove plaintext lease material
        if: always()
        run: |
          set -euo pipefail
          lease_dir="${LEASE_DIR:-}"
          if [ -z "$lease_dir" ]; then
            printf '%s\n' 'lease directory was never established; no plaintext lease material to remove'
            exit 0
          fi
          remaining=$((LEASE_DEADLINE_EPOCH - $(date +%s)))
          if [ "$remaining" -le 1 ]; then
            printf 'plaintext cleanup reached the hard deadline: remaining=%s\n' "$remaining" >&2
            exit 1
          fi
          command_timeout=$((remaining - 1))
          if [ "$command_timeout" -gt "$LEASE_PLAINTEXT_CLEANUP_SECONDS" ]; then
            command_timeout="$LEASE_PLAINTEXT_CLEANUP_SECONDS"
          fi
          timeout --foreground --signal=TERM --kill-after="${LEASE_PLAINTEXT_KILL_GRACE_SECONDS}s" "${command_timeout}s" \
            rm -f "$lease_dir/profile.toml" "$lease_dir/upload-url.txt" "$lease_dir/request/unpacked/recipient.crt"

      - name: Upload safe lease journal
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        timeout-minutes: 1
        with:
          name: render-lease-journal-${{ inputs.lease_run_id }}-${{ inputs.platform }}
          path: |
            ${{ env.LEASE_DIR }}/lease.json
            ${{ env.LEASE_DIR }}/journal.json
            ${{ env.LEASE_DIR }}/acquire-result.json
          if-no-files-found: warn
          retention-days: 1
