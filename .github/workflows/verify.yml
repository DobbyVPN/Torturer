      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate candidate Go version
        id: go_version
        env:
          GO_VERSION_FILE: ${{ github.workspace }}/candidate/.go-version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = Path(os.environ["GO_VERSION_FILE"]).read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"1\.\d{1,2}(?:\.\d{1,2})?(?:rc\d+|beta\d+)?", version):
              raise SystemExit("candidate .go-version must contain one supported numeric Go version")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Set up candidate Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ steps.go_version.outputs.version }}
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install required Android SDK packages and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "system-images;android-35;google_apis;x86_64"

      - name: Initialise gomobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          "$(go env GOPATH)/bin/gomobile" init

      - name: Enable KVM for the job-local emulator
        run: sudo chmod a+rw /dev/kvm

      - name: Run public Android helper
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        working-directory: torturer
        run: |
          python3 tests/android/run_contract.py \
            --candidate-root "$CANDIDATE_DIR" \
            --commit-sha "$EXPECTED_COMMIT" \
            --sdk-root "$ANDROID_SDK_ROOT" \
            --work-dir "$RUNNER_TEMP/torturer-android"
