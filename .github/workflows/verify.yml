  ios_simulator:
    name: Torturer / iOS Simulator core contract
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out pinned Torturer helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: 57faf08cd85bcd7e4ee8eb29bab3b196c93ec70b
          path: torturer
          persist-credentials: false

      - name: Validate untrusted request identity
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "torturer")
          from torturer_contract.request import ValidationError, VerificationRequest

          try:
              request = VerificationRequest.parse(
                  source_repository=os.environ["SOURCE_REPOSITORY"],
                  commit_sha=os.environ["COMMIT_SHA"],
                  pr_number=os.environ["PR_NUMBER"],
              )
          except ValidationError as error:
              raise SystemExit(f"invalid reusable-workflow input: {error}") from error
          print(request.to_json())
          PY

      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify exact clean candidate identity
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 - <<'PY'
          import json
          import os
          from torturer_checks.ios_simulator import source_identity_from_simulator_checkout

          identity = source_identity_from_simulator_checkout(
              os.environ["CANDIDATE_DIR"],
              repository=os.environ["SOURCE_REPOSITORY"],
              expected_commit=os.environ["EXPECTED_COMMIT"],
          )
          print(json.dumps(
              {"repository": identity.repository, "commit": identity.commit},
              sort_keys=True,
              separators=(",", ":"),
          ))
          PY

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate candidate Go version
        id: ios_go_version
        env:
          GO_VERSION_FILE: ${{ github.workspace }}/candidate/.go-version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = Path(os.environ["GO_VERSION_FILE"]).read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"1\.\d{1,2}(?:\.\d{1,2})?(?:rc\d+|beta\d+)?", version):
              raise SystemExit("candidate .go-version must contain one supported numeric Go version")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Set up candidate Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ steps.ios_go_version.outputs.version }}
          cache: false

      - name: Build public Go Simulator framework
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: |
          test -f "$CANDIDATE_DIR/go_module/sessionapi/v2/api.go"
          test -f "$CANDIDATE_DIR/go_module/sessionapi/runtime/lifecycle.go"
          test ! -e "$CANDIDATE_DIR/go_module/modules/Cloak"
          cd "$CANDIDATE_DIR/go_module"
          go mod download
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          "$(go env GOPATH)/bin/gomobile" init
          ./scripts/build_ios_xcframework.sh
          ditto DobbyVPNRuntime.xcframework ../swift_module/DobbyVPNRuntime.xcframework

      - name: Verify pinned iOS evidence helper
        working-directory: torturer
        run: python3 -m unittest discover -s tests/ios -p 'test_*.py'

      - name: Run exact production Swift lifecycle tests
        working-directory: candidate
        run: swift test --enable-code-coverage --package-path swift_module

      - name: Link and test shared KMP code on iOS Simulator
        working-directory: candidate/kmp_module
        run: |
          ./gradlew \
            :app:linkDebugFrameworkIosSimulatorArm64 \
            :app:iosSimulatorArm64Test \
            --stacktrace

      - name: Stage KMP Simulator framework
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: >-
          ditto
          "$CANDIDATE_DIR/kmp_module/app/build/bin/iosSimulatorArm64/debugFramework/app.framework"
          "$CANDIDATE_DIR/swift_module/app.framework"

      - name: Run public unsigned iOS Simulator app contract
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          TORTURER_IOS_WORK_DIR: ${{ runner.temp }}/torturer-ios-simulator
          TORTURER_IOS_SIMULATOR_ARCH: arm64
        working-directory: torturer
        run: |
          python3 tests/ios/run_app_contract.py \
            --candidate-root "$CANDIDATE_DIR" \
            --source-repository "$SOURCE_REPOSITORY" \
            --commit-sha "$EXPECTED_COMMIT" \
            --work-dir "$TORTURER_IOS_WORK_DIR" \
            --architecture "$TORTURER_IOS_SIMULATOR_ARCH"

