name: Torturer verification

on:
  workflow_call:
    inputs:
      source_repository:
        description: Public GitHub owner/repository containing the candidate.
        required: true
        type: string
      commit_sha:
        description: Exact lowercase 40-character candidate commit SHA.
        required: true
        type: string
      pr_number:
        description: Positive pull-request number for diagnostics.
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Torturer / artifact contract (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned Torturer helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: 57faf08cd85bcd7e4ee8eb29bab3b196c93ec70b
          path: torturer
          persist-credentials: false

      - name: Validate untrusted request identity
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "torturer")
          from torturer_contract.request import ValidationError, VerificationRequest

          try:
              request = VerificationRequest.parse(
                  source_repository=os.environ["SOURCE_REPOSITORY"],
                  commit_sha=os.environ["COMMIT_SHA"],
                  pr_number=os.environ["PR_NUMBER"],
              )
          except ValidationError as error:
              raise SystemExit(f"invalid reusable-workflow input: {error}") from error
          print(request.to_json())
          PY

      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify candidate checkout identity
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          actual_commit="$(git -C "$CANDIDATE_DIR" rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Run public Linux helper
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        working-directory: torturer
        run: >-
          python3 -m torturer_checks.linux_slice
          --candidate "$CANDIDATE_DIR"
          --commit-sha "$EXPECTED_COMMIT"
          --allow-bootstrap

      - name: Record diagnostic request identity
        if: always()
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/torturer-diagnostics
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["DIAGNOSTICS_DIR"], "request.json").write_text(
              json.dumps(
                  {
                      "source_repository": os.environ["SOURCE_REPOSITORY"],
                      "commit_sha": os.environ["COMMIT_SHA"],
                      "pr_number": os.environ["PR_NUMBER"],
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload diagnostic request identity
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: torturer-linux-request
          path: ${{ runner.temp }}/torturer-diagnostics/request.json
          if-no-files-found: error

  windows:
    name: Torturer / artifact contract (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out pinned Torturer helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DobbyVPN/Torturer
          ref: 57faf08cd85bcd7e4ee8eb29bab3b196c93ec70b
          path: torturer
          persist-credentials: false

      - name: Validate untrusted request identity
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python -c "import os, sys; sys.path.insert(0, 'torturer'); from torturer_contract.request import VerificationRequest; print(VerificationRequest.parse(source_repository=os.environ['SOURCE_REPOSITORY'], commit_sha=os.environ['COMMIT_SHA'], pr_number=os.environ['PR_NUMBER']).to_json())"

      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          path: candidate
          persist-credentials: false
          submodules: recursive

      - name: Verify candidate checkout identity
        shell: pwsh
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          $actualCommit = git -C $env:CANDIDATE_DIR rev-parse HEAD
          if ($actualCommit.Trim() -cne $env:EXPECTED_COMMIT) { throw "candidate checkout does not match the requested commit" }

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Run public Windows helper
        shell: pwsh
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        working-directory: torturer
        run: >-
          python -m torturer_checks.desktop_slice
          --candidate "$env:CANDIDATE_DIR"
          --commit-sha "$env:EXPECTED_COMMIT"
          --platform windows
          --arch amd64
          --allow-bootstrap

