        with:
          repository: DobbyVPN/Torturer
          ref: 57faf08cd85bcd7e4ee8eb29bab3b196c93ec70b
          path: torturer
          persist-credentials: false

      - name: Validate untrusted request identity
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "torturer")
          from torturer_contract.request import ValidationError, VerificationRequest

          try:
              request = VerificationRequest.parse(
                  source_repository=os.environ["SOURCE_REPOSITORY"],
                  commit_sha=os.environ["COMMIT_SHA"],
                  pr_number=os.environ["PR_NUMBER"],
              )
          except ValidationError as error:
              raise SystemExit(f"invalid reusable-workflow input: {error}") from error
          print(request.to_json())
          PY

      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
